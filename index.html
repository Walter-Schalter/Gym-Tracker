        const fresh = buildDraftForSplit(saved.splitId, saved.date);
        if (draftShape(fresh) !== draftShape(saved)) saved.touched = true;
      }
      if (saved.touched) {
        S.draft = saved;
        S.drafts[draftKey(saved.date, saved.splitId)] = saved;
        return;
      }
      openDay(saved.date, splitById(saved.splitId) ? saved.splitId : null);
    }

    /**
     * Wie touchDraft(), aber für einen bestimmten Entwurf, der nicht mehr der angezeigte sein muss – etwa wenn
     * „Rückgängig“ erst nach einem Tageswechsel getippt wird. Markiert und gesichert wird genau dieser Entwurf;
     * der gerade angezeigte Tag bleibt unberührt.
     */
    function touchDraftOf(d) {
      if (!d) return;
      if (d === S.draft) { touchDraft(); return; }
      if (d.editingSessionId) return;                              // verlassene Bearbeitung: wurde beim Verlassen gespeichert oder verworfen
      const key = draftKey(d.date, d.splitId);
      if (S.drafts[key] !== d) return;                             // Entwurf gibt es nicht mehr (abgeschlossen, zurückgesetzt)
      d.touched = true;
      Persist.listNow([key]);
    }

    /** Aktuelle Trainingsdauer des Entwurfs in Sekunden. */
    function draftElapsedSec(d = S.draft) {
      if (!d) return 0;
      const base = Number(d.timerElapsed) || 0;
      const running = Number(d.timerStartedAt) > 0 ? Math.max(0, Math.floor((Date.now() - d.timerStartedAt) / 1000)) : 0;
      return base + running;
    }

    /** Formatiert Sekunden als mm:ss bzw. h:mm:ss für den Live-Timer. */
    function fmtTimer(sec) {
      const s = Math.max(0, Math.floor(Number(sec) || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      return h > 0 ? `${h}:${pad2(m)}:${pad2(r)}` : `${pad2(m)}:${pad2(r)}`;
    }

    /** Kompakte Dauer für Verlauf & Kalender (z. B. „48 Min.“ oder „1 Std. 12 Min.“). */
    function fmtDurationShort(sec) {
      const s = Math.max(0, Math.floor(Number(sec) || 0));
      if (!s) return '';
      if (s < 60) return `${s} Sek.`;
      const totalMin = Math.round(s / 60);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      if (h > 0) return m > 0 ? `${h} Std. ${m} Min.` : `${h} Std.`;
      return `${totalMin} Min.`;
    }

    /** Lesbare Dauer für die Abschluss-Meldung (z. B. „48 Min. (48:15)“). */
    function fmtDurationText(sec) {
      const s = Math.max(0, Math.floor(Number(sec) || 0));
      if (s < 60) return `${s} Sek.`;
      return `${fmtDurationShort(s)} (${fmtTimer(s)})`;
    }

    let workoutTimerInterval = null;
    function syncTimerInterval() {
      const d = S.draft;
      const shouldTick = Boolean(d && d.timerStartedAt && S.ui.tab === 'workout');
      if (shouldTick && !workoutTimerInterval) {
        workoutTimerInterval = setInterval(() => {
          const el = document.querySelector('[data-workout-timer]');
          if (!el || !S.draft || !S.draft.timerStartedAt) {
            clearInterval(workoutTimerInterval);
            workoutTimerInterval = null;
            return;
          }
          el.textContent = fmtTimer(draftElapsedSec(S.draft));
        }, 1000);
      } else if (!shouldTick && workoutTimerInterval) {
        clearInterval(workoutTimerInterval);
        workoutTimerInterval = null;
      }
    }

    /** Setzt die automatisch gestartete Startzeit zurück, wenn kein Satz mehr abgehakt ist. */
    function reconcileTimerAfterUncheck(d = S.draft) {
      if (!d || d.editingSessionId || d.timerManual || (Number(d.timerElapsed) || 0) > 0) return;
      const anyChecked = (d.entries || []).some((e) => (e.sets || []).some((s) => s.completed));
      if (!anyChecked && d.timerStartedAt) {
        delete d.timerStartedAt;
        if (d === S.draft) syncTimerInterval();
      }
    }

    /** Muss nach jeder Nutzereingabe im Entwurf aufgerufen werden. */
    function touchDraft() {
      const d = S.draft;
      if (!d) return;
      if (d.editingSessionId) {
        d.editDirty = true;
      } else {
        d.touched = true;
        S.drafts[draftKey(d.date, d.splitId)] = d;
      }
      Persist.draftSoon();
    }

    const hasUnsavedEdits = () => Boolean(S.draft && S.draft.editingSessionId && S.draft.editDirty);

    /** Baut den aktiven Entwurf neu aus dem Plan auf, sofern noch nichts eingetragen wurde. */
    function refreshPristineDraft() {
      const d = S.draft;
      if (!d || d.editingSessionId || d.touched) return false;
      S.draft = buildDraftForSplit(d.splitId, d.date);
      return true;
    }

    /* ---------- Sätze ----------------------------------------------------------- */
    function ghostSet(entry, setIdx) {
      const set = entry && entry.sets ? entry.sets[setIdx] : null;
      if (!set) return null;
      const last = lastPerformance(entry.exerciseId, entry.machineId, S.draft.date, S.draft.editingSessionId || null);
      if (!last || !Array.isArray(last.sets) || !last.sets.length) return null;
      if (set.type === 'warmup') {
        const prevWarmups = last.sets.filter((s) => s.type === 'warmup');
        const warmupIdx = entry.sets.slice(0, setIdx).filter((s) => s.type === 'warmup').length;
        return prevWarmups[warmupIdx] || null;
      }
      const prevWork = last.sets.filter((s) => s.type !== 'warmup');
      const workIdx = entry.sets.slice(0, setIdx).filter((s) => s.type !== 'warmup').length;
      return prevWork[workIdx] || null;
    }

    /**
     * Hakt einen Satz ab. Leere Felder übernehmen den grau angezeigten Vorwert –
     * „wie letztes Mal“ ist damit ein einziger Tipp.
     * Rückgabe: { ok: true } oder { ok: false, missing: 'weight' | 'reps', invalid? }
     * (invalid = im Feld steht etwas, das keine Zahl ist – dann wird NICHT stillschweigend der Vorwert genommen)
     */
    function completeSet(entry, setIdx) {
      const set = entry.sets[setIdx];
      const ghost = ghostSet(entry, setIdx);
      let w = parseNum(set.weight);
      let r = parseNum(set.reps);
      if (w === null && String(set.weight ?? '').trim() !== '') return { ok: false, missing: 'weight', invalid: true };
      if (r === null && String(set.reps ?? '').trim() !== '') return { ok: false, missing: 'reps', invalid: true };
      const typedW = w !== null;
      const typedR = r !== null;
      if (!typedW && ghost) w = Number(ghost.weight);
      if (!typedR && ghost) r = Number(ghost.reps);
      if (w === null || !Number.isFinite(w)) return { ok: false, missing: 'weight' };
      if (r === null || !Number.isFinite(r) || r <= 0) return { ok: false, missing: 'reps' };

      const adoptedAll = !typedW && !typedR;
      const before = !typedW || !typedR
        ? { weight: set.weight, reps: set.reps, partials: set.partials, drops: (set.drops || []).map((d) => ({ ...d })) }
        : null;
      set.weight = numToInput(w);
      set.reps = numToInput(r);
      if (set.partials === null || set.partials === undefined) {
        set.partials = adoptedAll && ghost ? clamp(Number(ghost.partials) || 0, 0, 5) : 0;
      }
      if (set.type === 'dropset' && adoptedAll && ghost && Array.isArray(ghost.drops)) {
        set.drops.forEach((d, k) => {
          const g = ghost.drops[k];
          if (!g) return;
          if (d.weight === '') d.weight = numToInput(g.weight);
          if (d.reps === '') d.reps = numToInput(g.reps);
        });
      }
      set.completed = true;
      // Merken, was der Haken eingetragen hat – nur im Arbeitsspeicher (nicht aufzählbar: wird weder gespeichert
      // noch kopiert). Wird der Haken gleich wieder entfernt, ist die Zeile damit wieder so leer wie vorher.
      delete set.adopted;
      if (before) Object.defineProperty(set, 'adopted', { value: { before, after: setInputSnapshot(set) }, enumerable: false, configurable: true, writable: true });
      return { ok: true, adopted: !typedW || !typedR };
    }

    const setInputSnapshot = (set) => JSON.stringify([set.weight, set.reps, set.partials ?? null, (set.drops || []).map((d) => [d.weight, d.reps])]);

    /**
     * Haken wieder entfernen. Hat der Haken graue Vorwerte übernommen und wurde seitdem nichts an der Zeile
     * geändert, stehen danach wieder nur die selbst getippten Werte in den Feldern (bzw. keine).
     */
    function uncompleteSet(set) {
      set.completed = false;
      const a = set.adopted;
      delete set.adopted;
      if (!a || setInputSnapshot(set) !== a.after) return;
      set.weight = a.before.weight;
      set.reps = a.before.reps;
      set.partials = a.before.partials;
      set.drops = a.before.drops;
    }

    function cleanDraftSet(s) {
      const w = parseNum(s.weight);
      const r = parseNum(s.reps);
      if (w === null || r === null || !(r > 0)) return null;
      const drops = s.type === 'dropset'
        ? (s.drops || [])
          .map((d) => ({ weight: parseNum(d.weight), reps: parseNum(d.reps) }))
          .filter((d) => d.weight !== null && d.reps !== null && d.reps > 0)
        : [];
      return {
        weight: w,
        reps: r,
        type: SET_TYPES.includes(s.type) ? s.type : 'normal',
        partials: s.partials !== null && s.partials !== undefined ? Math.max(0, parseInt(s.partials, 10) || 0) : 0,
        drops
      };
    }

    /** Hat der Nutzer in dieser Zeile etwas getippt (Last, Wdh. oder eine Drop-Stufe)? */
    const setHasTypedValue = (s) =>
      String(s.weight ?? '').trim() !== '' || String(s.reps ?? '').trim() !== '' ||
      (s.drops || []).some((d) => String(d.weight ?? '').trim() !== '' || String(d.reps ?? '').trim() !== '');

    /** Zählt die Arbeitssätze des Entwurfs (Aufwärmsätze werden ignoriert). */
    function draftSetCounts(draft) {
      let total = 0;
      let checked = 0;
      let filledUnchecked = 0;
      let anyValid = 0;
      for (const e of draft.entries) {
        for (const s of e.sets) {
          const valid = Boolean(cleanDraftSet(s));
          if (valid) anyValid++;
          if (s.type === 'warmup') continue;
          total++;
          if (s.completed && valid) checked++;
          else if (valid) filledUnchecked++;
        }
      }
      return { total, checked, filledUnchecked, anyValid };
    }

    /**
     * Zeilen mit Eingaben, die so noch nicht gespeichert werden können – damit beim Abschließen nichts
     * stillschweigend verloren geht:
     *   'ghostable'  – es fehlt nur eine Angabe, für die ein grauer Vorwert bereitsteht (wie beim Abhaken)
     *   'incomplete' – eine Angabe fehlt ohne Vorwert, ist 0 oder keine lesbare Zahl
     */
    function pendingRows(draft) {
      const out = [];
      draft.entries.forEach((entry, i) => entry.sets.forEach((s, j) => {
        if (cleanDraftSet(s) || !setHasTypedValue(s)) return;
        const rawW = String(s.weight ?? '').trim();
        const rawR = String(s.reps ?? '').trim();
        const w = parseNum(rawW);
        const r = parseNum(rawR);
        const unreadable = (rawW !== '' && w === null) || (rawR !== '' && r === null);
        const ghost = draft === S.draft ? ghostSet(entry, j) : null;
        const weightOk = rawW !== '' ? w !== null : Boolean(ghost) && Number.isFinite(Number(ghost.weight));
        const repsOk = rawR !== '' ? r > 0 : Boolean(ghost) && Number(ghost.reps) > 0;
        const missing = rawW !== '' && w === null ? 'weight' : (rawR !== '' && !(r > 0) ? 'reps' : (rawW === '' ? 'weight' : 'reps'));
        out.push({ i, j, entry, missing, kind: !unreadable && weightOk && repsOk ? 'ghostable' : 'incomplete' });
      }));
      return out;
    }

    /* ---------- Einheit abschließen --------------------------------------------- */
    function sessionEntriesFromDraft(draft, includeUnchecked) {
      const out = [];
      // Wird eine gespeicherte Einheit bearbeitet, kennt sie Name und Einheit inzwischen gelöschter Übungen/Geräte
      const original = draft.editingSessionId ? S.sessions.find((x) => x.id === draft.editingSessionId) : null;
      for (const entry of draft.entries) {
        const sets = [];
        for (const s of entry.sets) {
          if (!s.completed && !includeUnchecked) continue;
          const c = cleanDraftSet(s);
          if (c) sets.push(c);
        }
        if (!sets.length) continue;
        const stored = original
          ? original.entries.find((x) => x.exerciseId === entry.exerciseId && x.machineId === entry.machineId) || null
          : null;
        const snap = {
          exerciseName: entry.exerciseName || (stored && stored.exerciseName) || entry.labelOverride,
          machineName: entry.machineName || (stored && stored.machineName),
          unit: entry.unit || (stored && stored.unit)
        };
        out.push({
          exerciseId: entry.exerciseId,
          machineId: entry.machineId,
          // Momentaufnahme: bleibt lesbar, auch wenn Übung/Gerät später gelöscht wird
          exerciseName: exerciseName(entry.exerciseId, snap),
          machineName: machineName(entry.machineId, snap),
          unit: unitOf(entry.machineId, snap),
          sets
        });
      }
      return out;
    }

    function upsertSession(rec) {
      const i = S.sessions.findIndex((s) => s.id === rec.id);
      if (i >= 0) S.sessions[i] = rec; else S.sessions.push(rec);
      sortSessions();
      Idx.touch();
      return Storage.bg(Storage.putOne('sessions', rec));
    }

    function removeSession(id) {
      const sess = S.sessions.find((s) => s.id === id) || null;
      if (!sess) return null;
      S.sessions = S.sessions.filter((s) => s.id !== id);
      Idx.touch();
      Storage.bg(Storage.deleteOne('sessions', id));
      return sess;
    }

    /**
     * Speichert den aktiven Entwurf als Einheit (oder als abgehakten Tag ohne Sätze).
     * mode: 'all' → alle ausgefüllten Sätze · 'checked' → nur abgehakte
     */
    function finishDraft(mode = 'all') {
      const draft = S.draft;
      if (!draft) return null;
      const existing = draft.editingSessionId ? S.sessions.find((s) => s.id === draft.editingSessionId) : null;
      const entries = sessionEntriesFromDraft(draft, mode === 'all');
      const split = splitById(draft.splitId);
      const isRestSplit = Boolean((split && split.isRest) || draft.isRest);
      const baseName = String(draft.splitName || (split && split.name) || 'Training').replace(/\s*\(Abgehakt\)\s*$/i, '');

      const durationSec = existing
        ? (Number.isFinite(draft.duration) && draft.duration >= 0 ? Math.round(draft.duration) : (existing.duration || 0))
        : draftElapsedSec(draft);
      const rec = {
        id: existing ? existing.id : uid('sess'),
        date: draft.date,
        timestamp: existing ? existing.timestamp : Date.now(),
        splitId: draft.splitId || (entries.length ? '' : 'rest_day'),
        splitName: entries.length ? baseName : (isRestSplit ? (baseName || 'Pausentag') : `${baseName} (Abgehakt)`),
        isRestDay: entries.length === 0,
        entries
      };
      if (entries.length && durationSec > 0) rec.duration = durationSec;
      else delete rec.duration;
      if (existing && existing.demo) rec.demo = true;

      upsertSession(rec);
      // Nur den Entwurf entfernen, der gerade gespeichert wurde – ein daneben angefangener weiterer Entwurf
      // für denselben Tag (zweite Einheit) bleibt erhalten, auch wenn eine gespeicherte Einheit bearbeitet wurde.
      const key = draftKey(draft.date, draft.splitId);
      if (!existing || S.drafts[key] === draft) delete S.drafts[key];
      S.draft = draftFromSession(rec);
      Persist.draftNow();
      return rec;
    }

    /** Pausentag direkt im Kalender abhaken (kein Doppel-Eintrag mehr möglich). */
    function logRestDay(date) {
      const existing = Idx.sessionsOn(date).find((s) => s.isRestDay);
      if (existing) return { record: existing, created: false };
      const natural = splitForDate(date);
      const useNatural = natural && natural.isRest;
      const rec = {
        id: uid('sess'),
        date,
        timestamp: Date.now(),
        splitId: useNatural ? natural.id : 'rest_day',
        splitName: useNatural ? natural.name : 'Pausentag',
        isRestDay: true,
        entries: []
      };
      upsertSession(rec);
      return { record: rec, created: true };
    }

    /**
     * Trainingstag „mit Vorwerten“ nachtragen: übernimmt je Übung die letzte Leistung bis zu diesem Datum
     * (liegt der Tag vor allen Werten: die zeitlich nächste, siehe lastPerformance). Übungen ohne Vorwerte
     * werden ausgelassen. Gibt es für KEINE Übung Werte, wird der Tag wie in der bisherigen Version ohne Werte
     * abgehakt (withoutValues) – der Tag lässt sich also immer mit einem Tipp nachtragen.
     */
    function quickLogSplit(date, splitId) {
      const split = splitById(splitId);
      if (!split) return { record: null, skipped: 0 };
      const entries = [];
      let skipped = 0;
      for (const item of split.items) {
        if (!Idx.ex(item.exerciseId)) continue;
        const machineId = pickMachineId(item.exerciseId, item.defaultMachineId, date);
        const last = machineId ? lastPerformance(item.exerciseId, machineId, date) : null;
        const sets = last ? last.sets.map(normSet).filter(Boolean) : [];
        if (!sets.length) { skipped++; continue; }
        entries.push({
          exerciseId: item.exerciseId,
          machineId,
          exerciseName: exerciseName(item.exerciseId),
          machineName: machineName(machineId),
          unit: unitOf(machineId),
          sets
        });
      }
      let withoutValues = false;
      if (!entries.length) {
        // Für keine Übung dieses Tages gibt es Werte: Der Tag wird trotzdem als Training abgehakt – wie in der
        // bisherigen Version mit leeren Sätzen je Übung. Sie zählen nirgends mit, erscheinen als „ohne Werte
        // abgehakt“ und lassen sich später über „Bearbeiten“ nachtragen.
        for (const item of split.items) {
          if (!Idx.ex(item.exerciseId)) continue;
          const machineId = pickMachineId(item.exerciseId, item.defaultMachineId, date);
          if (!machineId) continue;
          entries.push({
            exerciseId: item.exerciseId,
            machineId,
            exerciseName: exerciseName(item.exerciseId),
            machineName: machineName(machineId),
            unit: unitOf(machineId),
            sets: Array.from({ length: clamp(parseInt(item.targetSets, 10) || 2, 1, 20) }, () => ({ weight: 0, reps: 0, type: 'normal', partials: 0, drops: [] }))
          });
        }
        if (!entries.length) return { record: null, skipped };
        withoutValues = true;
        skipped = 0;
      }
      const rec = {
        id: uid('sess'), date, timestamp: Date.now(),
        splitId: split.id, splitName: split.name, isRestDay: false, entries
      };
      upsertSession(rec);
      return { record: rec, skipped, withoutValues };
    }

    /* ---------- Auswertung ------------------------------------------------------ */
    function currentWeek() {
      const monday = mondayOf(todayIso());
      return { monday, sunday: addDays(monday, 6), week: isoWeek(monday) };
    }

    function getCategoryTarget(catId) {
      const val = S.volumeTargets ? S.volumeTargets[catId] : undefined;
      if (typeof val === 'number' && val >= 0) return val;
      return DEFAULT_VOLUME_TARGETS[catId] ?? 8;
    }

    /** Arbeitssätze der laufenden Woche je Muskelgruppe. */
    function weeklyVolume() {
      const { monday, sunday, week } = currentWeek();
      const counts = Object.fromEntries(CATEGORY_IDS.map((c) => [c, 0]));
      for (const sess of S.sessions) {
        if (sess.date < monday || sess.date > sunday) continue;
        for (const entry of sess.entries) {
          const n = entry.sets.filter(isWorkingSet).length;
          if (!n) continue;
          const cat = categoryOf(entry.exerciseId);
          counts[cat] = (counts[cat] || 0) + n;
        }
      }
      const rows = TARGET_CATEGORIES.map((c) => ({ id: c.id, name: c.name, count: counts[c.id] || 0, target: getCategoryTarget(c.id) }));
      const other = counts.Sonstiges || 0;
      return {
        monday, sunday, week, rows, other,
        total: rows.reduce((a, r) => a + r.count, 0) + other,
        totalTarget: rows.reduce((a, r) => a + r.target, 0)
      };
    }

    /**
     * Monatskalender. „Offen“ zählt erst ab dem ersten Eintrag überhaupt – vorher
     * war bei neuen Nutzern der komplette Monat rot und die Quote bei wenigen %.
     */
    function calendarMonth(year, month) {
      const today = todayIso();
      const firstLog = Idx.firstLog();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const offset = (new Date(year, month, 1).getDay() + 6) % 7;
      const cells = [];
      let done = 0;
      let missed = 0;
      let workouts = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const date = `${year}-${pad2(month + 1)}-${pad2(day)}`;
        const logs = Idx.sessionsOn(date);
        let kind = 'none';
        let label = '';
        if (logs.length) {
          done++;
          const workout = logs.find(isWorkoutSession);
          if (workout) { workouts++; label = shortSplitName(workout.splitName); }
          kind = workout ? 'workout' : 'rest';
        } else if (date < today && firstLog && date >= firstLog) {
          missed++;
          kind = 'missed';
        } else if (date > today) {
          kind = 'future';
        }
        cells.push({ date, day, kind, label, isToday: date === today, logs });
      }
      const relevant = done + missed;
      return { offset, cells, done, missed, workouts, rate: relevant > 0 ? Math.round((done / relevant) * 100) : null };
    }

    /** Alle Übungen, zu denen es mindestens einen Arbeitssatz gibt. */
    function trackedExercises() {
      const counts = new Map();
      const names = new Map();
      for (const sess of S.sessions) {
        const seen = new Set();
        for (const entry of sess.entries) {
          if (!entry.sets.some(isWorkingSet) || seen.has(entry.exerciseId)) continue;
          seen.add(entry.exerciseId);
          counts.set(entry.exerciseId, (counts.get(entry.exerciseId) || 0) + 1);
          if (!names.has(entry.exerciseId)) names.set(entry.exerciseId, exerciseName(entry.exerciseId, entry));
        }
      }
      return Array.from(counts, ([id, sessionCount]) => ({ id, name: names.get(id), sessionCount }))
        .sort((a, b) => a.name.localeCompare(b.name, 'de'));
    }

    /**
     * Verlauf einer Übung, gruppiert nach Gerät (kg und Pin bleiben strikt getrennt).
     * Je Einheit ein Punkt mit e1RM, Maximallast, Volumen und Top-Satz.
     */
    function progressionGroups(exerciseId) {
      const groups = new Map();
      for (let i = S.sessions.length - 1; i >= 0; i--) { // chronologisch aufsteigend
        const sess = S.sessions[i];
        const perMachine = new Map();
        for (const entry of sess.entries) {
          if (entry.exerciseId !== exerciseId) continue;
          if (!perMachine.has(entry.machineId)) perMachine.set(entry.machineId, { entry, sets: [] });
          perMachine.get(entry.machineId).sets.push(...entry.sets);
        }
        for (const [machineId, { entry, sets }] of perMachine) {
          const working = sets.filter(isWorkingSet);
          if (!working.length) continue;
          let e1rm = 0;
          let maxWeight = -Infinity;
          let volume = 0;
          let topSet = working[0];
          for (const s of working) {
            const w = Number(s.weight) || 0;
            e1rm = Math.max(e1rm, calcE1RM(w, s.reps, s.partials));
            maxWeight = Math.max(maxWeight, w);
            volume += calcSetVolume(s);
            const tw = Number(topSet.weight) || 0;
            if (w > tw || (w === tw && effectiveReps(s.reps, s.partials) > effectiveReps(topSet.reps, topSet.partials))) topSet = s;
          }
          if (!groups.has(machineId)) {
            groups.set(machineId, { machineId, name: machineName(machineId, entry), unit: unitOf(machineId, entry), points: [] });
          }
          groups.get(machineId).points.push({
            t: isoTs(sess.date),
            date: sess.date,
            sessionId: sess.id,
            splitName: sess.splitName,
            e1rm: Math.round(e1rm * 10) / 10,
            maxWeight: Math.round(maxWeight * 100) / 100,
            volume: Math.round(volume),
            topSet,
            sets: sets.filter(isRealSet)
          });
        }
      }
      // Feste Farb-Reihenfolge je Einheit: Farbe folgt dem Gerät, nicht dem Rang.
      const list = Array.from(groups.values()).sort((a, b) => a.machineId.localeCompare(b.machineId));
      const slotCounter = { kg: 0, pin: 0 };
      for (const g of list) g.slot = slotCounter[g.unit]++;
      return list.sort((a, b) => a.name.localeCompare(b.name, 'de'));
    }

    /* ---------- Übungen, Geräte, Plan ------------------------------------------- */
    /** Schreibt Namen/Einheit in alle Verlaufseinträge, die gleich ihren Bezug verlieren. */
    function snapshotHistoryRefs(match) {
      const changed = [];
      for (const sess of S.sessions) {
        let hit = false;
        for (const e of sess.entries) {
          if (!match(e)) continue;
          e.exerciseName = exerciseName(e.exerciseId, e);
          e.machineName = machineName(e.machineId, e);
          e.unit = unitOf(e.machineId, e);
          hit = true;
        }
        if (hit) changed.push(sess);
      }
      return changed;
    }

    const countHistoryRefs = (match) =>
      S.sessions.reduce((n, sess) => n + (sess.entries.some(match) ? 1 : 0), 0);

    function createExercise({ name, category, machineName: mName, unit }) {
      const ex = { id: uid('ex'), name: name.trim(), category: CATEGORY_IDS.includes(category) ? category : 'Sonstiges' };
      const mach = { id: uid('m'), exerciseId: ex.id, name: (mName || '').trim() || 'Standard-Gerät', setupNote: '', unit: unit === 'pin' ? 'pin' : 'kg' };
      S.exercises.push(ex);
      S.machines.push(mach);
      Idx.touch();
      Storage.bg(Promise.all([Storage.putOne('exercises', ex), Storage.putOne('machines', mach)]));
      return ex;
    }

    function updateExercise(exerciseId, { name, category }) {
      const ex = Idx.ex(exerciseId);
      if (!ex) return;
      ex.name = name.trim();
      ex.category = CATEGORY_IDS.includes(category) ? category : 'Sonstiges';
      // Kopien des Namens in Plan und Entwürfen mitziehen (alte Version zeigte dort den alten Namen weiter)
      const touchedSplits = [];
      for (const sp of S.splits) {
        let hit = false;
        for (const it of sp.items) if (it.exerciseId === exerciseId) { it.labelOverride = ex.name; hit = true; }
        if (hit) touchedSplits.push(sp);
      }
      for (const d of [S.draft, ...Object.values(S.drafts)]) {
        if (!d) continue;
        for (const e of d.entries) if (e.exerciseId === exerciseId) e.labelOverride = ex.name;
      }
      Idx.touch();
      Storage.bg(Promise.all([
        Storage.putOne('exercises', ex),
        touchedSplits.length ? Storage.putMany('splits', touchedSplits) : null,
        Persist.draftNow()
      ]));
    }

    function deleteExercise(exerciseId) {
      const ex = Idx.ex(exerciseId);
      if (!ex) return;
      const changedSessions = snapshotHistoryRefs((e) => e.exerciseId === exerciseId);
      const machineIds = S.machines.filter((m) => m.exerciseId === exerciseId).map((m) => m.id);
      const touchedSplits = [];
      for (const sp of S.splits) {
        const before = sp.items.length;
        sp.items = sp.items.filter((it) => it.exerciseId !== exerciseId);
        if (sp.items.length !== before) touchedSplits.push(sp);
      }
      // Angefangene Trainings: Zeilen OHNE Eingaben verschwinden mit der Übung; bereits eingetragene Sätze bleiben
      // stehen (mit Name und Einheit als Momentaufnahme) und werden beim Abschließen ganz normal gespeichert.
      const machById = new Map(S.machines.map((m) => [m.id, m]));
      const stampSnapshot = (e) => {
        const m = machById.get(e.machineId);
        e.labelOverride = ex.name;
        e.exerciseName = ex.name;
        if (m) { e.machineName = m.name; e.unit = m.unit === 'pin' ? 'pin' : 'kg'; }
      };
      for (const d of new Set([S.draft, ...Object.values(S.drafts)])) {
        if (!d) continue;
        if (d.editingSessionId) {
          // Bearbeitung einer gespeicherten Einheit: nichts entfernen, aber Name/Gerät/Einheit festhalten –
          // sonst würde ein in dieser Bearbeitung hinzugefügter Eintrag als „Gelöschtes Gerät · kg“ gespeichert.
          for (const e of d.entries) if (e.exerciseId === exerciseId) stampSnapshot(e);
          continue;
        }
        d.entries = d.entries.filter((e) => {
          if (e.exerciseId !== exerciseId) return true;
          if (!d.touched && !entryHasInput(e)) return false;
          stampSnapshot(e);
          return true;
        });
      }
      S.exercises = S.exercises.filter((e) => e.id !== exerciseId);
      S.machines = S.machines.filter((m) => m.exerciseId !== exerciseId);
      Idx.touch();
      Storage.bg(Promise.all([
        Storage.deleteOne('exercises', exerciseId),
        Storage.deleteMany('machines', machineIds),
        Storage.putMany('splits', touchedSplits),
        Storage.putMany('sessions', changedSessions),
        Persist.draftNow()
      ]));
    }

    function createMachine(exerciseId, { name, unit, setupNote }) {
      const mach = { id: uid('m'), exerciseId, name: name.trim(), setupNote: (setupNote || '').trim(), unit: unit === 'pin' ? 'pin' : 'kg' };
      S.machines.push(mach);
      Idx.touch();
      Storage.bg(Storage.putOne('machines', mach));
      return mach;
    }

    function updateMachine(machineId, { name, unit, setupNote }) {
      const m = Idx.mach(machineId);
      if (!m) return;
      if (typeof name === 'string' && name.trim()) m.name = name.trim();
      if (unit === 'kg' || unit === 'pin') m.unit = unit;
      if (typeof setupNote === 'string') m.setupNote = setupNote.trim();
      Idx.touch();
      Storage.bg(Storage.putOne('machines', m));
    }

    function deleteMachine(machineId) {
      const machine = Idx.mach(machineId);
      if (!machine) return;
      const exId = machine.exerciseId;
      const changedSessions = snapshotHistoryRefs((e) => e.machineId === machineId);
      S.machines = S.machines.filter((m) => m.id !== machineId);
      Idx.touch();
      const writes = [Storage.deleteOne('machines', machineId), Storage.putMany('sessions', changedSessions)];

      let remaining = Idx.machinesOf(exId);
      if (!remaining.length) {
        const fallback = { id: uid('m'), exerciseId: exId, name: 'Standard-Gerät', setupNote: '', unit: 'kg' };
        S.machines.push(fallback);
        Idx.touch();
        writes.push(Storage.putOne('machines', fallback));
        remaining = [fallback];
      }
      const replacementId = remaining[0].id;

      const touchedSplits = [];
      for (const sp of S.splits) {
        let hit = false;
        for (const it of sp.items) if (it.defaultMachineId === machineId) { it.defaultMachineId = replacementId; hit = true; }
        if (hit) touchedSplits.push(sp);
      }
      writes.push(Storage.putMany('splits', touchedSplits));

      for (const d of new Set([S.draft, ...Object.values(S.drafts)])) {
        if (!d) continue;
        for (const entry of d.entries) {
          if (entry.machineId !== machineId) continue;
          if (d.editingSessionId) {
            // Bearbeitung einer gespeicherten Einheit: Eintrag bleibt am gelöschten Gerät, mit Name und Einheit als Momentaufnahme
            entry.machineName = machine.name;
            entry.unit = machine.unit === 'pin' ? 'pin' : 'kg';
            continue;
          }
          entry.machineId = replacementId;
          if (!entryHasInput(entry)) entry.sets = buildSetRows(entry.exerciseId, replacementId, entry.targetSets, d.date);
        }
      }
      writes.push(Persist.draftNow());
      Storage.bg(Promise.all(writes));
    }

    function saveSplit(split) {
      return Storage.bg(Storage.putOne('splits', split));
    }
    /** Reihenfolge der Trainingstage speichern: geschrieben werden nur die Tage, deren Position sich geändert hat. */
    function saveSplitOrder() {
      const before = new Map(S.splits.map((sp) => [sp.id, sp.order]));
      normalizeSplitOrder();
      const changed = S.splits.filter((sp) => before.get(sp.id) !== sp.order);
      return Storage.bg(Storage.putMany('splits', changed));
    }

    function createSplit({ name, isRest }) {
      const split = { id: uid('day'), order: 0, name: name.trim(), isRest: Boolean(isRest), items: [] };
      S.splits.splice(insertIndexForNewSplit(split.name), 0, split);
      saveSplitOrder();
      return split;
    }

    function moveSplit(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= S.splits.length) return false;
      [S.splits[index], S.splits[target]] = [S.splits[target], S.splits[index]];
      saveSplitOrder(); // Reihenfolge bleibt jetzt erhalten (vorher sortierte die App sofort zurück)
      return true;
    }

    function deleteSplit(splitId) {
      if (S.splits.length <= 1) return false;
      S.splits = S.splits.filter((s) => s.id !== splitId);
      normalizeSplitOrder();
      Storage.bg(Promise.all([Storage.deleteOne('splits', splitId), Storage.putMany('splits', S.splits)]));
      // Angefangene Trainings dieses Tages (mit Eingaben) bleiben erhalten – sie lassen sich weiter abschließen.
      // Nur eine noch leere Ansicht des gelöschten Tages wird durch den Tag laut Plan ersetzt.
      if (S.draft && !S.draft.editingSessionId && S.draft.splitId === splitId && !S.draft.touched) openDay(S.draft.date);
      Persist.draftNow();
      return true;
    }

    function addSplitItem(splitId, exerciseId, targetSets) {
      const split = splitById(splitId);
      const ex = Idx.ex(exerciseId);
      if (!split || !ex) return null;
      const sets = clamp(parseInt(targetSets, 10) || 2, 1, 20);
      const item = {
        exerciseId,
        labelOverride: ex.name,
        targetSets: sets,
        targetRepRange: `${sets} WS`,
        defaultMachineId: ensureMachine(exerciseId).id
      };
      split.isRest = false;
      split.items.push(item);
      saveSplit(split);
      syncDraftWithTemplate(split, { added: item });
      return item;
    }

    /**
     * Planänderungen wirken auf den geöffneten Entwurf nur, solange dort noch
     * nichts eingetragen ist. Vorher löschte jede Planänderung während des
     * Trainings alle bereits eingetragenen Werte.
     */
    function syncDraftWithTemplate(split, { added = null } = {}) {
      const d = S.draft;
      if (!d || d.editingSessionId || d.splitId !== split.id) return;
      if (!d.touched) {
        S.draft = buildDraftForSplit(split.id, d.date);
      } else if (added) {
        d.isRest = false;
        d.entries.push(newDraftEntry(added.exerciseId, {
          targetSets: added.targetSets, targetRepRange: added.targetRepRange,
          preferredMachineId: added.defaultMachineId, date: d.date
        }));
      }
      Persist.draftNow();
    }

    /* ---------- Backup ---------------------------------------------------------- */
    function buildBackupPayload() {
      return {
        app: BACKUP_APP_ID,
        version: BACKUP_VERSION,
        exportedAt: new Date().toISOString(),
        data: {
          exercises: S.exercises,
          machines: S.machines,
          splits: S.splits,
          sessions: S.sessions,
          drafts: S.drafts,
          volumeTargets: S.volumeTargets
        }
      };
    }

    /**
     * Prüft ein Backup, bevor irgendetwas überschrieben wird.
     * Rückgabe: { ok: true, data, counts, dropped } oder { ok: false, error }
     */
    function parseBackup(jsonStr) {
      if (!jsonStr || !String(jsonStr).trim()) return { ok: false, error: 'Bitte Backup-Daten einfügen.' };
      let parsed;
      try { parsed = JSON.parse(jsonStr); } catch (e) {
        return { ok: false, error: 'Das ist kein gültiges JSON. Bitte den kompletten Backup-Text einfügen.' };
      }
      const src = parsed && typeof parsed === 'object' ? (parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed) : null;
      if (!src || !Array.isArray(src.exercises) || !Array.isArray(src.machines) || !Array.isArray(src.splits) || !Array.isArray(src.sessions)) {
        return { ok: false, error: 'Ungültiges Backup-Format: Übungen, Geräte, Plan oder Einheiten fehlen.' };
      }
      const exercises = dedupeById(src.exercises.map(normExercise).filter(Boolean));
      const exIds = new Set(exercises.map((e) => e.id));
      // Geräte ohne (noch vorhandene) Übung bleiben erhalten: der Verlauf braucht ihren Namen und ihre Einheit
      const machines = dedupeById(src.machines.map(normMachine).filter(Boolean));
      const splits = dedupeById(src.splits.map(normSplit).filter(Boolean)).sort((a, b) => a.order - b.order);
      if (!(Number(parsed.version) >= BACKUP_VERSION)) legacySortSplits(splits); // Backup der alten Version: Reihenfolge wie dort angezeigt
      splits.forEach((sp) => { sp.items = sp.items.filter((it) => exIds.has(it.exerciseId)); });
      const sessions = dedupeById(src.sessions.map(normSession).filter(Boolean));
      if (!splits.length) return { ok: false, error: 'Das Backup enthält keinen Trainingsplan.' };

      const drafts = {};
      if (src.drafts && typeof src.drafts === 'object') {
        for (const value of Object.values(src.drafts)) {
          const d = normDraft(value);
          if (d && !d.editingSessionId && d.touched) drafts[draftKey(d.date, d.splitId)] = d;
        }
      }
      const volumeTargets = { ...DEFAULT_VOLUME_TARGETS };
      if (src.volumeTargets && typeof src.volumeTargets === 'object') {
        for (const c of CATEGORY_IDS) {
          const v = Number(src.volumeTargets[c]);
          if (Number.isFinite(v) && v >= 0) volumeTargets[c] = Math.round(v);
        }
      }
      const dropped =
        (src.exercises.length - exercises.length) + (src.machines.length - machines.length) +
        (src.splits.length - splits.length) + (src.sessions.length - sessions.length);
      return {
        ok: true,
        data: { exercises, machines, splits, sessions, drafts, volumeTargets },
        counts: { exercises: exercises.length, machines: machines.length, splits: splits.length, sessions: sessions.length },
        exportedAt: typeof parsed.exportedAt === 'string' ? parsed.exportedAt : null,
        dropped
      };
    }

    /**
     * Spielt die automatische Sicherung des Standes vor dem Update unverändert zurück – Datensatz für
     * Datensatz, ohne jede Aufbereitung. Danach lädt die App neu und liest den Stand wie beim ersten Start.
     */
    async function restorePreUpdateSnapshot(snap) {
      const d = (snap && snap.payload && snap.payload.data) || null;
      if (!d || !Array.isArray(d.sessions) || !Array.isArray(d.exercises) || !Array.isArray(d.machines) || !Array.isArray(d.splits)) {
        throw new Error('Sicherung ist unvollständig');
      }
      // Ab hier schreibt die laufende App nichts mehr (auch nicht beim Verlassen der Seite) – sonst würde der
      // noch im Speicher liegende Entwurf die zurückgespielten Entwürfe überschreiben.
      Persist.frozen = true;
      Persist.pending = false;
      clearTimeout(Persist._timer);
      try {
        await Storage.replaceStores(
          { exercises: d.exercises, machines: d.machines, splits: d.splits, sessions: d.sessions },
          {
            draftsMap: d.drafts || {},
            volumeTargets: d.volumeTargets || {},
            activeDraft: snap.payload.activeDraft || null,
            appVersion: null // nächster Start behandelt den Stand wieder wie frisch aus der alten Version
          }
        );
      } catch (err) {
        Persist.frozen = false;
        throw err;
      }
    }

    async function applyBackup(data) {
      // Alles vorbereiten, in EINEM Schritt speichern und erst danach den Arbeitsstand tauschen: schlägt das
      // Speichern fehl (z. B. Speicher voll), ist weder in der Datenbank noch auf dem Bildschirm etwas verändert.
      const machines = data.machines.slice();
      const withMachine = new Set(machines.map((m) => m.exerciseId));
      for (const ex of data.exercises) {
        // Invariante: jede Übung hat ein Gerät
        if (!withMachine.has(ex.id)) machines.push({ id: uid('m'), exerciseId: ex.id, name: 'Standard-Gerät', setupNote: '', unit: 'kg' });
      }
      data.splits.forEach((sp, i) => { sp.order = i + 1; });
      const drafts = data.drafts || {};
      await Storage.replaceStores(
        { exercises: data.exercises, machines, splits: data.splits, sessions: data.sessions },
        { volumeTargets: data.volumeTargets, draftsMap: drafts, activeDraft: null, initialized: true }
      );
      S.exercises = data.exercises;
      S.machines = machines;
      S.splits = data.splits;
      S.sessions = data.sessions;
      S.drafts = drafts;
      S.volumeTargets = data.volumeTargets;
      Persist.aliases = {};
      Persist.markSynced();
      sortSessions();
      Idx.touch();
      openDay(todayIso());
    }

    /* ---------- Werkzeuge ------------------------------------------------------- */
    const hasDemoSessions = () => S.sessions.some((s) => s.demo);

    /** Beispiel-Verlauf (als Demo markiert, damit er sich wieder entfernen lässt). */
    function seedDemoSessions() {
      const today = todayIso();
      const has = (exId, mId) => Boolean(Idx.ex(exId) && Idx.mach(mId));
      const demo = [];
      const entry = (exerciseId, machineId, sets) => (has(exerciseId, machineId)
        ? { exerciseId, machineId, exerciseName: exerciseName(exerciseId), machineName: machineName(machineId), unit: unitOf(machineId), sets }
        : null);
      const add = (date, splitId, splitName, entries, offset) => {
        const list = entries.filter(Boolean);
        demo.push({
          id: uid('sess'), date, timestamp: isoTs(date) + offset, splitId, splitName,
          isRestDay: list.length === 0, entries: list, demo: true,
          ...(list.length ? { duration: (44 + ((offset * 7 + list.length * 3) % 18)) * 60 } : {})
        });
      };
      [12, 8, 5, 4, 3, 2, 1, 0].forEach((week, prog) => {
        const base = week * 7;
        add(addDays(today, -(base + 3)), 'day_mon_push', 'Montag – Push', [
          entry('ex_shoulder_press', 'm_sp_1', [
            { weight: 4, reps: 10, type: 'warmup', partials: 0, drops: [] },
            { weight: 7 + (prog > 4 ? 1 : 0), reps: 8 + (prog % 2), type: 'normal', partials: 1, drops: [] },
            { weight: 7 + (prog > 4 ? 1 : 0), reps: 7, type: 'normal', partials: 2, drops: [] }
          ]),
          entry('ex_chest_press', 'm_cp_1', [
            { weight: 8 + (prog > 3 ? 1 : 0), reps: 8, type: 'normal', partials: 0, drops: [] },
            { weight: 8 + (prog > 3 ? 1 : 0), reps: 7, type: 'normal', partials: 1, drops: [] }
          ])
        ], 1);
        add(addDays(today, -(base + 2)), 'day_tue_pull', 'Dienstag – Pull', [
          entry('ex_lat_pulldown', 'm_lp_1', [
            { weight: 9 + (prog > 3 ? 1 : 0), reps: 9, type: 'normal', partials: 1, drops: [] },
            { weight: 9 + (prog > 3 ? 1 : 0), reps: 8, type: 'dropset', partials: 1, drops: [{ weight: 6, reps: 7 }] }
          ])
        ], 2);
        add(addDays(today, -(base + 1)), 'day_wed_rest', 'Mittwoch – Pause', [], 3);
        add(addDays(today, -base), 'day_thu_legs', 'Donnerstag – Beine', [
          entry('ex_squat_legpress', 'm_sq_1', [
            { weight: 120, reps: 10, type: 'warmup', partials: 0, drops: [] },
            { weight: 190 + prog * 10, reps: 9, type: 'normal', partials: 0, drops: [] },
            { weight: 190 + prog * 10, reps: 8, type: 'normal', partials: 0, drops: [] }
          ])
        ], 4);
      });
      S.sessions.push(...demo);
      sortSessions();
      Idx.touch();
      Storage.bg(Storage.putMany('sessions', demo));
      return demo.length;
    }

    function removeDemoSessions() {
      const ids = S.sessions.filter((s) => s.demo).map((s) => s.id);
      S.sessions = S.sessions.filter((s) => !s.demo);
      Idx.touch();
      Storage.bg(Storage.deleteMany('sessions', ids));
      return ids.length;
    }

    async function clearAllSessions() {
      await Storage.replaceStores({ sessions: [] }, { draftsMap: {}, activeDraft: null });
      S.sessions = [];
      S.drafts = {};
      Persist.aliases = {};
      Persist.markSynced();
      Idx.touch();
      openDay(todayIso());
    }

    async function factoryReset() {
      const next = { exercises: clone(INITIAL_EXERCISES), machines: clone(INITIAL_MACHINES), splits: clone(INITIAL_SPLITS) };
      next.splits.forEach((sp, i) => { sp.order = i + 1; });
      const targets = { ...DEFAULT_VOLUME_TARGETS };
      await Storage.replaceStores({ ...next, sessions: [] }, { volumeTargets: targets, draftsMap: {}, activeDraft: null });
      S.exercises = next.exercises;
      S.machines = next.machines;
      S.splits = next.splits;
      S.sessions = [];
      S.drafts = {};
      S.volumeTargets = targets;
      Persist.aliases = {};
      Persist.markSynced();
      Idx.touch();
      openDay(todayIso());
    }

    /* ==========================================================================
       05 · OBERFLÄCHEN-KERN
       Ereignis-Delegation, Zurück-Stapel (Android-Zurück / Wischgeste),
       Sheets & Dialoge, Toasts, Formular-Baukasten, Tab-Navigation.
       ========================================================================== */

    /* ---------- Fehlerbehandlung ------------------------------------------------ */
    function reportError(err, context = '') {
      console.error('[IRONLOG]', context, err);
      try { toast('Da ist etwas schiefgelaufen. Deine Daten sind unverändert.', { type: 'error' }); } catch (_) { /* Toast noch nicht bereit */ }
    }

    /* ---------- Ereignis-Delegation ----------------------------------------------
       Statt hunderter inline-onclick-Attribute (mit von Hand zusammengesetzten
       Parametern) gibt es genau einen Listener je Ereignistyp. Elemente tragen
       data-act="name" und ihre Parameter als data-Attribute. */
    const Actions = {};   // click
    const Changes = {};   // change (select, checkbox, date …)
    const Inputs = {};    // input (Tippen)

    function runHandler(table, name, el, event) {
      const fn = table[name];
      if (!fn) return;
      try {
        const res = fn(el, event);
        if (res && typeof res.catch === 'function') res.catch((e) => reportError(e, name));
      } catch (e) {
        reportError(e, name);
      }
    }

    /**
     * Mehrere Fenster: Hat ein anderes Fenster der App inzwischen gespeichert, ist der Stand dieses Fensters
     * veraltet. Dann wird er neu geladen, statt mit alten Kopien weiterzuarbeiten – außer hier wird gerade
     * gearbeitet (ungespeicherte Eingaben, offener Dialog): eigene Eingaben gehen vor.
     */
    function resyncIfStale() {
      if (!Storage.changedElsewhere() || document.visibilityState !== 'visible') return false;
      if (Persist.frozen || Persist.pending || hasUnsavedEdits() || Sheets.stack.length > 0) return false;
      window.location.reload();
      return true;
    }

    function initDelegation() {
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
        if (resyncIfStale()) return;      // veralteter Stand → erst neu laden, dann handeln
        runHandler(Actions, el.dataset.act, el, e);
      });
      document.addEventListener('change', (e) => {
        const el = e.target.closest('[data-change]');
        if (el) runHandler(Changes, el.dataset.change, el, e);
      });
      document.addEventListener('input', (e) => {
        const el = e.target.closest('[data-input]');
        if (el) runHandler(Inputs, el.dataset.input, el, e);
      });
      // Zahlenfelder: beim Antippen alles markieren → neuer Wert überschreibt direkt
      document.addEventListener('focusin', (e) => {
        const el = e.target;
        if (el instanceof HTMLInputElement && el.hasAttribute('data-select-on-focus')) {
          requestAnimationFrame(() => {
            if (document.activeElement !== el) return;
            try { el.select(); el.setSelectionRange(0, el.value.length); } catch (_) { /* egal */ }
          });
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && Sheets.stack.length) {
          const top = Sheets.top();
          if (top && top.opts.dismissible !== false) { e.preventDefault(); Sheets.close(top); }
          return;
        }
        if (e.key === 'Enter' && e.target instanceof HTMLInputElement && e.target.dataset.enter) {
          e.preventDefault();
          runHandler(Actions, e.target.dataset.enter, e.target, e);
        }
      });
    }

    /* ---------- Zurück-Stapel ----------------------------------------------------
       Offene Sheets und der Wechsel weg vom Training-Tab sollen von der
       Zurück-Taste/-Geste abgefangen werden: erst das Sheet schließen bzw. zum
       Training zurück, statt die ganze App zu beenden.

       Umsetzung mit GENAU EINEM „Wächter“-Eintrag in der Browser-History, solange
       irgendetwas offen ist. Das vermeidet Wettläufe zwischen history.back() und
       pushState(), wenn ein Dialog schließt und sofort der nächste aufgeht. */
    const Back = {
      stack: [],
      seq: 0,
      guard: false,      // liegt unser Wächter-Eintrag gerade in der History?
      releasing: false,  // läuft gerade unser eigenes history.back()?
      timer: null,

      init() {
        // Die App merkt sich die Scroll-Position je Ansicht selbst. Ohne diese Zeile stellt der Browser nach dem
        // Entfernen des Zurück-Wächters (history.back) die beim Anlegen gemerkte Position wieder her – die Ansicht
        // sprang dadurch nach dem Schließen eines Dialogs oder nach einem Tab-Wechsel an eine alte Stelle.
        try { history.scrollRestoration = 'manual'; } catch (_) { /* nicht unterstützt */ }
        window.addEventListener('popstate', () => {
          if (this.releasing) {            // unser eigenes Aufräumen
            this.releasing = false;
            this.guard = false;
            this.sync();
            return;
          }
          this.guard = false;              // Nutzer hat „Zurück“ ausgelöst → Wächter ist verbraucht
          const top = this.stack.pop();
          if (top) { try { top.onBack(); } catch (e) { reportError(e, 'back'); } }
          this.sync();                     // ist noch etwas offen, Wächter erneut setzen
        });
      },

      push(onBack) {
        const id = ++this.seq;
        this.stack.push({ id, onBack });
        this.sync();
        return id;
      },

      /** Eintrag entfernen, weil etwas per Button/Code geschlossen wurde. */
      remove(id) {
        const i = this.stack.findIndex((x) => x.id === id);
        if (i < 0) return;
        this.stack.splice(i, 1);
        this.sync();
      },

      sync() {
        if (this.releasing) return;        // erst das laufende Zurück abwarten
        clearTimeout(this.timer);
        const need = this.stack.length > 0;
        if (need && !this.guard) {
          try { history.pushState({ ironlog: 'guard' }, ''); this.guard = true; } catch (_) { /* z. B. file:// */ }
        } else if (!need && this.guard) {
          // leicht verzögert: „schließen → sofort wieder öffnen“ soll die History nicht anfassen
          this.timer = setTimeout(() => {
            if (this.stack.length === 0 && this.guard && !this.releasing) {
              this.releasing = true;
              try { history.back(); } catch (_) { this.releasing = false; this.guard = false; }
            }
          }, 80);
        }
      }
    };

    /* ---------- Tastatur-Abstand --------------------------------------------------
       Fixierte Elemente (Sheets, Toasts) würden auf iOS von der Bildschirmtastatur
       verdeckt. --kb enthält die Höhe des verdeckten Bereichs. */
    function initViewportTracking() {
      const vv = window.visualViewport;
      if (!vv) return;
      const update = () => {
        const hidden = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
        // kleine Werte = Browserleisten; bei Pinch-Zoom schrumpft der sichtbare Bereich ebenfalls → keine Tastatur
        const zoomed = Math.abs((vv.scale || 1) - 1) > 0.01;
        const kb = !zoomed && hidden > 80 ? hidden : 0;
        document.documentElement.style.setProperty('--kb', `${kb}px`);
        document.documentElement.style.setProperty('--vvh', `${Math.round(vv.height)}px`);
        document.documentElement.classList.toggle('kb-open', kb > 0);
      };
      vv.addEventListener('resize', update);
      vv.addEventListener('scroll', update);
      update();
    }

    /* ---------- Toasts ----------------------------------------------------------- */
    const TOAST_ICONS = { success: 'check-circle', error: 'alert', warn: 'alert', info: 'info' };
    let toastTimer = null;

    /**
     * Kurze Rückmeldung am unteren Rand. Optional mit EINER Aktion (z. B. „Rückgängig“).
     * Für alles Wichtige gibt es Dialoge – Toasts verschwinden von selbst.
     */
    function toast(message, { type = 'info', action = null, duration = null } = {}) {
      const host = $('#toast-root');
      if (!host) return;
      clearTimeout(toastTimer);
      host.innerHTML = html`
        <div class="${cls('toast', `toast--${type}`, action && String(message).length > 34 && 'toast--stack')}">
          ${icon(TOAST_ICONS[type] || 'info', 'toast-icon')}
          <span class="toast-msg">${message}</span>
          ${action ? html`<button type="button" class="toast-action" data-toast-action>${action.label}</button>` : ''}
        </div>`.s;
      const el = host.firstElementChild;
      const hide = () => {
        if (!el.isConnected) return;
        el.classList.add('is-leaving');
        setTimeout(() => { if (el.isConnected) el.remove(); }, 200);
      };
      if (action) {
        el.querySelector('[data-toast-action]').addEventListener('click', () => {
          clearTimeout(toastTimer);
          hide();
          try { action.run(); } catch (e) { reportError(e, 'toast-action'); }
        });
      }
      toastTimer = setTimeout(hide, duration || (action ? 10000 : 4000)); // mit Aktion bewusst lange sichtbar
    }

    /* ---------- Sheets & Dialoge --------------------------------------------------
       Ein Stapel modaler Ebenen. Jede Ebene: role="dialog", Fokus wird hinein-
       und beim Schließen zurückgesetzt, der Hintergrund ist „inert“ (nicht
       bedienbar, nicht scrollbar), Escape/Zurück/Tippen daneben schließt. */
    const Sheets = {
      stack: [],
      seq: 0,

      top() { return this.stack[this.stack.length - 1] || null; },

      /**
       * opts: { title, subtitle, body, footer, variant: 'sheet' | 'dialog',
       *         dismissible, className, onMount(el, handle), onClose(result) }
       */
      open(opts) {
        const root = $('#sheet-root');
        const staleToast = $('#toast-root');
        if (staleToast) staleToast.textContent = ''; // alte Meldungen sollen kein neues Sheet überlagern
        const id = `layer-${++this.seq}`;
        const variant = opts.variant || 'sheet';
        const wrap = document.createElement('div');
        wrap.className = cls('layer', `layer--${variant}`, opts.className);
        wrap.id = id;
        wrap.innerHTML = html`
          <div class="layer-backdrop" data-act="layer-dismiss"></div>
          <section class="panel" role="dialog" aria-modal="true" aria-labelledby="${id}-title" tabindex="-1">
            ${variant === 'sheet' ? html`<div class="panel-grab" aria-hidden="true"><i></i></div>` : ''}
            <header class="panel-head">
              <div class="panel-titles">
                <h2 class="panel-title" id="${id}-title">${opts.title || ''}</h2>
                ${opts.subtitle ? html`<p class="panel-sub">${opts.subtitle}</p>` : ''}
              </div>
              ${opts.dismissible === false ? '' : html`
                <button type="button" class="icon-btn icon-btn--soft" data-act="layer-close" aria-label="Schließen">${icon('x')}</button>`}
            </header>
            <div class="panel-body">${opts.body || ''}</div>
            ${opts.footer ? html`<footer class="panel-foot">${opts.footer}</footer>` : ''}
          </section>`.s;

        const handle = {
          id, el: wrap, opts, closed: false, result: undefined,
          restoreFocus: document.activeElement instanceof HTMLElement ? document.activeElement : null,
          backId: null,
          close: (result) => Sheets.close(handle, result),
          body: () => wrap.querySelector('.panel-body'),
          setBody: (markup) => { patch(wrap.querySelector('.panel-body'), markup); }
        };

        // Hintergrund sperren
        const below = this.top();
        if (below) below.el.setAttribute('inert', '');
        $('#app').setAttribute('inert', '');
        document.documentElement.classList.add('is-locked');

        root.appendChild(wrap);
        this.stack.push(handle);
        handle.backId = Back.push(() => Sheets._dispose(handle));

        if (variant === 'sheet') initSheetDrag(handle);
        if (typeof opts.onMount === 'function') opts.onMount(wrap, handle);

        // Fokus: gewünschtes Feld oder das Panel selbst (synchron, damit iOS die Tastatur zeigt)
        const auto = wrap.querySelector('[data-autofocus]');
        const panel = wrap.querySelector('.panel');
        try { (auto || panel).focus({ preventScroll: true }); } catch (_) { /* egal */ }
        if (auto && typeof auto.select === 'function' && auto.dataset.autofocus === 'select') { try { auto.select(); } catch (_) { /* egal */ } }

        requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('is-open')));
        return handle;
      },

      close(handle = this.top(), result) {
        if (!handle || handle.closed) return;
        // Ebenen darüber zuerst schließen
        while (this.top() && this.top() !== handle) this.close(this.top());
        handle.result = result;
        const backId = handle.backId;
        this._dispose(handle);
        Back.remove(backId);
      },

      closeAll() {
        while (this.top()) this.close(this.top());
      },

      _dispose(handle) {
        if (handle.closed) return;
        handle.closed = true;
        const i = this.stack.indexOf(handle);
        if (i >= 0) this.stack.splice(i, 1);
        const el = handle.el;
        el.classList.remove('is-open');
        el.classList.add('is-closing');
        el.setAttribute('inert', '');
        const below = this.top();
        if (below) below.el.removeAttribute('inert');
        else {
          $('#app').removeAttribute('inert');
          document.documentElement.classList.remove('is-locked');
        }
        const done = () => { if (el.isConnected) el.remove(); };
        setTimeout(done, prefersReducedMotion() ? 0 : 280);
        const rf = handle.restoreFocus;
        if (rf && rf.isConnected && typeof rf.focus === 'function' && !(rf instanceof HTMLInputElement)) {
          try { rf.focus({ preventScroll: true }); } catch (_) { /* egal */ }
        }
        if (typeof handle.opts.onClose === 'function') {
          try { handle.opts.onClose(handle.result); } catch (e) { reportError(e, 'sheet-close'); }
        }
      }
    };

    Actions['layer-close'] = (el) => {
      const layer = el.closest('.layer');
      const handle = Sheets.stack.find((h) => h.el === layer);
      if (handle) Sheets.close(handle);
    };
    Actions['layer-dismiss'] = (el) => {
      const layer = el.closest('.layer');
      const handle = Sheets.stack.find((h) => h.el === layer);
      if (handle && handle.opts.dismissible !== false) Sheets.close(handle);
    };

    /** Sheet am Griff / Kopfbereich nach unten ziehen zum Schließen. */
    function initSheetDrag(handle) {
      if (handle.opts.dismissible === false) return;
      const panel = handle.el.querySelector('.panel');
      const zones = [handle.el.querySelector('.panel-grab'), handle.el.querySelector('.panel-head')].filter(Boolean);
      let startY = 0;
      let lastY = 0;
      let lastT = 0;
      let velocity = 0;
      let dragging = false;

      const onMove = (e) => {
        if (!dragging) return;
        const dy = Math.max(0, e.clientY - startY);
        const now = performance.now();
        if (now > lastT) velocity = (e.clientY - lastY) / (now - lastT);
        lastY = e.clientY; lastT = now;
        panel.style.transform = `translate3d(0, ${dy}px, 0)`;
      };
      const onEnd = (e) => {
        if (!dragging) return;
        dragging = false;
        panel.classList.remove('is-dragging');
        const dy = Math.max(0, e.clientY - startY);
        panel.style.transform = '';
        if (dy > Math.min(140, panel.offsetHeight * 0.35) || (velocity > 0.6 && dy > 24)) Sheets.close(handle);
      };
      for (const zone of zones) {
        zone.addEventListener('pointerdown', (e) => {
          if (e.target.closest('button, input, select, a')) return;
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          dragging = true;
          startY = lastY = e.clientY;
          lastT = performance.now();
          velocity = 0;
          panel.classList.add('is-dragging');
          try { zone.setPointerCapture(e.pointerId); } catch (_) { /* egal */ }
        });
        zone.addEventListener('pointermove', onMove);
        zone.addEventListener('pointerup', onEnd);
        zone.addEventListener('pointercancel', onEnd);
      }
    }

    /* ---- Bestätigung -----------------------------------------------------------
       Ersetzt confirm(): klare Überschrift, Folgen im Text, benannte Buttons.
       Rückgabe: Promise<boolean> */
    function confirmDialog({ title, message = '', details = null, confirmLabel = 'OK', cancelLabel = 'Abbrechen', danger = false, iconName = null }) {
      return new Promise((resolve) => {
        Sheets.open({
          title,
          variant: 'sheet',
          className: 'layer--confirm',
          body: html`
            ${iconName ? html`<div class="confirm-icon ${danger ? 'is-danger' : ''}">${icon(iconName)}</div>` : ''}
            ${message ? html`<p class="confirm-msg">${message}</p>` : ''}
            ${details || ''}
            <div class="btn-stack">
              <button type="button" class="btn ${danger ? 'btn--danger-soft' : 'btn--primary'} btn--lg btn--wrap" data-confirm="yes">${confirmLabel}</button>
              <button type="button" class="btn ${danger ? 'btn--soft' : 'btn--ghost'} btn--lg" data-confirm="no">${cancelLabel}</button>
            </div>`,
          onMount(el, handle) {
            el.addEventListener('click', (e) => {
              const b = e.target.closest('[data-confirm]');
              if (b) handle.close(b.dataset.confirm === 'yes');
            });
          },
          onClose(result) { resolve(result === true); }
        });
      });
    }

    /* ---- Auswahl-Menü (ersetzt die Reihen winziger Icon-Buttons) ---------------
       actions: [{ value, label, icon, danger, disabled, hint }] · Rückgabe: Promise<value|null> */
    function actionSheet({ title, subtitle = '', actions }) {
      return new Promise((resolve) => {
        Sheets.open({
          title,
          subtitle,
          variant: 'sheet',
          className: 'layer--menu',
          body: html`
            <div class="menu-list">
              ${actions.filter(Boolean).map((a) => (a.separator ? html`<div class="menu-sep" role="separator"></div>` : html`
                <button type="button" class="${cls('menu-item', a.danger && 'is-danger', a.selected && 'is-selected')}" data-value="${a.value}"
                        ${a.disabled ? raw('disabled') : ''} ${a.selected ? raw('aria-current="true"') : ''}>
                  ${a.icon ? icon(a.icon, 'menu-icon') : ''}
                  <span class="menu-label">${a.label}${a.hint ? html`<small>${a.hint}</small>` : ''}</span>
                  ${a.selected ? icon('check', 'menu-check') : ''}
                </button>`))}
            </div>`,
          onMount(el, handle) {
            el.addEventListener('click', (e) => {
              const b = e.target.closest('[data-value]');
              if (b && !b.disabled) handle.close(b.dataset.value);
            });
          },
          onClose(result) { resolve(typeof result === 'string' ? result : null); }
        });
      });
    }

    /* ---- Formular-Sheet (ersetzt prompt()-Ketten) ------------------------------
       fields: [{ name, label, type: text|textarea|select|choice|stepper|switch,
                  value, placeholder, options: [{value,label}], required, hint,
                  min, max, autofocus }]
       Rückgabe: Promise<{…werte} | null> */
    function formSheet({ title, subtitle = '', intro = '', fields, submitLabel = 'Speichern', danger = false, extra = null, validate = null }) {
      return new Promise((resolve) => {
        const fid = `form-${++Sheets.seq}`;
        const fieldHtml = (f) => {
          const id = `${fid}-${f.name}`;
          const hint = f.hint ? html`<p class="field-hint">${f.hint}</p>` : '';
          if (f.type === 'select') {
            return html`
              <div class="field">
                <label class="field-label" for="${id}">${f.label}</label>
                <div class="select-wrap">
                  <select class="input" id="${id}" name="${f.name}">
                    ${f.options.map((o) => html`<option value="${o.value}" ${String(o.value) === String(f.value) ? raw('selected') : ''}>${o.label}</option>`)}
                  </select>
                  ${icon('chevron-down', 'select-chevron')}
                </div>
                ${hint}
              </div>`;
          }
          if (f.type === 'choice') {
            return html`
              <fieldset class="field">
                <legend class="field-label">${f.label}</legend>
                <div class="choice" role="radiogroup">
                  ${f.options.map((o) => html`
                    <label class="choice-opt">
                      <input type="radio" name="${f.name}" value="${o.value}" ${String(o.value) === String(f.value) ? raw('checked') : ''}>
                      <span><b>${o.label}</b>${o.hint ? html`<small>${o.hint}</small>` : ''}</span>
                    </label>`)}
                </div>
                ${hint}
              </fieldset>`;
          }
          if (f.type === 'stepper') {
            return html`
              <div class="field">
                <label class="field-label" for="${id}">${f.label}</label>
                <div class="stepper" data-stepper data-min="${f.min ?? 0}" data-max="${f.max ?? 99}">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Weniger">${icon('minus')}</button>
                  <input class="stepper-input" id="${id}" name="${f.name}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
                         value="${f.value ?? 0}" data-select-on-focus>
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Mehr">${icon('plus')}</button>
                </div>
                ${hint}
              </div>`;
          }
          if (f.type === 'switch') {
            return html`
              <label class="switch-row">
                <span class="switch-text"><b>${f.label}</b>${f.hint ? html`<small>${f.hint}</small>` : ''}</span>
                <input type="checkbox" class="switch" name="${f.name}" ${f.value ? raw('checked') : ''}>
              </label>`;
          }
          if (f.type === 'textarea') {
            return html`
              <div class="field">
                <label class="field-label" for="${id}">${f.label}</label>
                <textarea class="input input--area" id="${id}" name="${f.name}" rows="${f.rows || 6}" placeholder="${f.placeholder || ''}"
                  autocomplete="off" autocapitalize="off" spellcheck="false" ${f.autofocus ? raw('data-autofocus') : ''}>${f.value || ''}</textarea>
                ${hint}
              </div>`;
          }
          return html`
            <div class="field">
              <label class="field-label" for="${id}">${f.label}</label>
              <input class="input" id="${id}" name="${f.name}" type="text" value="${f.value ?? ''}" placeholder="${f.placeholder || ''}"
                     autocomplete="off" autocapitalize="sentences" enterkeyhint="done" maxlength="${f.maxlength || 80}"
                     ${f.autofocus ? raw(`data-autofocus="${f.autofocus === 'select' ? 'select' : '1'}"`) : ''}>
              ${hint}
            </div>`;
        };

        Sheets.open({
          title,
          subtitle,
          variant: 'sheet',
          body: html`
            <form class="form" id="${fid}" novalidate>
              ${intro ? html`<p class="form-intro">${intro}</p>` : ''}
              ${fields.filter(Boolean).map(fieldHtml)}
              <p class="form-error" role="alert" hidden></p>
              <button type="submit" class="btn ${danger ? 'btn--danger' : 'btn--primary'} btn--lg btn--block">${submitLabel}</button>
              ${extra || ''}
            </form>`,
          onMount(el, handle) {
            const form = el.querySelector('form');
            const errEl = el.querySelector('.form-error');
            el.addEventListener('click', (e) => {
              const step = e.target.closest('[data-step]');
              if (step) {
                const box = step.closest('[data-stepper]');
                const input = box.querySelector('input');
                const next = clamp((parseInt(input.value, 10) || 0) + Number(step.dataset.step), Number(box.dataset.min), Number(box.dataset.max));
                input.value = String(next);
                haptic();
              }
              const ex = e.target.closest('[data-form-extra]');
              if (ex) handle.close({ __extra: ex.dataset.formExtra });
            });
            form.addEventListener('submit', (e) => {
              e.preventDefault();
              const values = {};
              for (const f of fields.filter(Boolean)) {
                if (f.type === 'switch') values[f.name] = form.elements[f.name].checked;
                else if (f.type === 'choice') values[f.name] = (form.querySelector(`input[name="${f.name}"]:checked`) || {}).value ?? f.value;
                else if (f.type === 'stepper') values[f.name] = clamp(parseInt(form.elements[f.name].value, 10) || 0, f.min ?? 0, f.max ?? 99);
                else values[f.name] = String(form.elements[f.name].value || '').trim();
              }
              let error = null;
              const missing = fields.filter(Boolean).find((f) => f.required && !values[f.name]);
              if (missing) error = `Bitte „${missing.label}“ ausfüllen.`;
              if (!error && typeof validate === 'function') error = validate(values);
              if (error) {
                errEl.textContent = error;
                errEl.hidden = false;
                haptic('warn');
                const bad = missing ? form.elements[missing.name] : null;
                if (bad && bad.focus) bad.focus();
                return;
              }
              handle.close(values);
            });
          },
          onClose(result) { resolve(result && typeof result === 'object' ? result : null); }
        });
      });
    }

    /* ---------- Tab-Navigation --------------------------------------------------- */
    const TABS = {
      workout: { title: 'Training' },
      stats: { title: 'Statistik' },
      history: { title: 'Verlauf' },
      plan: { title: 'Plan' },
      data: { title: 'Daten' }
    };
    const Views = {};            // name → { render(), header?() }
    const tabScroll = {};        // gemerkte Scroll-Position je Tab
    let tabBackId = null;

    function switchTab(tab, { fromBack = false, keepScroll = false } = {}) {
      if (!TABS[tab]) return;
      const prev = S.ui.tab;
      if (prev !== tab) tabScroll[prev] = window.scrollY;
      S.ui.tab = tab;

      for (const name of Object.keys(TABS)) {
        const view = $(`#view-${name}`);
        if (!view) continue;
        const active = name === tab;
        view.hidden = !active;
        view.classList.toggle('is-entering', active && prev !== tab);
      }
      $$('.tab').forEach((btn) => {
        const active = btn.dataset.tab === tab;
        btn.classList.toggle('is-active', active);
        if (active) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
      });

      renderView(tab);
      if (prev !== tab) window.scrollTo(0, keepScroll ? (tabScroll[tab] || 0) : 0);

      // Zurück führt von jedem Tab zuerst zum Training
      if (!fromBack) {
        if (tab !== 'workout' && tabBackId === null) {
          tabBackId = Back.push(() => { tabBackId = null; switchTab('workout', { fromBack: true }); });
        } else if (tab === 'workout' && tabBackId !== null) {
          const id = tabBackId;
          tabBackId = null;
          Back.remove(id);
        }
      }
    }

    function renderView(tab = S.ui.tab) {
      const view = Views[tab];
      if (!view) return;
      try {
        view.render();
        renderAppBar();
      } catch (e) {
        reportError(e, `render:${tab}`);
      }
    }

    /** Kopfzeile: Titel, Untertitel, Aktionen und (im Training) der Fortschritt. */
    function renderAppBar() {
      const tab = S.ui.tab;
      const view = Views[tab] || {};
      const info = typeof view.header === 'function' ? view.header() : {};
      $('#bar-title').textContent = info.title || TABS[tab].title;
      const sub = $('#bar-sub');
      sub.textContent = info.subtitle || '';
      sub.hidden = !info.subtitle;
      patch($('#bar-actions'), info.actions || '');
      patch($('#bar-extra'), info.extra || '');
      $('#bar-extra').hidden = !info.extra;
      const prog = $('#bar-progress');
      const pct = typeof info.progress === 'number' ? clamp(info.progress, 0, 1) : null;
      prog.hidden = pct === null;
      if (pct !== null) {
        prog.firstElementChild.style.transform = `scaleX(${pct})`;
        prog.setAttribute('aria-valuenow', String(Math.round(pct * 100)));
      }
    }

    Actions['tab'] = (el) => {
      const tab = el.dataset.tab;
      if (tab === S.ui.tab) { window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' }); return; }
      haptic();
      switchTab(tab, { keepScroll: true });
    };

    /* ---------- Kleine Bausteine -------------------------------------------------- */
    /** Segment-Umschalter mit gleitender Markierung. */
    function segmented({ act, value, options, label, small = false }) {
      const idx = Math.max(0, options.findIndex((o) => o.value === value));
      return html`
        <div class="${cls('seg', small && 'seg--sm')}" role="group" aria-label="${label}" style="--seg-n:${options.length};--seg-i:${idx}">
          ${options.map((o) => html`
            <button type="button" class="${cls('seg-btn', o.value === value && 'is-active')}" aria-pressed="${o.value === value ? 'true' : 'false'}"
                    data-act="${act}" data-v="${o.value}">${o.label}</button>`)}
        </div>`;
    }

    function emptyState({ iconName = 'info', title, text = '', action = null }) {
      return html`
        <div class="empty">
          <div class="empty-icon">${icon(iconName)}</div>
          <h3 class="empty-title">${title}</h3>
          ${text ? html`<p class="empty-text">${text}</p>` : ''}
          ${action || ''}
        </div>`;
    }

    /* ==========================================================================
       06 · GEMEINSAME DIALOGE
       Übung auswählen / anlegen / bearbeiten, Gerät bearbeiten – von Training
       und Plan gleichermaßen genutzt.
       ========================================================================== */

    /** Mehrfachauswahl-Dialog: options = [{ value, label, kind: primary|soft|danger|ghost }] */
    function choiceDialog({ title, message = '', details = null, options, iconName = null, danger = false }) {
      return new Promise((resolve) => {
        Sheets.open({
          title,
          variant: 'sheet',
          className: 'layer--confirm',
          body: html`
            ${iconName ? html`<div class="confirm-icon ${danger ? 'is-danger' : ''}">${icon(iconName)}</div>` : ''}
            ${message ? html`<p class="confirm-msg">${message}</p>` : ''}
            ${details || ''}
            <div class="btn-stack">
              ${options.map((o) => html`
                <button type="button" class="btn btn--${o.kind || 'soft'} btn--lg btn--wrap" data-choice="${o.value}">${o.label}</button>`)}
            </div>`,
          onMount(el, handle) {
            el.addEventListener('click', (e) => {
              const b = e.target.closest('[data-choice]');
              if (b) handle.close(b.dataset.choice);
            });
          },
          onClose(result) { resolve(typeof result === 'string' ? result : null); }
        });
      });
    }

    /* ---------- Übung auswählen --------------------------------------------------- */
    /**
     * Rückgabe: Promise<exerciseId | null>. Mit allowCreate lässt sich direkt
     * eine neue Übung anlegen (deren ID wird dann zurückgegeben).
     */
    function pickExercise({ title, intro = '', currentId = null, allowCreate = false, endLabel = null }) {
      return new Promise((resolve) => {
        const groups = CATEGORIES.map((cat) => ({
          cat,
          items: S.exercises
            .filter((e) => (e.category || inferCategory(e.name)) === cat.id)
            .sort((a, b) => a.name.localeCompare(b.name, 'de'))
        })).filter((g) => g.items.length);
        const showSearch = S.exercises.length > 12;

        Sheets.open({
          title,
          variant: 'sheet',
          body: html`
            ${intro ? html`<p class="form-intro" style="margin-bottom:14px">${intro}</p>` : ''}
            ${showSearch ? html`
              <div class="field" style="margin-bottom:14px">
                <label class="sr-only" for="pick-search">Übung suchen</label>
                <input class="input" id="pick-search" type="search" placeholder="Übung suchen" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
              </div>` : ''}
            ${groups.length ? groups.map((g) => html`
              <div class="pick-group" data-pick-group>
                <p class="overline">${g.cat.name}</p>
                <div class="pick-list">
                  ${g.items.map((ex) => {
                    const n = Idx.machinesOf(ex.id).length;
                    const current = ex.id === currentId;
                    return html`
                      <button type="button" class="${cls('pick-item', current && 'is-current')}" data-pick="${ex.id}" data-name="${ex.name.toLowerCase()}">
                        <span class="pick-main">${ex.name}</span>
                        <span class="pick-end">${current ? html`${icon('check')}` : (endLabel || plural(n, 'Gerät', 'Geräte'))}</span>
                      </button>`;
                  })}
                </div>
              </div>`) : emptyState({ iconName: 'dumbbell', title: 'Noch keine Übungen', text: 'Lege deine erste Übung an.' })}
            <p class="hint" data-pick-none hidden style="padding:16px 4px">Keine Übung gefunden.</p>
            ${allowCreate ? html`
              <div style="margin-top:20px">
