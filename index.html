                <button type="button" class="btn btn--tonal btn--lg btn--block" data-pick-create>${icon('plus')} Neue Übung anlegen</button>
              </div>` : ''}`,
          onMount(el, handle) {
            el.addEventListener('click', async (e) => {
              const item = e.target.closest('[data-pick]');
              if (item) { handle.close(item.dataset.pick); return; }
              if (e.target.closest('[data-pick-create]')) {
                const ex = await openCreateExercise();
                if (ex) handle.close(ex.id);
              }
            });
            const search = el.querySelector('#pick-search');
            if (search) {
              search.addEventListener('input', () => {
                const q = search.value.trim().toLowerCase();
                let any = false;
                el.querySelectorAll('[data-pick-group]').forEach((group) => {
                  let visible = 0;
                  group.querySelectorAll('[data-pick]').forEach((b) => {
                    const show = !q || b.dataset.name.includes(q);
                    b.hidden = !show;
                    if (show) visible++;
                  });
                  group.hidden = visible === 0;
                  if (visible) any = true;
                });
                el.querySelector('[data-pick-none]').hidden = any;
              });
            }
          },
          onClose(result) { resolve(typeof result === 'string' ? result : null); }
        });
      });
    }

    const UNIT_OPTIONS = [
      { value: 'kg', label: 'Kilogramm (kg)', hint: 'Freie Gewichte, Scheiben, Kurzhanteln' },
      { value: 'pin', label: 'Pin / Stufe', hint: 'Steckgewichte – du trägst die Stufe ein, nicht die Kilos' }
    ];
    const CATEGORY_OPTIONS = CATEGORIES.map((c) => ({ value: c.id, label: c.name }));

    /* ---------- Übung anlegen / bearbeiten --------------------------------------- */
    async function openCreateExercise() {
      const values = await formSheet({
        title: 'Neue Übung',
        submitLabel: 'Übung anlegen',
        fields: [
          { name: 'name', label: 'Name der Übung', placeholder: 'z. B. Schrägbankdrücken', required: true, autofocus: true },
          { name: 'category', label: 'Muskelgruppe', type: 'select', options: CATEGORY_OPTIONS, value: 'Brust' },
          { name: 'machineName', label: 'Erstes Gerät', value: 'Standard-Gerät', hint: 'Weitere Geräte kannst du später ergänzen.' },
          { name: 'unit', label: 'Einheit', type: 'choice', options: UNIT_OPTIONS, value: 'kg' }
        ]
      });
      if (!values) return null;
      const ex = createExercise(values);
      toast(`„${ex.name}“ angelegt`, { type: 'success' });
      renderView();
      return ex;
    }

    async function openEditExercise(exerciseId) {
      const ex = Idx.ex(exerciseId);
      if (!ex) return;
      const values = await formSheet({
        title: 'Übung bearbeiten',
        submitLabel: 'Speichern',
        fields: [
          { name: 'name', label: 'Name der Übung', value: ex.name, required: true },
          { name: 'category', label: 'Muskelgruppe', type: 'select', options: CATEGORY_OPTIONS, value: ex.category || inferCategory(ex.name) }
        ]
      });
      if (!values) return;
      updateExercise(exerciseId, values);
      toast('Übung aktualisiert', { type: 'success' });
      renderView();
    }

    async function confirmDeleteExercise(exerciseId) {
      const ex = Idx.ex(exerciseId);
      if (!ex) return false;
      const machines = Idx.machinesOf(exerciseId).length;
      const refs = countHistoryRefs((e) => e.exerciseId === exerciseId);
      const inPlan = S.splits.filter((sp) => sp.items.some((it) => it.exerciseId === exerciseId)).length;
      const ok = await confirmDialog({
        title: `„${ex.name}“ löschen?`,
        iconName: 'trash',
        danger: true,
        message: 'Die Übung wird aus der Übungsliste und aus dem Trainingsplan entfernt. Bereits gespeicherte Einheiten bleiben im Verlauf erhalten.',
        details: html`
          <ul class="confirm-list">
            <li><span>Geräte, die mitgelöscht werden</span><b>${machines}</b></li>
            <li><span>Trainingstage im Plan</span><b>${inPlan}</b></li>
            <li><span>Einheiten im Verlauf (bleiben)</span><b>${refs}</b></li>
          </ul>`,
        confirmLabel: 'Übung löschen'
      });
      if (!ok) return false;
      deleteExercise(exerciseId);
      toast('Übung gelöscht');
      renderView();
      return true;
    }

    /* ---------- Gerät anlegen / bearbeiten ---------------------------------------- */
    async function openCreateMachine(exerciseId) {
      const ex = Idx.ex(exerciseId);
      if (!ex) return null;
      const values = await formSheet({
        title: 'Neues Gerät',
        subtitle: ex.name,
        submitLabel: 'Gerät anlegen',
        fields: [
          { name: 'name', label: 'Name des Geräts', placeholder: 'z. B. Gym80 Brustpresse', required: true, autofocus: true },
          { name: 'unit', label: 'Einheit', type: 'choice', options: UNIT_OPTIONS, value: 'kg' },
          { name: 'setupNote', label: 'Einstellung (optional)', placeholder: 'z. B. Sitz 4, Rückenpolster 2', maxlength: 120 }
        ]
      });
      if (!values) return null;
      const mach = createMachine(exerciseId, values);
      toast('Gerät angelegt', { type: 'success' });
      renderView();
      return mach;
    }

    /**
     * Gerät bearbeiten: Name, Einheit, Einstellung. Ersetzt den bisherigen
     * Ein-Tipp-Umschalter kg↔Pin, der unbemerkt den gesamten Verlauf umdeutete.
     */
    async function openEditMachine(machineId, { focusNote = false, allowDelete = false } = {}) {
      const m = Idx.mach(machineId);
      if (!m) return;
      const refs = countHistoryRefs((e) => e.machineId === machineId);
      const values = await formSheet({
        title: 'Gerät bearbeiten',
        subtitle: exerciseName(m.exerciseId),
        submitLabel: 'Speichern',
        fields: [
          { name: 'name', label: 'Name des Geräts', value: m.name, required: true },
          { name: 'setupNote', label: 'Einstellung', value: m.setupNote || '', placeholder: 'z. B. Sitz 4, Griff eng', maxlength: 120, autofocus: focusNote ? 'select' : false,
            hint: 'Wird im Training bei diesem Gerät angezeigt.' },
          { name: 'unit', label: 'Einheit', type: 'choice', options: UNIT_OPTIONS, value: m.unit === 'pin' ? 'pin' : 'kg',
            hint: refs ? `Gilt auch für ${plural(refs, 'gespeicherte Einheit', 'gespeicherte Einheiten')} an diesem Gerät – die Zahlen selbst bleiben unverändert.` : '' }
        ],
        extra: allowDelete ? html`
          <button type="button" class="btn btn--ghost btn--block" style="color:var(--danger)" data-form-extra="delete">${icon('trash')} Gerät löschen</button>` : null
      });
      if (!values) return;
      if (values.__extra === 'delete') { await confirmDeleteMachine(machineId); return; }

      updateMachine(machineId, values);
      toast('Gerät gespeichert', { type: 'success' });
      renderView();
    }

    async function confirmDeleteMachine(machineId) {
      const m = Idx.mach(machineId);
      if (!m) return false;
      const siblings = Idx.machinesOf(m.exerciseId).length;
      const refs = countHistoryRefs((e) => e.machineId === machineId);
      const ok = await confirmDialog({
        title: `„${m.name}“ löschen?`,
        iconName: 'trash',
        danger: true,
        message: [
          refs ? `${plural(refs, 'gespeicherte Einheit bleibt', 'gespeicherte Einheiten bleiben')} im Verlauf erhalten.` : 'Zu diesem Gerät gibt es noch keine gespeicherten Einheiten.',
          siblings === 1 ? 'Da jede Übung ein Gerät braucht, wird automatisch ein „Standard-Gerät“ angelegt.' : ''
        ].filter(Boolean).join(' '),
        confirmLabel: 'Gerät löschen'
      });
      if (!ok) return false;
      deleteMachine(machineId);
      toast('Gerät gelöscht');
      renderView();
      return true;
    }

    /* ==========================================================================
       07 · TRAINING
       Wochenleiste · Trainingstag-Auswahl · Übungskarten · Satz-Zeilen
       ========================================================================== */

    const SET_TYPE_NAMES = { normal: 'Arbeitssatz', warmup: 'Aufwärmsatz', dropset: 'Dropsatz' };

    function fmtWeekRange(monday) {
      const a = parseIso(monday);
      const b = parseIso(addDays(monday, 6));
      if (a.getMonth() === b.getMonth()) return `${a.getDate()}.–${b.getDate()}. ${MONTHS_SHORT[b.getMonth()]}`;
      return `${a.getDate()}. ${MONTHS_SHORT[a.getMonth()]} – ${b.getDate()}. ${MONTHS_SHORT[b.getMonth()]}`;
    }

    /** „Montag – Push“ → „Push“ (für die Überschrift; das Datum steht direkt darüber) */
    function shortSplitName(name) {
      const parts = String(name || '').split(SPLIT_SEPARATOR);
      const short = parts.length > 1 ? parts.slice(1).join(' – ').trim() : '';
      return (short || String(name || 'Training')).replace(/\s*\(Abgehakt\)\s*$/i, '');
    }

    const isRestView = (d) => {
      const split = splitById(d.splitId);
      return Boolean((d.isRest || (split && split.isRest)) && d.entries.length === 0);
    };

    Views.workout = {
      header() {
        const d = S.draft;
        if (!d) return {};
        const counts = draftSetCounts(d);
        const offToday = d.date !== todayIso();
        return {
          title: 'Training',
          actions: offToday ? html`<button type="button" class="pill-btn pill-btn--accent" data-act="go-today">${icon('undo')}Heute</button>` : '',
          progress: counts.total > 0 ? counts.checked / counts.total : null
        };
      },

      render() {
        if (!S.draft) return;
        patch($('#view-workout'), workoutMarkup());
      }
    };

    const renderWorkoutSoon = debounce(() => { if (S.ui.tab === 'workout') renderView('workout'); }, 140);

    /* ---------- Markup ------------------------------------------------------------ */
    function workoutMarkup() {
      const d = S.draft;
      const date = d.date;
      const today = todayIso();
      const monday = mondayOf(date);
      const labels = splitChipLabels();
      const logsToday = Idx.sessionsOn(date);
      const loggedSplitIds = new Set(logsToday.map((s) => s.splitId));
      const counts = draftSetCounts(d);
      const rest = isRestView(d);
      const saved = Boolean(d.editingSessionId);

      const days = WEEKDAYS_SHORT.map((wd, i) => {
        const iso = addDays(monday, i);
        const logs = Idx.sessionsOn(iso);
        const hasWorkout = logs.some(isWorkoutSession);
        const hasRest = logs.length > 0 && !hasWorkout;
        const hasDraft = !logs.length && Object.keys(S.drafts).some((k) => k.startsWith(`${iso}_`));
        const state = hasWorkout ? 'Training gespeichert' : hasRest ? 'Pausentag abgehakt' : hasDraft ? 'Entwurf begonnen' : '';
        return html`
          <button type="button" class="${cls('day', iso === date && 'is-selected', iso === today && 'is-today')}"
                  data-act="pick-day" data-date="${iso}" aria-pressed="${iso === date ? 'true' : 'false'}"
                  aria-label="${fmtDate(iso, 'full')}${iso === today ? ', heute' : ''}${state ? ', ' + state : ''}">
            <span class="day-wd">${wd}</span>
            <span class="day-num num">${parseIso(iso).getDate()}</span>
            <span class="${cls('day-mark', hasWorkout && 'is-workout', hasRest && 'is-rest', hasDraft && 'is-draft')}"></span>
          </button>`;
      });

      const chips = S.splits.map((s) => html`
        <button type="button" class="${cls('chip', s.id === d.splitId && 'is-active')}" data-act="pick-split" data-id="${s.id}"
                aria-pressed="${s.id === d.splitId ? 'true' : 'false'}">
          ${s.isRest ? icon('moon') : ''}<span>${labels.get(s.id)}</span>${loggedSplitIds.has(s.id) ? icon('check', 'chip-check') : ''}
        </button>`);

      const rel = relativeDay(date);
      const split = splitById(d.splitId);
      const title = rest ? 'Pausentag' : shortSplitName(saved ? d.splitName : (split ? split.name : d.splitName));
      const statusBadge = saved
        ? (d.editDirty ? html`<span class="badge badge--warn">Ungespeichert</span>` : html`<span class="badge badge--accent">${icon('check')}Gespeichert</span>`)
        : (d.touched ? html`<span class="badge">Entwurf</span>` : '');

      const storageNotice = Storage.mode === 'idb' ? '' : html`
        <div class="notice notice--warn">
          ${icon('alert')}
          <div class="notice-text">
            <b>${Storage.mode === 'memory' ? 'Speichern ist gerade nicht möglich' : 'Die Datenbank ist gerade nicht erreichbar'}</b>
            <span>${Storage.mode === 'memory'
              ? 'Dieser Browser erlaubt kein Speichern – Eingaben gehen beim Schließen verloren.'
              : 'Es wird ein Ersatzspeicher genutzt. Falls hier deine bisherigen Einheiten fehlen: App ganz schließen und neu öffnen – deine Daten sind nicht gelöscht.'}</span>
          </div>
        </div>`;

      syncTimerInterval();
      const elapsedSec = draftElapsedSec(d);
      const timerRunning = Boolean(d.timerStartedAt);
      const timerPaused = !timerRunning && elapsedSec > 0;
      const savedDur = saved ? (Number(d.duration) || 0) : 0;
      const hasCompletedSets = d.entries.some((e) => e.sets.some((s) => s.completed));
      const showTimer = !rest && (!saved || hasCompletedSets);

      return html`
        ${storageNotice}
        <div class="weeknav">
          <div class="weekbar">
            <div class="weekbar-label">
              <b>KW ${isoWeek(date)}</b>
              <span class="num">${fmtWeekRange(monday)}</span>
              ${showTimer ? (saved ? html`
                <button type="button" class="workout-timer is-saved num" data-act="timer-menu"
                        aria-label="${savedDur > 0 ? `Gespeicherte Trainingszeit: ${fmtDurationText(savedDur)}. Tippen zum Anpassen` : 'Trainingszeit nachtragen'}">
                  ${icon('history')}
                  <span>${savedDur > 0 ? fmtTimer(savedDur) : 'Zeit +'}</span>
                </button>` : html`
                <button type="button" class="${cls('workout-timer num', timerRunning && 'is-running', timerPaused && 'is-paused')}"
                        data-act="timer-menu" aria-label="Trainings-Timer: ${fmtTimer(elapsedSec)}. Tippen zum Steuern">
                  <span class="workout-timer-dot" aria-hidden="true"></span>
                  <span data-workout-timer>${fmtTimer(elapsedSec)}</span>
                </button>`) : ''}
            </div>
            <div class="weekbar-nav">
              <button type="button" class="icon-btn" data-act="week-shift" data-dir="-1" aria-label="Vorherige Woche">${icon('chevron-left')}</button>
              <button type="button" class="icon-btn" data-act="week-shift" data-dir="1" aria-label="Nächste Woche">${icon('chevron-right')}</button>
              <span class="icon-btn datepick">
                ${icon('calendar')}
                <input type="date" class="datepick-input" value="${date}" data-change="pick-date" data-act="open-picker" aria-label="Datum wählen">
              </span>
            </div>
          </div>
          <div class="days" role="group" aria-label="Tag auswählen">${days}</div>
          <div class="chips" id="split-chips" role="group" aria-label="Trainingstag auswählen">${chips}</div>
        </div>

        <div class="session-head">
          <div class="session-titles">
            <p class="overline">${rel ? `${rel} · ` : ''}${fmtDate(date, 'full')}${saved && savedDur > 0 ? ` · ${fmtDurationShort(savedDur)}` : ''}</p>
            <h2 class="session-title"><span>${title}</span>${statusBadge}</h2>
          </div>
          ${counts.total > 0 ? html`
            <div class="session-figure" aria-label="${counts.checked} von ${counts.total} Sätzen abgehakt">
              <b class="num">${counts.checked}</b><span class="num">/ ${counts.total}</span><small>Sätze</small>
            </div>` : ''}
        </div>

        ${saved && d.editDirty ? html`
          <div class="notice notice--warn">
            ${icon('alert')}
            <div class="notice-text"><b>Ungespeicherte Änderungen</b><span>Speichere unten oder verwirf die Änderungen.</span></div>
            <button type="button" class="btn btn--sm btn--soft" data-act="discard-edits">Verwerfen</button>
          </div>` : ''}

        ${rest ? restCard(d, saved) : (d.entries.length === 0
          ? html`<div class="card">${emptyState({
              iconName: 'dumbbell',
              title: 'Noch keine Übungen',
              text: 'Füge Übungen für diese Einheit hinzu oder ergänze den Trainingstag im Plan.'
            })}</div>`
          : html`<div class="ex-list" data-animate-children>${d.entries.map((e, i) => exerciseCard(e, i, d))}</div>`)}

        <div class="workout-actions">
          <button type="button" class="btn btn--soft btn--lg btn--block" data-act="add-exercise">${icon('plus')}Übung hinzufügen</button>
          ${rest ? '' : finishButton(d, counts)}
          ${saved
            ? html`<button type="button" class="text-btn text-btn--muted workout-more" data-act="saved-menu">${icon('more')}Weitere Aktionen</button>`
            : (d.touched ? html`<button type="button" class="text-btn text-btn--muted workout-more" data-act="reset-draft">${icon('undo')}Eingaben zurücksetzen</button>` : '')}
        </div>`;
    }

    function finishButton(d, counts) {
      if (d.editingSessionId) {
        return html`
          <button type="button" class="btn btn--primary btn--xl btn--block" data-act="finish" ${d.editDirty ? '' : raw('disabled')}>
            ${icon('check')}${d.editDirty ? 'Änderungen speichern' : 'Gespeichert'}
          </button>`;
      }
      const none = (counts.anyValid || 0) === 0 && counts.checked + counts.filledUnchecked === 0;
      return html`
        <button type="button" class="${cls('btn btn--xl btn--block', none ? 'btn--soft' : 'btn--primary')}" data-act="finish">
          ${icon('flag')}${none ? 'Tag ohne Sätze abhaken' : 'Training abschließen'}
        </button>`;
    }

    function restCard(d, saved) {
      if (saved) {
        return html`
          <div class="card rest-card is-done">
            <div class="rest-icon">${icon('check-circle')}</div>
            <h3 class="rest-title">Tag abgehakt</h3>
            <p class="rest-text">${d.splitName && !/pause|rest/i.test(d.splitName) ? html`„${d.splitName.replace(/\s*\(Abgehakt\)\s*$/i, '')}“ wurde ohne Sätze als erledigt markiert.` : 'Dieser Pausentag zählt im Kalender als erledigt.'}</p>
            <button type="button" class="btn btn--ghost" data-act="rest-unlog">${icon('undo')}Haken entfernen</button>
          </div>`;
      }
      return html`
        <div class="card rest-card">
          <div class="rest-icon">${icon('moon')}</div>
          <h3 class="rest-title">Pausentag</h3>
          <p class="rest-text">Laut Plan ist Regeneration angesagt. Hake den Tag ab – oder füge spontan Übungen hinzu.</p>
          <button type="button" class="btn btn--primary btn--lg" data-act="finish">${icon('check')}Pausentag abhaken</button>
        </div>`;
    }

    function exerciseCard(entry, i, d) {
      const ex = Idx.ex(entry.exerciseId);
      const name = exerciseName(entry.exerciseId, entry);
      const machines = Idx.machinesOf(entry.exerciseId);
      const machine = Idx.mach(entry.machineId);
      const unit = unitOf(entry.machineId, entry);
      const last = lastPerformance(entry.exerciseId, entry.machineId, d.date, d.editingSessionId || null);
      const workSets = entry.sets.filter((s) => s.type !== 'warmup');
      const done = workSets.filter((s) => s.completed).length;
      const total = workSets.length;
      const allDone = total > 0 && done === total;
      const collapsed = Boolean(entry.collapsed);
      const orphanMachine = !machine;

      // Satz-Marke: Arbeitssätze sind durchnummeriert (Dropsätze zählen mit), W = Aufwärmen, D = Dropsatz
      let workIdx = 0;
      const chipTexts = entry.sets.map((s) => {
        if (s.type === 'warmup') return 'W';
        workIdx++;
        return s.type === 'dropset' ? 'D' : String(workIdx);
      });

      const doneSummary = entry.sets.filter((s) => s.completed).map(fmtSetShort).join(' · ');
      const collapsedSub = [machineName(entry.machineId, entry), doneSummary || plural(total, 'Satz geplant', 'Sätze geplant')].join(' · ');

      return html`
        <article class="${cls('ex-card card', allDone && 'is-done', collapsed && 'is-collapsed')}" data-key="${entry.entryId}" data-entry="${i}" id="entry-${entry.entryId}"
                 data-cat="${ex ? categoryOf(entry.exerciseId) : ''}">
          <header class="ex-head">
            <button type="button" class="ex-toggle" data-act="toggle-entry" aria-expanded="${collapsed ? 'false' : 'true'}">
              <span class="ex-titles">
                <span class="ex-meta">
                  <span class="overline">${ex ? categoryOf(entry.exerciseId) : 'Nicht mehr in der Übungsliste'}</span>
                  <span class="${cls('ex-count num', allDone && 'is-done')}" aria-label="${done} von ${total} Sätzen abgehakt">${allDone ? icon('check') : ''}${done}/${total}</span>
                </span>
                <span class="ex-name">${name}</span>
                <span class="ex-sub num">${collapsedSub}</span>
              </span>
              ${icon('chevron-down', 'ex-chevron')}
            </button>
            <button type="button" class="icon-btn" data-act="entry-menu" aria-label="Aktionen für ${name}">${icon('more')}</button>
          </header>

          <div class="ex-body-wrap" ${collapsed ? raw('inert') : ''}>
            <div class="ex-body">
              ${ex ? html`
                <div class="machine">
                  <div class="machine-row">
                    <div class="select-wrap machine-select">
                      ${icon('weight', 'machine-icon')}
                      <select class="input" aria-label="Gerät für ${name}" data-change="entry-machine">
                        ${orphanMachine ? html`<option value="${entry.machineId}" selected>${machineName(entry.machineId, entry)} (gelöscht)</option>` : ''}
                        ${machines.map((m) => html`<option value="${m.id}" ${m.id === entry.machineId ? raw('selected') : ''}>${m.name}</option>`)}
                      </select>
                      ${icon('chevron-down', 'select-chevron')}
                    </div>
                    ${machine ? html`
                      <button type="button" class="unit-toggle" data-act="toggle-unit"
                              aria-label="Einheit: ${unit === 'pin' ? 'Pin-Stufen' : 'Kilogramm'}. Tippen wechselt zu ${unit === 'pin' ? 'Kilogramm' : 'Pin-Stufen'}">
                        <span>${unitLabel(unit)}</span>${icon('swap')}
                      </button>` : html`<span class="unit-toggle is-static">${unitLabel(unit)}</span>`}
                  </div>
                  ${machine ? html`
                    <button type="button" class="${cls('machine-note', !machine.setupNote && 'is-empty')}" data-act="machine-note">
                      ${icon('sliders')}<span>${machine.setupNote || 'Einstellung notieren (Sitz, Polster …)'}</span>
                    </button>` : ''}
                </div>` : html`
                <div class="machine"><p class="hint">${machineName(entry.machineId, entry)} · ${unitLabel(unit)}</p></div>`}

              <div class="set-table">
                <div class="set-head" aria-hidden="true">
                  <span>Satz</span><span>${unitLabel(unit)}</span><span>Wdh.</span><span>Part.</span><span>${icon('check')}</span>
                </div>
                <div class="set-rows" data-animate-children>
                  ${entry.sets.map((s, j) => setRow(entry, s, j, chipTexts[j], unit))}
                </div>
              </div>

              <button type="button" class="add-set" data-act="add-set">${icon('plus')}Satz hinzufügen</button>
            </div>
          </div>
        </article>`;
    }

    function setRow(entry, s, j, chipText, unit) {
      const ghost = ghostSet(entry, j);
      const explicitP = s.partials !== null && s.partials !== undefined;
      const ghostP = ghost ? (Number(ghost.partials) || 0) : 0;
      const shownP = explicitP ? Number(s.partials) : ghostP;
      const pState = explicitP ? (shownP > 0 ? 'is-on' : 'is-zero') : (ghostP > 0 ? 'is-ghost' : 'is-zero');
      const n = j + 1;
      const inputAttrs = raw('autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-select-on-focus');

      return html`
        <div class="${cls('set', `set--${s.type}`, s.completed && 'is-done')}" data-key="${s.sid}" data-set="${j}">
          <div class="set-row">
            <button type="button" class="set-chip" data-act="set-menu" aria-label="Satz ${n}: ${SET_TYPE_NAMES[s.type]}. Satztyp ändern, kopieren oder entfernen">${chipText}</button>
            <input class="set-input num" type="text" inputmode="decimal" enterkeyhint="next" ${inputAttrs}
                   value="${s.weight}" placeholder="${ghost ? numToInput(ghost.weight) : ''}"
                   aria-label="${unit === 'pin' ? 'Pin-Stufe' : 'Gewicht in Kilogramm'}, Satz ${n}"
                   data-input="set-field" data-field="weight" data-enter="set-next">
            <input class="set-input num" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" ${inputAttrs}
                   value="${s.reps}" placeholder="${ghost ? numToInput(ghost.reps) : ''}"
                   aria-label="Wiederholungen, Satz ${n}"
                   data-input="set-field" data-field="reps" data-enter="set-done">
            <button type="button" class="${cls('set-partial num', pState)}" data-act="set-partials"
                    aria-label="Partials: ${shownP}${pState === 'is-ghost' ? ' (Vorwert, noch nicht übernommen)' : ''}. Tippen erhöht, nach 5 zurück auf 0">+${shownP}</button>
            <button type="button" class="set-check" data-act="set-toggle" aria-pressed="${s.completed ? 'true' : 'false'}"
                    aria-label="${s.completed ? `Satz ${n} wieder öffnen` : `Satz ${n} abhaken`}">${icon('check')}</button>
          </div>
          ${s.type === 'dropset' ? html`
            <div class="drops">
              ${(s.drops || []).map((dr, k) => {
                const g = ghost && ghost.drops && ghost.drops[k] ? ghost.drops[k] : null;
                return html`
                  <div class="drop-row" data-drop="${k}">
                    <span class="drop-label" aria-hidden="true">${icon('arrow-down')}</span>
                    <input class="set-input num" type="text" inputmode="decimal" enterkeyhint="next" ${inputAttrs}
                           value="${dr.weight}" placeholder="${g ? numToInput(g.weight) : ''}" aria-label="Drop-Stufe ${k + 1}: ${unit === 'pin' ? 'Pin-Stufe' : 'Gewicht'}"
                           data-input="drop-field" data-field="weight">
                    <input class="set-input num" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" ${inputAttrs}
                           value="${dr.reps}" placeholder="${g ? numToInput(g.reps) : ''}" aria-label="Drop-Stufe ${k + 1}: Wiederholungen"
                           data-input="drop-field" data-field="reps">
                    <button type="button" class="icon-btn drop-remove" data-act="drop-remove" aria-label="Drop-Stufe ${k + 1} entfernen">${icon('x')}</button>
                  </div>`;
              })}
              <button type="button" class="drop-add" data-act="drop-add">${icon('plus')}Drop-Stufe</button>
            </div>` : ''}
        </div>`;
    }

    /* ---------- Helfer für Aktionen ----------------------------------------------- */
    function entryCtx(el) {
      const card = el.closest('[data-entry]');
      const i = card ? Number(card.dataset.entry) : -1;
      const row = el.closest('[data-set]');
      const j = row ? Number(row.dataset.set) : -1;
      const drop = el.closest('[data-drop]');
      const k = drop ? Number(drop.dataset.drop) : -1;
      const entry = S.draft && S.draft.entries[i] ? S.draft.entries[i] : null;
      const set = entry && j >= 0 ? entry.sets[j] || null : null;
      return { i, j, k, entry, set };
    }

    function blurActive() {
      const a = document.activeElement;
      if (a && a !== document.body && typeof a.blur === 'function') a.blur();
    }

    function centerActiveChip() {
      const box = $('#split-chips');
      const act = box && box.querySelector('.chip.is-active');
      if (!box || !act) return;
      const left = act.offsetLeft - (box.clientWidth - act.offsetWidth) / 2;
      box.scrollTo({ left: Math.max(0, left), behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }

    /** Fragt bei ungespeicherten Änderungen an einer gespeicherten Einheit nach. */
    async function guardUnsaved() {
      if (!hasUnsavedEdits()) return true;
      const choice = await choiceDialog({
        title: 'Änderungen speichern?',
        iconName: 'alert',
        message: 'Du hast diese gespeicherte Einheit geändert, aber noch nicht gespeichert.',
        options: [
          { value: 'save', label: 'Änderungen speichern', kind: 'primary' },
          { value: 'discard', label: 'Änderungen verwerfen', kind: 'danger-soft' },
          { value: 'cancel', label: 'Zurück', kind: 'ghost' }
        ]
      });
      if (choice === 'save') return finishFlow({ silentScroll: true });
      if (choice === 'discard') { S.draft.editDirty = false; return true; }
      return false;
    }

    async function goToDay(date, splitId = null) {
      if (!(await guardUnsaved())) return;
      blurActive();
      openDay(date, splitId);
      Persist.draftNow();
      renderView('workout');
      centerActiveChip();
    }

    /* ---------- Navigation --------------------------------------------------------- */
    Actions['pick-day'] = (el) => { haptic(); return goToDay(el.dataset.date); };
    Actions['week-shift'] = (el) => goToDay(addDays(S.draft.date, 7 * Number(el.dataset.dir)));
    Actions['go-today'] = () => goToDay(todayIso());

    async function editSavedDuration(d) {
      if (!d) return;
      const currentMin = d.duration > 0 ? Math.max(1, Math.round(d.duration / 60)) : 45;
      const values = await formSheet({
        title: 'Trainingszeit',
        subtitle: `${fmtDate(d.date, 'full')} · ${shortSplitName(d.splitName)}`,
        intro: d.duration > 0 ? `Gespeicherte Dauer: ${fmtDurationText(d.duration)}` : 'Für diese Einheit ist noch keine Trainingsdauer hinterlegt.',
        submitLabel: 'Dauer speichern',
        fields: [
          { name: 'minutes', label: 'Trainingsdauer in Minuten', type: 'stepper', value: currentMin, min: 0, max: 360, hint: '0 = Trainingsdauer entfernen' }
        ]
      });
      if (!values) return;
      const newSec = Math.max(0, Number(values.minutes) || 0) * 60;
      d.duration = newSec;
      if (d.editingSessionId) {
        const sess = S.sessions.find((s) => s.id === d.editingSessionId);
        if (sess) {
          if (newSec > 0) sess.duration = newSec;
          else delete sess.duration;
          upsertSession(sess);
        }
      }
      Persist.draftNow();
      renderView();
      toast(newSec > 0 ? `Trainingszeit gespeichert: ${fmtDurationShort(newSec)}` : 'Trainingszeit entfernt', { type: 'success' });
    }

    Actions['timer-menu'] = async () => {
      const d = S.draft;
      if (!d || isRestView(d)) return;
      if (d.editingSessionId) {
        await editSavedDuration(d);
        return;
      }
      const running = Boolean(d.timerStartedAt);
      const elapsed = draftElapsedSec(d);
      if (!running && elapsed === 0) {
        d.timerStartedAt = Date.now();
        d.timerManual = true;
        d.touched = true;
        S.drafts[draftKey(d.date, d.splitId)] = d;
        Persist.draftSoon();
        haptic('tap');
        renderView('workout');
        toast('Trainings-Timer gestartet', { type: 'info', duration: 2200 });
        return;
      }
      const choice = await actionSheet({
        title: `Trainings-Timer · ${fmtTimer(elapsed)}`,
        subtitle: running ? 'Läuft gerade' : 'Pausiert',
        actions: [
          running
            ? { value: 'pause', label: 'Timer pausieren', icon: 'history' }
            : { value: 'resume', label: 'Timer fortsetzen', icon: 'bolt' },
          { value: 'set', label: 'Zeit manuell anpassen', icon: 'pencil' },
          { value: 'reset', label: 'Auf 00:00 zurücksetzen', icon: 'undo', danger: true }
        ]
      });
      if (choice === 'pause' && d.timerStartedAt) {
        d.timerElapsed = draftElapsedSec(d);
        delete d.timerStartedAt;
        Persist.draftSoon();
        renderView('workout');
      } else if (choice === 'resume' && !d.timerStartedAt) {
        d.timerStartedAt = Date.now();
        d.timerManual = true;
        Persist.draftSoon();
        renderView('workout');
      } else if (choice === 'set') {
        const curMin = Math.max(1, Math.round(draftElapsedSec(d) / 60));
        const values = await formSheet({
          title: 'Timer anpassen',
          submitLabel: 'Übernehmen',
          fields: [{ name: 'minutes', label: 'Bisherige Dauer in Minuten', type: 'stepper', value: curMin, min: 0, max: 360 }]
        });
        if (values) {
          d.timerElapsed = Math.max(0, Number(values.minutes) || 0) * 60;
          if (d.timerStartedAt) d.timerStartedAt = Date.now();
          d.timerManual = true;
          d.touched = true;
          S.drafts[draftKey(d.date, d.splitId)] = d;
          Persist.draftSoon();
          renderView('workout');
        }
      } else if (choice === 'reset') {
        delete d.timerStartedAt;
        delete d.timerElapsed;
        delete d.timerManual;
        Persist.draftSoon();
        renderView('workout');
        toast('Timer zurückgesetzt');
      }
    };
    Actions['pick-split'] = (el) => {
      if (el.dataset.id === S.draft.splitId && !S.draft.editingSessionId) return undefined;
      haptic();
      return goToDay(S.draft.date, el.dataset.id);
    };
    Actions['open-picker'] = (el) => { try { if (typeof el.showPicker === 'function') el.showPicker(); } catch (_) { /* iOS öffnet den Picker selbst */ } };
    Changes['pick-date'] = (el) => { if (isValidIso(el.value)) return goToDay(el.value); return undefined; };

    /* ---------- Übungskarte -------------------------------------------------------- */
    Actions['toggle-entry'] = (el) => {
      const { entry } = entryCtx(el);
      if (!entry) return;
      entry.collapsed = !entry.collapsed;
      Persist.draftSoon();
      renderView('workout');
    };

    Actions['entry-menu'] = async (el) => {
      const { i, entry } = entryCtx(el);
      if (!entry) return;
      const d = S.draft;
      const hasEx = Boolean(Idx.ex(entry.exerciseId));
      const hasMachine = Boolean(Idx.mach(entry.machineId));
      const last = lastPerformance(entry.exerciseId, entry.machineId, d.date, d.editingSessionId || null);
      const choice = await actionSheet({
        title: exerciseName(entry.exerciseId, entry),
        actions: [
          last && { value: 'fill', label: 'Vorwerte übernehmen', icon: 'copy', hint: `Werte vom ${fmtDate(last.date, 'day')} in alle Sätze eintragen` },
          hasEx && { value: 'swap', label: 'Übung tauschen', icon: 'swap', hint: 'Nur für diese Einheit' },
          hasMachine && { value: 'machine', label: 'Gerät bearbeiten', icon: 'sliders', hint: 'Name, Einheit (kg/Pin), Einstellung' },
          hasEx && { value: 'new-machine', label: 'Neues Gerät anlegen', icon: 'plus' },
          { separator: true },
          { value: 'up', label: 'Nach oben', icon: 'arrow-up', disabled: i === 0 },
          { value: 'down', label: 'Nach unten', icon: 'arrow-down', disabled: i === d.entries.length - 1 },
          { value: 'remove', label: 'Aus dieser Einheit entfernen', icon: 'trash', danger: true }
        ]
      });
      if (!choice) return;
      if (choice === 'fill') fillPrevious(entry);
      else if (choice === 'swap') await swapEntryExercise(entry);
      else if (choice === 'machine') await openEditMachine(entry.machineId);
      else if (choice === 'new-machine') {
        const mach = await openCreateMachine(entry.exerciseId);
        if (mach) { setEntryMachine(entry, mach.id); renderView('workout'); }
      } else if (choice === 'up' || choice === 'down') {
        const target = i + (choice === 'up' ? -1 : 1);
        [d.entries[i], d.entries[target]] = [d.entries[target], d.entries[i]];
        touchDraft();
        renderView('workout');
      } else if (choice === 'remove') {
        const removed = d.entries.splice(i, 1)[0];
        reconcileTimerAfterUncheck(d);
        touchDraft();
        renderView('workout');
        toast('Übung entfernt', {
          action: { label: 'Rückgängig', run: () => { d.entries.splice(Math.min(i, d.entries.length), 0, removed); touchDraftOf(d); renderView('workout'); } }
        });
      }
    };

    function setEntryMachine(entry, machineId) {
      entry.machineId = machineId;
      delete entry.machineName;
      delete entry.unit;
      // Zeilen nur neu aufbauen, wenn noch nichts eingetragen ist – Eingaben gehen nie verloren
      if (!entryHasInput(entry)) {
        entry.sets = buildSetRows(entry.exerciseId, machineId, entry.targetSets, S.draft.date, S.draft.editingSessionId || null);
      }
      touchDraft();
    }

    Changes['entry-machine'] = (el) => {
      const { entry } = entryCtx(el);
      if (!entry) return;
      setEntryMachine(entry, el.value);
      renderView('workout');
    };

    Actions['machine-note'] = (el) => {
      const { entry } = entryCtx(el);
      if (entry) return openEditMachine(entry.machineId, { focusNote: true });
      return undefined;
    };

    function fillPrevious(entry) {
      const d = S.draft;
      const last = lastPerformance(entry.exerciseId, entry.machineId, d.date, d.editingSessionId || null);
      if (!last || !last.sets.length) { toast('Für dieses Gerät gibt es noch keine Vorwerte.', { type: 'warn' }); return; }
      const before = entry.sets;
      entry.sets = last.sets.map((p) => ({
        sid: uid('s'),
        weight: numToInput(p.weight),
        reps: numToInput(p.reps),
        type: p.type || 'normal',
        partials: Number(p.partials) || 0,
        drops: p.type === 'dropset' ? (p.drops || []).map((x) => ({ weight: numToInput(x.weight), reps: numToInput(x.reps) })) : [],
        completed: false
      }));
      entry.collapsed = false;
      touchDraft();
      renderView('workout');
      toast('Vorwerte eingetragen – jetzt Satz für Satz abhaken.', {
        type: 'success',
        action: before.some(setHasInput) ? { label: 'Rückgängig', run: () => { entry.sets = before; touchDraftOf(d); renderView('workout'); } } : null
      });
    }

    /** Einheit des Geräts mit einem Tipp wechseln (kg ↔ Pin) – wie in der bisherigen Version, mit „Rückgängig“. */
    Actions['toggle-unit'] = (el) => {
      const { entry } = entryCtx(el);
      const m = entry ? Idx.mach(entry.machineId) : null;
      if (!m) return;
      const prev = m.unit === 'pin' ? 'pin' : 'kg';
      const next = prev === 'pin' ? 'kg' : 'pin';
      updateMachine(m.id, { unit: next });
      haptic();
      renderView('workout');
      toast(`Jetzt in ${unitLabel(next)}: ${m.name}`, {
        type: 'success',
        action: { label: 'Rückgängig', run: () => { updateMachine(m.id, { unit: prev }); renderView(); } }
      });
    };

    async function swapEntryExercise(entry) {
      const d = S.draft;
      const newId = await pickExercise({
        title: 'Übung tauschen',
        intro: `„${exerciseName(entry.exerciseId, entry)}“ nur für diese Einheit ersetzen. Der Trainingsplan bleibt unverändert.`,
        currentId: entry.exerciseId,
        allowCreate: true
      });
      if (!newId || newId === entry.exerciseId || !Idx.ex(newId)) return;
      if (entryHasInput(entry)) {
        const ok = await confirmDialog({
          title: 'Eingetragene Sätze ersetzen?',
          iconName: 'swap',
          message: 'Für diese Übung sind bereits Werte eingetragen. Beim Tauschen werden sie durch leere Sätze der neuen Übung ersetzt.',
          confirmLabel: 'Übung tauschen'
        });
        if (!ok) return;
      }
      const fresh = newDraftEntry(newId, { targetSets: entry.targetSets || 2, date: d.date, excludeSessionId: d.editingSessionId || null });
      Object.assign(entry, { exerciseId: fresh.exerciseId, labelOverride: fresh.labelOverride, machineId: fresh.machineId, sets: fresh.sets, collapsed: false });
      delete entry.machineName;
      delete entry.unit;
      touchDraft();
      renderView('workout');
      toast(`Getauscht: ${exerciseName(newId)}`, { type: 'success' });
    }

    /* ---------- Sätze --------------------------------------------------------------- */
    Inputs['set-field'] = (el) => {
      const { set } = entryCtx(el);
      if (!set) return;
      set[el.dataset.field] = el.value;
      if (set.completed && !cleanDraftSet(set)) { set.completed = false; reconcileTimerAfterUncheck(); } // Haken ohne gültige Werte ergibt keinen Sinn
      touchDraft();
      renderWorkoutSoon();
    };

    Inputs['drop-field'] = (el) => {
      const { set, k } = entryCtx(el);
      if (!set || !set.drops || !set.drops[k]) return;
      set.drops[k][el.dataset.field] = el.value;
      touchDraft();
    };

    Actions['set-next'] = (el) => {
      const row = el.closest('.set-row');
      const next = row && row.querySelector('[data-field="reps"]');
      if (next) next.focus();
    };
    Actions['set-done'] = (el) => {
      const { set } = entryCtx(el);
      // Enter bzw. „Fertig“ auf der Tastatur: nur abhaken, wenn in der Zeile etwas eingetippt wurde. In einer
      // unberührten Zeile schließt die Taste nur die Tastatur – Vorwerte übernimmt allein der Haken-Knopf.
      const typed = set && (String(set.weight ?? '').trim() !== '' || String(set.reps ?? '').trim() !== '');
      if (set && !set.completed && typed) toggleSet(el);
      else blurActive();
    };

    function toggleSet(el) {
      const { i, j, entry, set } = entryCtx(el);
      if (!entry || !set) return;
      const d = S.draft;
      const workSetsOf = (ent) => ent.sets.filter((s) => s.type !== 'warmup');
      const wasAllDone = workSetsOf(entry).length > 0 && workSetsOf(entry).every((s) => s.completed);

      if (!set.completed) {
        const res = completeSet(entry, j);
        if (!res.ok) {
          haptic('warn');
          const row = el.closest('.set');
          const field = row && row.querySelector(`[data-field="${res.missing}"]`);
          if (row) { row.classList.remove('is-shaking'); void row.offsetWidth; row.classList.add('is-shaking'); }
          if (field) field.focus();
          const what = res.missing === 'weight' ? 'Last' : 'Wiederholungszahl';
          toast(res.invalid
            ? `Die ${what} ist keine lesbare Zahl – bitte korrigieren.`
            : (res.missing === 'weight' ? 'Bitte zuerst die Last eintragen.' : 'Bitte zuerst die Wiederholungen eintragen.'), { type: 'warn' });
          return;
        }
        if (!d.editingSessionId && !d.timerStartedAt && !(d.timerElapsed > 0) && !isRestView(d)) {
          d.timerStartedAt = Date.now();
          syncTimerInterval();
        }
        haptic('tap');
      } else {
        uncompleteSet(set);
        reconcileTimerAfterUncheck(d);
      }
      blurActive();

      const nowAllDone = workSetsOf(entry).length > 0 && workSetsOf(entry).every((s) => s.completed);
      const advance = !wasAllDone && nowAllDone && !d.editingSessionId;
      if (advance) { entry.collapsed = true; haptic('success'); }

      touchDraft();
      Persist.draftNow();
      renderView('workout');

      if (advance) {
        const next = d.entries[i + 1];
        setTimeout(() => {
          const target = next ? document.getElementById(`entry-${next.entryId}`) : $('.workout-actions');
          if (target) target.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: next ? 'start' : 'center' });
        }, 160);
      }
    }
    Actions['set-toggle'] = toggleSet;

    Actions['set-partials'] = (el) => {
      const { j, entry, set } = entryCtx(el);
      if (!entry || !set) return;
      const ghost = ghostSet(entry, j);
      const ghostP = ghost ? (Number(ghost.partials) || 0) : 0;
      // Erster Tipp auf die graue Vorschau übernimmt genau den Vorwert, danach wird hochgezählt
      if (set.partials === null || set.partials === undefined) set.partials = ghostP > 0 ? clamp(ghostP, 0, 5) : 1;
      else set.partials = (Number(set.partials) + 1) % 6;
      haptic();
      touchDraft();
      renderView('workout');
    };

    Actions['set-menu'] = async (el) => {
      const { j, entry, set } = entryCtx(el);
      if (!entry || !set) return;
      const d = S.draft;
      const choice = await actionSheet({
        title: `Satz ${j + 1}`,
        subtitle: 'Satztyp',
        actions: [
          { value: 'type:normal', label: 'Arbeitssatz', icon: 'dumbbell', selected: set.type === 'normal', hint: 'Zählt für Volumen, Wochenziel und 1RM' },
          { value: 'type:warmup', label: 'Aufwärmsatz', icon: 'bolt', selected: set.type === 'warmup', hint: 'Wird protokolliert, zählt aber nicht mit' },
          { value: 'type:dropset', label: 'Dropsatz', icon: 'arrow-down', selected: set.type === 'dropset', hint: 'Mit zusätzlichen Drop-Stufen' },
          { separator: true },
          { value: 'copy', label: 'Nach unten kopieren', icon: 'copy', hint: j + 1 < entry.sets.length ? 'Werte in den nächsten Satz übernehmen' : 'Als neuen Satz anhängen' },
          { value: 'remove', label: 'Satz entfernen', icon: 'trash', danger: true }
        ]
      });
      if (!choice) return;
      if (choice.startsWith('type:')) {
        set.type = choice.slice(5);
        if (set.type === 'dropset' && (!set.drops || !set.drops.length)) set.drops = [{ weight: '', reps: '' }];
        touchDraft();
        renderView('workout');
      } else if (choice === 'copy') {
        copySetDown(entry, j);
      } else if (choice === 'remove') {
        const removed = entry.sets.splice(j, 1)[0];
        reconcileTimerAfterUncheck(d);
        touchDraft();
        renderView('workout');
        toast('Satz entfernt', {
          action: { label: 'Rückgängig', run: () => { entry.sets.splice(Math.min(j, entry.sets.length), 0, removed); touchDraftOf(d); renderView('workout'); } }
        });
      }
    };

    function copySetDown(entry, j) {
      const cur = entry.sets[j];
      const ghost = ghostSet(entry, j);
      // Ist im aktuellen Satz nichts getippt, wird der graue Vorwert kopiert
      const weight = cur.weight !== '' ? cur.weight : (ghost ? numToInput(ghost.weight) : '');
      const reps = cur.reps !== '' ? cur.reps : (ghost ? numToInput(ghost.reps) : '');
      const partials = cur.partials !== null && cur.partials !== undefined ? cur.partials : (ghost ? (Number(ghost.partials) || 0) : null);
      const drops = cur.type === 'dropset' ? clone(cur.drops || []) : [];
      if (j + 1 < entry.sets.length) {
        const next = entry.sets[j + 1];
        Object.assign(next, { weight, reps, type: cur.type || 'normal', partials, completed: false });
        if (cur.type === 'dropset') next.drops = drops;
        reconcileTimerAfterUncheck();
      } else {
        entry.sets.push({ sid: uid('s'), weight, reps, type: cur.type || 'normal', partials, drops, completed: false });
      }
      touchDraft();
      renderView('workout');
      toast('Satz nach unten kopiert', { type: 'success' });
    }

    Actions['add-set'] = (el) => {
      const { entry } = entryCtx(el);
      if (!entry) return;
      const last = lastPerformance(entry.exerciseId, entry.machineId, S.draft.date, S.draft.editingSessionId || null);
      const prevWork = last ? last.sets.filter((s) => s.type !== 'warmup') : [];
      const workCount = entry.sets.filter((s) => s.type !== 'warmup').length;
      const ghost = prevWork[workCount] || null;
      entry.sets.push(newDraftSet(ghost ? ghost.type : 'normal', ghost && ghost.type === 'dropset' ? (ghost.drops || []).length : 0));
      haptic();
      touchDraft();
      renderView('workout');
    };

    Actions['drop-add'] = (el) => {
      const { set } = entryCtx(el);
      if (!set) return;
      if (!Array.isArray(set.drops)) set.drops = [];
      set.drops.push({ weight: '', reps: '' });
      touchDraft();
      renderView('workout');
    };
    Actions['drop-remove'] = (el) => {
      const { set, k } = entryCtx(el);
      if (!set || !Array.isArray(set.drops)) return;
      set.drops.splice(k, 1);
      touchDraft();
      renderView('workout');
    };

    /* ---------- Einheit: hinzufügen, abschließen, zurücksetzen ---------------------- */
    Actions['add-exercise'] = async () => {
      const d = S.draft;
      const exId = await pickExercise({ title: 'Übung hinzufügen', allowCreate: true });
      if (!exId || !Idx.ex(exId) || S.draft !== d) return;
      const entry = newDraftEntry(exId, { targetSets: 2, date: d.date, excludeSessionId: d.editingSessionId || null });
      d.entries.push(entry);
      touchDraft();
      renderView('workout');
      requestAnimationFrame(() => {
        const card = document.getElementById(`entry-${entry.entryId}`);
        if (card) card.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
      });
    };

    /**
     * Abschließen. Neu: Sätze, die ausgefüllt, aber nicht abgehakt sind, werden
     * nicht mehr stillschweigend mitgespeichert – die App fragt nach.
     */
    /** Zu einer Zeile springen und das betroffene Feld markieren (z. B. unvollständige Zeile beim Abschließen). */
    function focusSetField({ i, j, missing }) {
      const d = S.draft;
      const entry = d && d.entries[i];
      if (!entry) return;
      if (entry.collapsed) { entry.collapsed = false; renderView('workout'); }
      setTimeout(() => {
        const row = document.querySelector(`#entry-${CSS.escape(entry.entryId)} [data-set="${j}"]`);
        if (!row) return;
        row.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });
        row.classList.remove('is-shaking'); void row.offsetWidth; row.classList.add('is-shaking');
        const field = row.querySelector(`[data-field="${missing}"]`);
        if (field) field.focus({ preventScroll: true });
      }, 120);
    }

    async function finishFlow({ silentScroll = false } = {}) {
      const d = S.draft;
      if (!d) return false;
      blurActive();
      const counts = draftSetCounts(d);
      // Zeilen mit Eingaben, die so nicht speicherbar sind: mit grauem Vorwert ergänzbar oder wirklich unvollständig
      const pending = pendingRows(d);
      const blockers = pending.filter((p) => p.kind === 'incomplete');
      const ghostable = pending.filter((p) => p.kind === 'ghostable');
      counts.filledUnchecked += ghostable.filter((p) => p.entry.sets[p.j].type !== 'warmup').length;
      const valid = counts.checked + counts.filledUnchecked;
      const hasAnySavable = (counts.anyValid || 0) + ghostable.length > 0;
      const split = splitById(d.splitId);
      const restDay = Boolean((split && split.isRest) || d.isRest);
      let mode = 'all';

      if (blockers.length) {
        const one = blockers.length === 1;
        const choice = await choiceDialog({
          title: `${plural(blockers.length, 'Zeile ist', 'Zeilen sind')} unvollständig`,
          iconName: 'alert',
          message: one
            ? 'In einer Zeile fehlt die Last oder die Wiederholungszahl – oder eine Zahl ist nicht lesbar. So kann sie nicht gespeichert werden.'
            : 'In diesen Zeilen fehlt die Last oder die Wiederholungszahl – oder eine Zahl ist nicht lesbar. So können sie nicht gespeichert werden.',
          options: [
            { value: 'back', label: 'Zurück und ergänzen', kind: 'primary' },
            { value: 'skip', label: one ? 'Ohne diese Zeile speichern' : 'Ohne diese Zeilen speichern', kind: 'soft' }
          ]
        });
        if (choice !== 'skip') {
          if (choice === 'back') focusSetField(blockers[0]);
          return false;
        }
      }

      if (d.date > todayIso()) {
        const ok = await confirmDialog({
          title: 'Datum liegt in der Zukunft',
          iconName: 'calendar',
          message: `Du trägst gerade für ${fmtDate(d.date, 'long')} ein. Trotzdem speichern?`,
          confirmLabel: 'Trotzdem speichern'
        });
        if (!ok) return false;
      }

      if (!hasAnySavable) {
        if (!restDay) {
          const ok = await confirmDialog({
            title: 'Tag ohne Sätze abhaken?',
            iconName: 'check-circle',
            message: `Es sind noch keine Sätze eingetragen. ${fmtDate(d.date, 'day')} wird dann ohne Training als erledigt markiert.`,
            confirmLabel: 'Trotzdem abhaken'
          });
          if (!ok) return false;
        }
      } else if (counts.filledUnchecked > 0) {
        const allLabel = valid === 1 ? 'Diesen Satz speichern' : `Alle ${valid} Sätze speichern`;
        const options = counts.checked > 0
          ? [
            { value: 'all', label: allLabel, kind: 'primary' },
            { value: 'checked', label: counts.checked === 1 ? 'Nur den abgehakten Satz speichern' : `Nur die ${counts.checked} abgehakten speichern`, kind: 'soft' },
            { value: 'cancel', label: 'Zurück zum Training', kind: 'ghost' }
          ]
          : [
            { value: 'all', label: allLabel, kind: 'primary' },
            { value: 'cancel', label: 'Zurück zum Training', kind: 'ghost' }
          ];
        const choice = await choiceDialog({
          title: counts.checked > 0 ? `${plural(counts.filledUnchecked, 'Satz ist', 'Sätze sind')} nicht abgehakt` : 'Kein Satz ist abgehakt',
          iconName: 'flag',
          message: counts.checked > 0
            ? (counts.filledUnchecked === 1
              ? 'Dieser Satz ist ausgefüllt, aber nicht als erledigt markiert. Soll er mitgespeichert werden?'
              : 'Diese Sätze sind ausgefüllt, aber nicht als erledigt markiert. Sollen sie mitgespeichert werden?')
            : (valid === 1
              ? 'Ein Satz ist ausgefüllt, aber nicht abgehakt. Trotzdem als erledigt speichern?'
              : `Es sind ${valid} Sätze ausgefüllt, aber keiner ist abgehakt. Wirklich alle als erledigt speichern?`),
          details: ghostable.length ? html`<p class="hint" style="margin:-8px 0 20px">Wo nur eine Angabe eingetragen ist, wird die andere mit dem grau angezeigten Vorwert ergänzt.</p>` : null,
          options
        });
        if (!choice || choice === 'cancel') return false;
        mode = choice;
      }
      // „Alle speichern“: fehlende Angabe wie beim Abhaken mit dem Vorwert ergänzen
      if (mode === 'all') for (const p of ghostable) completeSet(p.entry, p.j);

      const wasEdit = Boolean(d.editingSessionId);
      const rec = finishDraft(mode);
      if (!rec) return false;
      requestPersistence();
      haptic('success');
      renderView('workout');
      if (!silentScroll) window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      syncTimerInterval();
      if (rec.isRestDay) toast(`${fmtDate(rec.date, 'day')} abgehakt`, { type: 'success' });
      else {
        const sum = sessionSummary(rec);
        const warmupCount = rec.entries.reduce((n, e) => n + e.sets.filter((s) => s.type === 'warmup' && Number(s.reps) > 0).length, 0);
        const setLabel = sum.sets > 0
          ? plural(sum.sets, 'Arbeitssatz', 'Arbeitssätze')
          : (warmupCount > 0 ? plural(warmupCount, 'Aufwärmsatz', 'Aufwärmsätze') : 'ohne Werte abgehakt');
        const durInfo = rec.duration > 0 ? ` · Trainingszeit: ${fmtDurationText(rec.duration)}` : '';
        toast(`${wasEdit ? 'Änderungen gespeichert' : 'Training abgeschlossen'} · ${setLabel}${durInfo}`, { type: 'success', duration: 7500 });
      }
      return true;
    }
    Actions['finish'] = () => finishFlow();

    Actions['discard-edits'] = () => {
      const d = S.draft;
      const sess = d && d.editingSessionId ? S.sessions.find((s) => s.id === d.editingSessionId) : null;
      if (!sess) return;
      S.draft = draftFromSession(sess);
      Persist.draftNow();
      renderView('workout');
      toast('Änderungen verworfen');
    };

    Actions['reset-draft'] = async () => {
      const d = S.draft;
      if (!d || d.editingSessionId) return;
      const ok = await confirmDialog({
        title: 'Eingaben zurücksetzen?',
        iconName: 'undo',
        danger: true,
        message: `Alle Eingaben für ${fmtDate(d.date, 'day')} werden verworfen und der Tag wird neu aus dem Plan aufgebaut.`,
        confirmLabel: 'Zurücksetzen'
      });
      if (!ok) return;
      delete S.drafts[draftKey(d.date, d.splitId)];
      S.draft = buildDraftForSplit(d.splitId, d.date);
      Persist.draftNow();
      renderView('workout');
      toast('Eingaben zurückgesetzt');
    };

    function deleteSessionWithUndo(sessionId, after = null) {
      const sess = removeSession(sessionId);
      if (!sess) return;
      if (S.draft && S.draft.editingSessionId === sessionId) { openDay(sess.date); Persist.draftNow(); }
      renderView();
      if (after) after();
      toast(sess.isRestDay ? 'Haken entfernt' : 'Einheit gelöscht', {
        action: {
          label: 'Rückgängig',
          run: () => {
            upsertSession(sess);
            if (S.draft && !S.draft.touched && !S.draft.editingSessionId && S.draft.date === sess.date) { openDay(sess.date); Persist.draftNow(); }
            renderView();
          }
        }
      });
    }

    Actions['rest-unlog'] = () => {
      const d = S.draft;
      if (d && d.editingSessionId) deleteSessionWithUndo(d.editingSessionId);
    };

    Actions['saved-menu'] = async () => {
      const d = S.draft;
      if (!d || !d.editingSessionId) return;
      const choice = await actionSheet({
        title: fmtDate(d.date, 'full'),
        subtitle: shortSplitName(d.splitName),
        actions: [
          { value: 'duration', label: d.duration > 0 ? `Trainingszeit ändern (${fmtDurationShort(d.duration)})` : 'Trainingszeit nachtragen', icon: 'history' },
          { value: 'another', label: 'Weitere Einheit an diesem Tag', icon: 'plus',
            hint: startedDraftFor(d.date, d.splitId) ? 'Öffnet den bereits angefangenen Entwurf für diesen Tag' : 'Legt einen zweiten, leeren Entwurf für denselben Tag an' },
          { value: 'delete', label: 'Diese Einheit löschen', icon: 'trash', danger: true }
        ]
      });
      if (choice === 'duration') {
        await editSavedDuration(d);
      } else if (choice === 'another') {
        if (!(await guardUnsaved())) return;
        const split = splitById(d.splitId) || splitForDate(d.date);
        const splitId = split ? split.id : '';
        const started = startedDraftFor(d.date, splitId);   // schon angefangen? Dann dort weitermachen statt überschreiben
        S.draft = started || buildDraftForSplit(splitId, d.date);
        Persist.draftNow();
        renderView('workout');
        window.scrollTo({ top: 0 });
        toast(started ? 'Angefangener Entwurf für diesen Tag geöffnet' : 'Neuer Entwurf für diesen Tag');
      } else if (choice === 'delete') {
        deleteSessionWithUndo(d.editingSessionId);
      }
    };

    /* ==========================================================================
       08 · STATISTIK
       Übersicht  = laufende Woche (Arbeitssätze je Muskelgruppe) + Monatskalender
       Fortschritt = Verlauf einer Übung je Gerät (vorher zwei sich überlappende
                     Ansichten „Zeitachse“ und „Maschinen“)
       ========================================================================== */

    Views.stats = {
      header() {
        return {
          title: 'Statistik',
          extra: segmented({
            act: 'stats-tab', value: S.ui.statsTab, label: 'Bereich der Statistik',
            options: [{ value: 'overview', label: 'Übersicht' }, { value: 'progress', label: 'Fortschritt' }]
          })
        };
      },
      render() {
        const host = $('#view-stats');
        if (S.ui.statsTab === 'progress') {
          const st = progressState();
          patch(host, progressMarkup(st));
          drawProgressChart(st);
        } else {
          patch(host, overviewMarkup());
        }
      }
    };

    Actions['stats-tab'] = (el) => {
      if (S.ui.statsTab === el.dataset.v) return;
      S.ui.statsTab = el.dataset.v;
      haptic();
      renderView('stats');
      window.scrollTo(0, 0);
    };

    /* ---------- Übersicht ---------------------------------------------------------- */
    function overviewMarkup() {
      const vol = weeklyVolume();
      const { calYear: year, calMonth: month } = S.ui;
      const cal = calendarMonth(year, month);
      const now = new Date();
      const isCurrentMonth = year === now.getFullYear() && month === now.getMonth();

      const meters = vol.rows.map((r) => {
        const pct = r.target > 0 ? clamp(r.count / r.target, 0, 1) : (r.count > 0 ? 1 : 0);
        const reached = r.target > 0 && r.count >= r.target;
        return html`
          <button type="button" class="${cls('meter', r.count === 0 && 'is-empty')}" data-act="volume-targets" data-cat="${r.id}"
                  aria-label="${r.name}: ${r.count} von ${r.target} Arbeitssätzen${reached ? ', Wochenziel erreicht' : ''}. Tippen, um das Ziel zu ändern">
            <span class="meter-top">
              <span class="meter-name">${r.name}</span>
              <span class="meter-val num">${reached ? icon('check') : ''}${r.count}<i>/${r.target}</i></span>
            </span>
            <span class="meter-track"><i style="transform:scaleX(${pct.toFixed(3)})"></i></span>
          </button>`;
      });

      const pads = Array.from({ length: cal.offset }, () => html`<span class="cal-pad" aria-hidden="true"></span>`);
      const cells = cal.cells.map((c) => {
        const stateText = { workout: `Training gespeichert${c.label ? `: ${c.label}` : ''}`, rest: 'Pausentag abgehakt', missed: 'offen', future: '', none: '' }[c.kind];
        // Trainingstage zeigen wie bisher, WAS trainiert wurde – als Kürzel unter der Zahl (voller Name im Tages-Blatt)
        const short = c.kind === 'workout' && c.label ? [...c.label].slice(0, 6).join('').trim() : '';
        return html`
          <button type="button" class="${cls('cal-day', `is-${c.kind}`, c.isToday && 'is-today')}" data-act="cal-day" data-date="${c.date}"
                  aria-label="${fmtDate(c.date, 'full')}${c.isToday ? ', heute' : ''}${stateText ? ', ' + stateText : ''}">
            <span class="num">${c.day}</span>
            ${short
              ? html`<span class="cal-mark cal-label" aria-hidden="true">${short}</span>`
              : html`<span class="cal-mark">${c.kind === 'rest' ? icon('moon') : c.kind === 'missed' ? html`<i></i>` : ''}</span>`}
          </button>`;
      });

      return html`
        <section class="card" aria-labelledby="week-title">
          <div class="card-head">
            <div>
              <h2 class="card-title" id="week-title">Diese Woche</h2>
              <p class="card-sub num">KW ${vol.week} · ${fmtWeekRange(vol.monday)}</p>
            </div>
            <button type="button" class="pill-btn" data-act="volume-targets">${icon('target')}Ziele</button>
          </div>
          <div class="card-body">
            <p class="week-total"><b class="num">${vol.total}</b><span>von ${vol.totalTarget} Arbeitssätzen</span></p>
            <div class="meters">${meters}</div>
            ${vol.other > 0 ? html`<p class="hint" style="margin-top:12px">Dazu ${plural(vol.other, 'Satz', 'Sätze')} in „Sonstiges“ (ohne Wochenziel).</p>` : ''}
          </div>
        </section>

        <section class="card" aria-labelledby="cal-title">
          <div class="card-head cal-head">
            <button type="button" class="icon-btn" data-act="cal-shift" data-dir="-1" aria-label="Vorheriger Monat">${icon('chevron-left')}</button>
            <h2 class="card-title cal-title" id="cal-title">${MONTHS[month]} ${year}</h2>
            <button type="button" class="icon-btn" data-act="cal-shift" data-dir="1" aria-label="Nächster Monat">${icon('chevron-right')}</button>
          </div>
          <div class="card-body">
            <div class="tiles">
              <div class="tile"><p class="tile-label">Erledigt</p><p class="tile-value">${cal.done}<small>${cal.done === 1 ? 'Tag' : 'Tage'}</small></p></div>
              <div class="tile"><p class="tile-label">Offen</p><p class="tile-value">${cal.missed}<small>${cal.missed === 1 ? 'Tag' : 'Tage'}</small></p></div>
              <div class="tile"><p class="tile-label">Quote</p><p class="tile-value">${cal.rate === null ? '–' : html`${cal.rate}<small>%</small>`}</p></div>
            </div>
            <div class="cal-wd" aria-hidden="true">${WEEKDAYS_SHORT.map((w) => html`<span>${w}</span>`)}</div>
            <div class="cal-grid">${pads}${cells}</div>
            <div class="cal-legend" aria-hidden="true">
              <span><i class="lg lg--workout"></i>Training</span>
              <span><i class="lg lg--rest">${icon('moon')}</i>Pausentag</span>
              <span><i class="lg lg--missed"></i>Offen</span>
            </div>
            <p class="hint" style="margin-top:12px">Tippe auf einen Tag, um ihn zu öffnen oder nachzutragen.</p>
            ${isCurrentMonth ? '' : html`<button type="button" class="text-btn" data-act="cal-today">${icon('undo')}Zum aktuellen Monat</button>`}
          </div>
        </section>`;
    }

    Actions['cal-shift'] = (el) => {
      let m = S.ui.calMonth + Number(el.dataset.dir);
      let y = S.ui.calYear;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      S.ui.calMonth = m;
      S.ui.calYear = y;
      renderView('stats');
    };
    Actions['cal-today'] = () => {
      const now = new Date();
      S.ui.calYear = now.getFullYear();
      S.ui.calMonth = now.getMonth();
      renderView('stats');
    };

    /* ---- Wochenziele ---- */
    Actions['volume-targets'] = (el) => {
      const focusCat = el.dataset.cat || null;
      Sheets.open({
        title: 'Wochenziele',
        subtitle: 'Arbeitssätze pro Woche und Muskelgruppe',
        body: html`
          <div class="target-list">
            ${TARGET_CATEGORIES.map((c) => html`
              <div class="${cls('target-row', focusCat === c.id && 'is-focus')}">
                <span class="target-name">${c.name}</span>
                <div class="stepper stepper--compact" data-stepper data-min="0" data-max="60">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="${c.name}: ein Satz weniger">${icon('minus')}</button>
                  <input class="stepper-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-select-on-focus
                         data-cat="${c.id}" value="${getCategoryTarget(c.id)}" aria-label="${c.name}: Arbeitssätze pro Woche">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="${c.name}: ein Satz mehr">${icon('plus')}</button>
                </div>
              </div>`)}
          </div>`,
        footer: html`<button type="button" class="btn btn--primary btn--lg btn--block" data-save-targets>Ziele speichern</button>`,
        onMount(el2, handle) {
          const focusRow = el2.querySelector('.target-row.is-focus');
          if (focusRow) requestAnimationFrame(() => focusRow.scrollIntoView({ block: 'center' }));
          el2.addEventListener('click', (e) => {
            const step = e.target.closest('[data-step]');
            if (step) {
              const box = step.closest('[data-stepper]');
              const input = box.querySelector('input');
              input.value = String(clamp((parseInt(input.value, 10) || 0) + Number(step.dataset.step), 0, 60));
              haptic();
              return;
            }
            if (e.target.closest('[data-save-targets]')) {
              const next = { ...S.volumeTargets };
              el2.querySelectorAll('input[data-cat]').forEach((inp) => {
                const v = parseInt(inp.value, 10);
                next[inp.dataset.cat] = Number.isFinite(v) && v >= 0 ? clamp(v, 0, 60) : DEFAULT_VOLUME_TARGETS[inp.dataset.cat];
              });
              S.volumeTargets = next;
              Storage.bg(Storage.setMeta('volumeTargets', next));
              handle.close();
              renderView('stats');
              toast('Wochenziele gespeichert', { type: 'success' });
            }
          });
        }
      });
    };

    /* ---- Tages-Sheet aus dem Kalender ---- */
    Actions['cal-day'] = (el) => openDaySheet(el.dataset.date);

    function openDaySheet(date) {
      const logs = Idx.sessionsOn(date);
      const future = date > todayIso();
      const trainSplits = S.splits.filter((sp) => !sp.isRest && sp.items.length > 0);
      const rel = relativeDay(date);

      const handle = Sheets.open({
        title: fmtDate(date, 'full'),
        subtitle: [rel, String(parseIso(date).getFullYear())].filter(Boolean).join(' · '),
        body: html`
          ${logs.length ? html`
            <div class="sheet-section">
              <p class="overline">Eingetragen</p>
              <div class="day-sheet-logs">
                ${logs.map((l) => {
                  const sum = sessionSummary(l);
                  const workout = isWorkoutSession(l);
                  return html`
                    <div class="day-log">
                      <span class="${cls('row-icon', workout && 'row-icon--accent')}">${icon(workout ? 'dumbbell' : 'moon')}</span>
                      <span class="day-log-main">
                        <b>${workout ? shortSplitName(l.splitName) : (/(abgehakt)/i.test(l.splitName) ? shortSplitName(l.splitName) + ' · ohne Sätze' : 'Pausentag')}</b>
                        <span class="num">${workout ? [plural(sum.exercises, 'Übung', 'Übungen'), sum.sets ? plural(sum.sets, 'Arbeitssatz', 'Arbeitssätze') : 'ohne Werte abgehakt', l.duration ? fmtDurationShort(l.duration) : ''].filter(Boolean).join(' · ') : 'Als erledigt abgehakt'}</span>
                      </span>
                      <button type="button" class="btn btn--sm btn--tonal" data-day-open="${l.id}">Öffnen</button>
                      <button type="button" class="icon-btn" data-day-delete="${l.id}" aria-label="Eintrag löschen">${icon('trash')}</button>
                    </div>`;
                })}
              </div>
            </div>` : ''}

          ${!logs.length && !future ? html`
            <div class="sheet-section">
              <p class="overline">Nachtragen</p>
              <div class="pick-list">
                <button type="button" class="pick-item" data-day-rest>
                  <span class="row-icon">${icon('moon')}</span>
                  <span class="pick-main">Als Pausentag abhaken</span>
                </button>
                ${trainSplits.map((sp) => html`
                  <button type="button" class="pick-item" data-day-quick="${sp.id}">
                    <span class="row-icon row-icon--accent">${icon('bolt')}</span>
                    <span class="pick-main">${sp.name}<small>Mit den letzten Werten abhaken</small></span>
                  </button>`)}
              </div>
            </div>` : ''}

          ${!logs.length && future ? html`<p class="form-intro" style="margin-bottom:16px">Dieser Tag liegt in der Zukunft. Du kannst dir den geplanten Trainingstag ansehen.</p>` : ''}

          <div class="sheet-section">
            <button type="button" class="btn ${logs.length ? 'btn--soft' : 'btn--primary'} btn--lg btn--block" data-day-train>
              ${icon('dumbbell')}${future ? 'Geplanten Tag ansehen' : (logs.length ? 'Weitere Einheit eintragen' : 'Im Training eintragen')}
            </button>
          </div>`,
        onMount(el, h) {
          el.addEventListener('click', async (e) => {
            const open = e.target.closest('[data-day-open]');
            const del = e.target.closest('[data-day-delete]');
            const quick = e.target.closest('[data-day-quick]');
            if (open) {
              if (!(await guardUnsaved())) return;
              const sess = S.sessions.find((s) => s.id === open.dataset.dayOpen);
              h.close();
              if (sess) openSessionInWorkout(sess);
            } else if (del) {
              h.close();
              deleteSessionWithUndo(del.dataset.dayDelete);
            } else if (e.target.closest('[data-day-rest]')) {
              h.close();
              const { record } = logRestDay(date);
              afterCalendarLog(record, `${fmtDate(date, 'day')} als Pausentag abgehakt`);
            } else if (quick) {
              const { record, skipped, withoutValues } = quickLogSplit(date, quick.dataset.dayQuick);
              if (!record) {
                toast('Dieser Trainingstag enthält keine Übungen. Trage ihn im Training ein.', { type: 'warn' });
                return;
              }
              h.close();
              afterCalendarLog(record, withoutValues
                ? `${shortSplitName(record.splitName)} ohne Werte abgehakt – es gibt noch keine Vorwerte`
                : `${shortSplitName(record.splitName)} eingetragen${skipped ? ` · ${plural(skipped, 'Übung', 'Übungen')} ohne Vorwerte ausgelassen` : ''}`);
            } else if (e.target.closest('[data-day-train]')) {
              if (!(await guardUnsaved())) return;
              h.close();
              const hasLogs = Idx.sessionsOn(date).length > 0;
              if (hasLogs) {
                const split = splitForDate(date);
                const splitId = split ? split.id : '';
                S.draft = startedDraftFor(date, splitId) || buildDraftForSplit(splitId, date);   // angefangenen Entwurf nicht überschreiben
              } else {
                openDay(date);
              }
              Persist.draftNow();
              switchTab('workout');
            }
          });
        }
      });
      return handle;
    }

    /** Nach „Abhaken“ im Kalender: Ansicht auffrischen + Rückgängig anbieten. */
    function afterCalendarLog(record, message) {
      if (S.draft && !S.draft.editingSessionId && !S.draft.touched && S.draft.date === record.date) { openDay(record.date); Persist.draftNow(); }
      haptic('success');
      renderView();
      toast(message, {
        type: 'success',
        action: {
          label: 'Rückgängig',
          run: () => {
            removeSession(record.id);
            if (S.draft && S.draft.editingSessionId === record.id) { openDay(record.date); Persist.draftNow(); }
            renderView();
          }
        }
      });
    }

    function openSessionInWorkout(sess) {
      S.draft = draftFromSession(sess);
      Persist.draftNow();
      switchTab('workout');
    }

    /* ---------- Fortschritt ---------------------------------------------------------- */
    const PROGRESS_PAGE = 40;   // Einheiten je Seite in der Liste unter dem Diagramm
    const METRICS = {
      e1rm: { label: 'Geschätztes 1RM', short: '1RM', digits: 1 },
      maxWeight: { label: 'Maximale Last', short: 'Max. Last', digits: 2 },
      volume: { label: 'Volumen', short: 'Volumen', digits: 0 }
    };

    function fmtMetric(metric, value, unit) {
      if (!Number.isFinite(value)) return '–';
      if (metric === 'volume') return unit === 'pin' ? fmtNum(value, 0) : `${fmtNum(value, 0)} kg`;
      const v = fmtNum(value, METRICS[metric].digits);
      return unit === 'pin' ? `Pin ${v}` : `${v} kg`;
    }

    function progressState() {
      const tracked = trackedExercises();
      const ui = S.ui.prog;
      if (!tracked.length) return { tracked };
      if (!ui.exerciseId || !tracked.some((e) => e.id === ui.exerciseId)) { ui.exerciseId = tracked[0].id; ui.filter = 'AUTO'; }
      if (!METRICS[ui.metric]) ui.metric = 'e1rm';

      const groups = progressionGroups(ui.exerciseId);
      const kg = groups.filter((g) => g.unit === 'kg');
      const pin = groups.filter((g) => g.unit === 'pin');

      // kg und Pin werden nie in einem Diagramm gemischt
      let filter = ui.filter;
      const valid = filter === 'ALL_KG' ? kg.length > 1 : filter === 'ALL_PIN' ? pin.length > 1 : groups.some((g) => g.machineId === filter);
      if (!valid) {
        const lastT = (list) => Math.max(0, ...list.flatMap((g) => g.points.map((p) => p.t)));
        const usePin = pin.length > 0 && (kg.length === 0 || lastT(pin) >= lastT(kg));
        const list = usePin ? pin : kg;
        filter = list.length > 1 ? (usePin ? 'ALL_PIN' : 'ALL_KG') : list[0].machineId;
        ui.filter = filter;
      }
      const shown = (filter === 'ALL_KG' ? kg : filter === 'ALL_PIN' ? pin : groups.filter((g) => g.machineId === filter)).slice(0, VIZ_COLORS.length);
      const unit = shown[0].unit;
      const metric = ui.metric;

      const todayT = isoTs(todayIso());
      const allPoints = shown.flatMap((g) => g.points);
      const earliest = Math.min(...allPoints.map((p) => p.t));
      const latest = Math.max(...allPoints.map((p) => p.t));
      const xMax = Math.max(todayT, latest);
      const xMin = ui.range === '1M' ? xMax - 30 * DAY_MS : ui.range === '1Y' ? xMax - 365 * DAY_MS : Math.min(earliest, xMax - 7 * DAY_MS);

      const series = shown.map((g) => {
        const inWindow = g.points.filter((p) => p.t >= xMin && p.t <= xMax);
        return {
          id: g.machineId, name: g.name, unit: g.unit, color: vizColor(g.slot), all: g.points, inWindow,
          points: inWindow.map((p) => ({ t: p.t, y: p[metric], date: p.date, tip: `Top-Satz ${fmtSetShort(p.topSet)}` }))
        };
      });
      return { tracked, groups, kg, pin, filter, shown, unit, metric, xMin, xMax, series, single: shown.length === 1 };
    }

    function deltaParts(first, last, metric) {
      const diff = last - first;
      if (!Number.isFinite(diff)) return null;
      const pct = first > 0 ? (diff / first) * 100 : null;
      const sign = diff > 0 ? '+' : diff < 0 ? '−' : '±';
      return {
        klass: diff > 0 ? 'is-up' : diff < 0 ? 'is-down' : '',
        abs: `${sign}${fmtNum(Math.abs(diff), METRICS[metric].digits)}`,
        pct: pct !== null ? `${sign}${fmtNum(Math.abs(pct), 1)} %` : ''
      };
    }

    function deltaMarkup(first, last, metric) {
      const d = deltaParts(first, last, metric);
      if (!d) return '';
      return html`<span class="${d.klass === 'is-up' ? 'delta-up' : d.klass === 'is-down' ? 'delta-down' : ''}">${d.abs}${d.pct ? ` (${d.pct})` : ''}</span>`;
    }

    function progressMarkup(st) {
      if (!st.tracked.length) {
        return html`<div class="card">${emptyState({
          iconName: 'chart',
          title: 'Noch kein Fortschritt zu sehen',
          text: 'Sobald du Einheiten mit Arbeitssätzen gespeichert hast, erscheint hier der Verlauf jeder Übung.'
        })}</div>`;
      }
      const ui = S.ui.prog;
      const { groups, kg, pin, filter, unit, metric, series, single } = st;
      const m = METRICS[metric];
      const unitText = metric === 'volume'
        ? (unit === 'pin' ? 'Pin-Stufe × Wdh.' : 'kg × Wdh.')
        : (unit === 'pin' ? 'in Pin-Stufen' : 'in kg');

      const chips = [
