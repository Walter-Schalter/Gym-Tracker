       00 · HILFSFUNKTIONEN
       DOM-Helfer, sicheres HTML-Templating, Datum/Zahl-Formatierung, DOM-Morphing
       ========================================================================== */

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    /* ---------- HTML-Templating mit automatischem Escaping ----------------------
       html`<b>${userText}</b>` escaped jeden eingesetzten Wert. Nur Ergebnisse von
       html`` / raw() / icon() werden unverändert übernommen. Damit kann kein
       Übungs- oder Gerätename (auch nicht aus einem importierten Backup) Markup
       oder Skript in die Seite schleusen. */
    const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ESC_MAP[c]);

    class SafeHtml {
      constructor(s) { this.s = s; }
      toString() { return this.s; }
    }
    const raw = (s) => new SafeHtml(String(s ?? ''));

    function htmlValue(v) {
      if (v === null || v === undefined || v === false || v === true) return '';
      if (v instanceof SafeHtml) return v.s;
      if (Array.isArray(v)) return v.map(htmlValue).join('');
      return esc(v);
    }

    function html(strings, ...values) {
      let out = strings[0];
      for (let i = 0; i < values.length; i++) out += htmlValue(values[i]) + strings[i + 1];
      return new SafeHtml(out);
    }

    /** Klassenliste aus Wahrheitswerten: cls('a', cond && 'b') → "a b" */
    const cls = (...parts) => parts.filter(Boolean).join(' ');

    /** Inline-Icon aus dem SVG-Sprite (siehe <svg id="icon-sprite">). */
    const icon = (name, extra = '') =>
      raw(`<svg class="icon${extra ? ' ' + esc(extra) : ''}" aria-hidden="true" focusable="false"><use href="#i-${esc(name)}"/></svg>`);

    /* ---------- Datum ---------------------------------------------------------- */
    const pad2 = (n) => String(n).padStart(2, '0');
    const toIso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const todayIso = () => toIso(new Date());
    const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;

    /** ISO-Datum → Date um 12:00 Ortszeit (robust gegen Sommerzeit-Sprünge). */
    function parseIso(iso) {
      const [y, m, d] = String(iso).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0, 0);
    }
    function isValidIso(s) {
      if (typeof s !== 'string' || !ISO_RE.test(s)) return false;
      const d = parseIso(s);
      return !Number.isNaN(d.getTime()) && toIso(d) === s;
    }
    function addDays(iso, n) {
      const d = parseIso(iso);
      d.setDate(d.getDate() + n);
      return toIso(d);
    }
    /** 1 = Montag … 7 = Sonntag */
    function weekdayOf(iso) {
      const g = parseIso(iso).getDay();
      return g === 0 ? 7 : g;
    }
    const mondayOf = (iso) => addDays(iso, 1 - weekdayOf(iso));
    const isoTs = (iso) => parseIso(iso).getTime();

    /** ISO-8601-Kalenderwoche */
    function isoWeek(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const date = new Date(Date.UTC(y, m - 1, d));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
    }

    const DTF = {};
    function dtf(key, opts) {
      if (!DTF[key]) DTF[key] = new Intl.DateTimeFormat('de-DE', opts);
      return DTF[key];
    }
    /**
     * Datumsformate (einheitlich in der ganzen App):
     *  long    → Mittwoch, 11. November 2026
     *  full    → Mittwoch, 11. November
     *  medium  → Mi., 11. Nov. 2026
     *  day     → Mi., 11. Nov.
     *  short   → 11.11.
     *  shortY  → 11.11.26
     *  numeric → 11.11.2026
     *  month   → November 2026
     */
    function fmtDate(iso, style = 'day') {
      if (!isValidIso(iso)) return String(iso ?? '');
      const d = parseIso(iso);
      switch (style) {
        case 'long': return dtf('long', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d);
        case 'full': return dtf('full', { weekday: 'long', day: 'numeric', month: 'long' }).format(d);
        case 'medium': return dtf('medium', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).format(d);
        case 'short': return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.`;
        case 'shortY': return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${String(d.getFullYear()).slice(-2)}`;
        case 'numeric': return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
        case 'month': return dtf('month', { month: 'long', year: 'numeric' }).format(d);
        case 'day':
        default: return dtf('day', { weekday: 'short', day: 'numeric', month: 'short' }).format(d);
      }
    }
    /** „Heute“, „Gestern“, „Morgen“ – sonst null */
    function relativeDay(iso) {
      const t = todayIso();
      if (iso === t) return 'Heute';
      if (iso === addDays(t, -1)) return 'Gestern';
      if (iso === addDays(t, 1)) return 'Morgen';
      return null;
    }
    const WEEKDAYS_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const MONTHS_SHORT = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sep.', 'Okt.', 'Nov.', 'Dez.'];

    /** „vor 3 Tagen“, „heute“ … für Zeitstempel (ms) */
    function fmtAgo(ts) {
      if (!ts) return '';
      const days = Math.round((isoTs(todayIso()) - isoTs(toIso(new Date(ts)))) / 86400000);
      if (days <= 0) return 'heute';
      if (days === 1) return 'gestern';
      if (days < 14) return `vor ${days} Tagen`;
      if (days < 60) return `vor ${Math.round(days / 7)} Wochen`;
      return `vor ${Math.round(days / 30)} Monaten`;
    }

    /* ---------- Zahlen --------------------------------------------------------- */
    const NF = {};
    function nf(digits) {
      if (!NF[digits]) NF[digits] = new Intl.NumberFormat('de-DE', { maximumFractionDigits: digits });
      return NF[digits];
    }
    /** Zahl in deutscher Schreibweise (Komma, Tausenderpunkt), überflüssige Nullen entfallen. */
    function fmtNum(n, digits = 2) {
      const v = Number(n);
      if (!Number.isFinite(v)) return '–';
      return nf(digits).format(v);
    }
    /** Zahl für ein Eingabefeld: 82.5 → "82,5" (ohne Tausenderpunkt) */
    function numToInput(n) {
      if (n === null || n === undefined || n === '') return '';
      const v = Number(n);
      if (!Number.isFinite(v)) return String(n);
      return String(v).replace('.', ',');
    }
    /** Tolerantes Parsen von Nutzereingaben: "82,5" · "82.5" · " 82 " → Zahl, sonst null */
    function parseNum(val) {
      if (val === '' || val === null || val === undefined) return null;
      if (typeof val === 'number') return Number.isFinite(val) ? val : null;
      let s = String(val).trim().replace(/\s+/g, '');
      if (!s) return null;
      // "1.234,5" → 1234.5 ; "82,5" → 82.5 ; "82.5" bleibt
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      if (!/^-?\d*\.?\d+$/.test(s) && !/^-?\d+\.?$/.test(s)) return null;
      const num = Number.parseFloat(s);
      return Number.isFinite(num) ? num : null;
    }
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const plural = (n, one, many) => `${fmtNum(n, 0)} ${n === 1 ? one : many}`;

    /* ---------- Sonstiges ------------------------------------------------------ */
    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }
    const clone = (obj) => (typeof structuredClone === 'function' ? structuredClone(obj) : JSON.parse(JSON.stringify(obj)));

    function debounce(fn, ms) {
      let t = null;
      const wrapped = (...args) => {
        clearTimeout(t);
        t = setTimeout(() => { t = null; fn(...args); }, ms);
      };
      wrapped.cancel = () => { clearTimeout(t); t = null; };
      wrapped.flush = (...args) => { if (t) { clearTimeout(t); t = null; fn(...args); } };
      return wrapped;
    }

    const prefersReducedMotion = () =>
      window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /** Kurzes haptisches Feedback (wo das Gerät es anbietet – sonst still). */
    function haptic(kind = 'tap') {
      try {
        if (!navigator.vibrate) return;
        const pattern = kind === 'success' ? [12, 40, 18] : kind === 'warn' ? [24, 50, 24] : 8;
        navigator.vibrate(pattern);

    /* ---------- DOM-Morphing ---------------------------------------------------
       Gleicht ein bestehendes DOM an neu erzeugtes Markup an, statt es zu ersetzen.
       Vorteile gegenüber innerHTML: Fokus, Tastatur und Cursor bleiben erhalten,
       Scroll-Positionen bleiben stehen und CSS-Übergänge können laufen, weil die
       Elemente bestehen bleiben. Elemente mit data-key werden über ihren Schlüssel
       wiedererkannt (auch nach Umsortieren). */
    const keyOf = (node) => (node.nodeType === 1 ? node.getAttribute('data-key') : null);

    function syncAttributes(from, to) {
      const keep = from.getAttribute('data-keep');
      const keepSet = keep ? new Set(keep.split(/\s+/)) : null;
      for (const { name } of Array.from(from.attributes)) {
        if (keepSet && keepSet.has(name)) continue;
        if (!to.hasAttribute(name)) from.removeAttribute(name);
      }
      for (const { name, value } of Array.from(to.attributes)) {
        if (keepSet && keepSet.has(name)) continue;
        if (from.getAttribute(name) !== value) from.setAttribute(name, value);
      }
    }

    function morphNode(from, to) {
      if (from.hasAttribute('data-morph-skip') && to.hasAttribute('data-morph-skip')) return;
      syncAttributes(from, to);
      const tag = from.nodeName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        // Das fokussierte Feld gehört dem Nutzer – sein Inhalt wird nicht überschrieben.
        if (from !== document.activeElement) {
          const next = tag === 'TEXTAREA' ? to.textContent : (to.getAttribute('value') ?? '');
          if (from.value !== next) from.value = next;
        }
        if (from.type === 'checkbox' || from.type === 'radio') from.checked = to.hasAttribute('checked');
        return;
      }
      morphChildren(from, to);
      if (tag === 'SELECT') {
        const sel = Array.from(to.options).find((o) => o.hasAttribute('selected'));
        const next = sel ? sel.value : (to.options[0] ? to.options[0].value : '');
        if (from.value !== next) from.value = next;
      }
    }

    function morphChildren(from, to, animateNew = true) {
      const keyed = new Map();
      for (let c = from.firstChild; c; c = c.nextSibling) {
        const k = keyOf(c);
        if (k !== null) keyed.set(k, c);
      }
      let cur = from.firstChild;
      for (const node of Array.from(to.childNodes)) {
        const k = keyOf(node);
        let match = null;
        if (k !== null) {
          const cand = keyed.get(k);
          if (cand && cand.nodeName === node.nodeName) { match = cand; keyed.delete(k); }
        } else {
          let p = cur;
          while (p && keyOf(p) !== null) p = p.nextSibling;
          if (p && p.nodeType === node.nodeType && p.nodeName === node.nodeName) match = p;
        }
        if (match) {
          if (match === cur) cur = cur.nextSibling;
          else from.insertBefore(match, cur);
          if (node.nodeType === 1) morphNode(match, node);
          else if (match.nodeValue !== node.nodeValue) match.nodeValue = node.nodeValue;
        } else {
          if (animateNew && node.nodeType === 1 && from.hasAttribute('data-animate-children')) node.setAttribute('data-enter', '');
          from.insertBefore(node, cur);
        }
      }
      while (cur) {
        const next = cur.nextSibling;
        from.removeChild(cur);
        cur = next;
      }
    }

    function patch(container, markup) {
      if (!container) return;
      const tpl = document.createElement('template');
      tpl.innerHTML = markup instanceof SafeHtml ? markup.s : String(markup ?? '');
      const first = !container.hasChildNodes();
      morphChildren(container, tpl.content, !first);

    /* ==========================================================================
       02 · SPEICHER
       IndexedDB mit denselben Namen, Stores und Schlüsseln wie die bisherige
       Version (Datenbank „GymProgressDB“, Version 1). Vorhandene Daten werden
       also 1:1 weiterverwendet – es gibt keine Migration, die etwas umschreibt.

       Gegenüber vorher neu:
       · Jeder Schreibvorgang meldet Fehler (auch Abbrüche wie „Speicher voll“).
       · Geht die DB-Verbindung verloren (iOS nach langem Hintergrund), wird sie
         einmal automatisch neu geöffnet.
       · Der localStorage-Ersatz wird nur genutzt, wenn IndexedDB auf dem Gerät
         noch nie funktioniert hat – so kann ein kurzzeitiger DB-Fehler nie dazu
         führen, dass die App scheinbar „leer“ startet und Daten überschreibt.
       ========================================================================== */

    const Storage = {
      DB_NAME: 'GymProgressDB',
      DB_VERSION: 1,
      STORES: ['exercises', 'machines', 'splits', 'sessions', 'meta'],
      IDB_MARKER: 'ironlog_idb_ok',

      db: null,
      mode: 'memory', // 'idb' | 'ls' | 'memory'
      mem: new Map(),
      onWriteError: null,

      /* ---- Mehrere Fenster derselben App (z. B. installierte App + Browser-Tab) teilen sich die Datenbank.
         Jeder Schreibvorgang setzt einen Stempel; daran erkennt ein Fenster, dass ein anderes inzwischen
         gespeichert hat, und lädt seinen Stand neu, statt einen veralteten zurückzuschreiben. ---- */
      REV_KEY: 'ironlog_rev',
      rev: null,       // letzter Stempel, den dieses Fenster kennt (eigener oder beim Laden gelesener)
      stale: false,    // ein anderes Fenster hat geschrieben, seit dieses Fenster seinen Stand geladen hat
      revBroken: false, // der Stempel lässt sich nicht speichern → Mehrfenster-Erkennung aus
      _stamp() {
        if (this.mode === 'memory') return;
        try {
          // Steht dort ein fremder Stempel, hat inzwischen ein anderes Fenster geschrieben – das bleibt vermerkt,
          // auch wenn dieses Fenster jetzt selbst schreibt (es hat die fremden Änderungen ja nie geladen).
          if (this.revBroken) return;
          if (localStorage.getItem(this.REV_KEY) !== this.rev) this.stale = true;
          const v = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8).padEnd(6, '0')}`;
          localStorage.setItem(this.REV_KEY, v);
          // Nimmt der Browser den Stempel nicht an (Speicher gesperrt/voll), wird die Erkennung abgeschaltet –
          // sonst hielte sich dieses Fenster nach jedem eigenen Schreibvorgang für veraltet.
          if (localStorage.getItem(this.REV_KEY) !== v) { this.revBroken = true; this.stale = false; return; }
          this.rev = v;
        } catch (_) { this.revBroken = true; this.stale = false; /* ohne localStorage keine Mehrfenster-Erkennung – die App läuft trotzdem */ }
      },
      /** Aktuellen Stempel übernehmen (unmittelbar vor dem Laden des Zustands). */
      syncRev() {
        try { this.rev = localStorage.getItem(this.REV_KEY); } catch (_) { this.rev = null; }
        this.stale = false;
      },
      /** Hat ein anderes Fenster seit dem Laden dieses Fensters etwas gespeichert? */
      changedElsewhere() {
        if (this.revBroken) return false;
        if (this.stale) return true;
        try {
          const v = localStorage.getItem(this.REV_KEY);
          return v !== null && v !== this.rev;
        } catch (_) { return false; }
      },

      async init() {
        let hadIdbBefore = false;
        try { hadIdbBefore = localStorage.getItem(this.IDB_MARKER) === '1'; } catch (_) { /* egal */ }

        let lastErr = null;
        for (let attempt = 0; attempt < 2 && !this.db; attempt++) {
          try { this.db = await this._open(); } catch (e) { lastErr = e; }
        }
        if (this.db) {
          this.mode = 'idb';
          try { localStorage.setItem(this.IDB_MARKER, '1'); } catch (_) { /* egal */ }
          return;
        }
        if (hadIdbBefore) {
          // Die Daten liegen in IndexedDB, sie ist nur gerade nicht erreichbar.
          const err = new Error('Die lokale Datenbank ist gerade nicht erreichbar.');
          err.cause = lastErr;
          err.code = 'IDB_UNAVAILABLE';
          throw err;
        }
        try {
          localStorage.setItem('ironlog__probe', '1');
          localStorage.removeItem('ironlog__probe');
          this.mode = 'ls';
        } catch (_) {
          this.mode = 'memory';
        }
      },

      _open() {
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window) || !window.indexedDB) { reject(new Error('IndexedDB fehlt')); return; }
          let req;
          try { req = indexedDB.open(this.DB_NAME, this.DB_VERSION); } catch (e) { reject(e); return; }
          const timer = setTimeout(() => reject(new Error('IndexedDB antwortet nicht')), 5000);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('exercises')) db.createObjectStore('exercises', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('machines')) db.createObjectStore('machines', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('splits')) db.createObjectStore('splits', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          };
          req.onsuccess = () => {
            clearTimeout(timer);
            const db = req.result;
            db.onversionchange = () => { try { db.close(); } catch (_) { /* egal */ } if (Storage.db === db) Storage.db = null; };
            db.onclose = () => { if (Storage.db === db) Storage.db = null; };
            resolve(db);
          };
          req.onerror = () => { clearTimeout(timer); reject(req.error || new Error('IndexedDB-Fehler')); };
        });
      },

      /** Führt eine Transaktion aus; öffnet die Verbindung bei Bedarf einmal neu. */
      async _tx(stores, mode, work) {
        const run = () => new Promise((resolve, reject) => {
          let tx;
          try { tx = this.db.transaction(stores, mode); } catch (e) { reject(e); return; }
          let out;
          tx.oncomplete = () => resolve(out && typeof out === 'object' && 'result' in out ? out.result : out);
          tx.onerror = () => reject(tx.error || new Error('Transaktion fehlgeschlagen'));
          tx.onabort = () => reject(tx.error || new Error('Transaktion abgebrochen'));
          try { out = work(tx); } catch (e) { try { tx.abort(); } catch (_) { /* egal */ } reject(e); }
        });
        const done = (value) => { if (mode === 'readwrite') this._stamp(); return value; };
        try {
          if (!this.db) this.db = await this._open();
          return done(await run());
        } catch (e) {
          const name = e && e.name;
          if (name === 'InvalidStateError' || name === 'UnknownError' || name === 'TransactionInactiveError' || !this.db) {
            try { if (this.db) this.db.close(); } catch (_) { /* egal */ }
            this.db = await this._open();
            return done(await run());
          }
          throw e;
        }
      },

      /* ---- Ersatzspeicher (localStorage / Arbeitsspeicher) ---- */
      _lsGet(key) {
        if (this.mode === 'memory') return this.mem.has(key) ? this.mem.get(key) : null;
        const rawVal = localStorage.getItem(key);
        if (rawVal === null) return null;
        try { return JSON.parse(rawVal); } catch (_) { return null; }
      },
      _lsSet(key, value) {
        if (this.mode === 'memory') { this.mem.set(key, clone(value)); return; }
        localStorage.setItem(key, JSON.stringify(value));
        this._stamp();
      },

      /* ---- Öffentliche API (identisch zur alten StorageEngine) ---- */
      async getAll(storeName) {
        if (this.mode !== 'idb') return this._lsGet(`ironlog_${storeName}`) || [];
        const res = await this._tx(storeName, 'readonly', (tx) => tx.objectStore(storeName).getAll());
        return res || [];
      },

      async putOne(storeName, item) {
        if (this.mode !== 'idb') {
          const list = this._lsGet(`ironlog_${storeName}`) || [];
          const idx = list.findIndex((x) => x.id === item.id);
          if (idx >= 0) list[idx] = item; else list.push(item);
          this._lsSet(`ironlog_${storeName}`, list);
          return;
        }
        await this._tx(storeName, 'readwrite', (tx) => { tx.objectStore(storeName).put(item); });
      },

      async putMany(storeName, items) {
        if (!items.length) return;
        if (this.mode !== 'idb') {
          const list = this._lsGet(`ironlog_${storeName}`) || [];
          for (const item of items) {
            const idx = list.findIndex((x) => x.id === item.id);
            if (idx >= 0) list[idx] = item; else list.push(item);
          }
          this._lsSet(`ironlog_${storeName}`, list);
          return;
        }
        await this._tx(storeName, 'readwrite', (tx) => {
          const store = tx.objectStore(storeName);
          for (const item of items) store.put(item);
        });
      },

      async deleteOne(storeName, id) {
        if (this.mode !== 'idb') {
          const list = this._lsGet(`ironlog_${storeName}`) || [];
          this._lsSet(`ironlog_${storeName}`, list.filter((x) => x.id !== id));
          return;
        }
        await this._tx(storeName, 'readwrite', (tx) => { tx.objectStore(storeName).delete(id); });
      },

      async deleteMany(storeName, ids) {
        if (!ids.length) return;
        if (this.mode !== 'idb') {
          const drop = new Set(ids);
          const list = this._lsGet(`ironlog_${storeName}`) || [];
          this._lsSet(`ironlog_${storeName}`, list.filter((x) => !drop.has(x.id)));
          return;
        }
        await this._tx(storeName, 'readwrite', (tx) => {
          const store = tx.objectStore(storeName);
          for (const id of ids) store.delete(id);
        });
      },

      /** Ersetzt den kompletten Inhalt eines Stores. */
      async putAll(storeName, items) {
        if (this.mode !== 'idb') { this._lsSet(`ironlog_${storeName}`, items); return; }
        await this._tx(storeName, 'readwrite', (tx) => {
          const store = tx.objectStore(storeName);
          store.clear();
          for (const item of items) store.put(item);
        });
      },

      /** Ersetzt mehrere Stores in EINER Transaktion (ganz oder gar nicht). */
      /**
       * Ersetzt ganze Speicher – und zusammen damit beliebige Meta-Werte – in EINEM Schritt:
       * entweder ist danach alles neu oder (bei einem Fehler) alles wie vorher.
       */
      async replaceStores(map, meta = null) {
        const names = Object.keys(map);
        const metaEntries = meta ? Object.entries(meta) : [];
        if (this.mode !== 'idb') {
          for (const n of names) this._lsSet(`ironlog_${n}`, map[n]);
          for (const [key, value] of metaEntries) this._lsSet(`ironlog_meta_${key}`, value);
          return;
        }
        await this._tx(metaEntries.length ? [...names, 'meta'] : names, 'readwrite', (tx) => {
          for (const n of names) {
            const store = tx.objectStore(n);
            store.clear();
            for (const item of map[n]) store.put(item);
          }
          if (metaEntries.length) {
            const ms = tx.objectStore('meta');
            for (const [key, value] of metaEntries) ms.put({ key, value });
          }
        });
      },

      /**
       * Sichert den offenen Entwurf für sich: ein einzelner Schreibvorgang ohne vorheriges Lesen, dessen Abschluss
       * sofort angestoßen wird (commit). Das ist der kürzeste Weg auf die Platte – er gelingt auch dann noch, wenn
       * die Seite unmittelbar danach neu geladen, geschlossen oder vom System angehalten wird.
       */
      async saveActiveDraft(activeDraft) {
        if (this.mode !== 'idb') { this._lsSet('ironlog_meta_activeDraft', activeDraft); return; }
        await this._tx('meta', 'readwrite', (tx) => {
          tx.objectStore('meta').put({ key: 'activeDraft', value: activeDraft });
          // Nicht auf die Rückmeldung des Schreibauftrags warten: Der Browser schließt die Transaktion selbst ab.
          if (typeof tx.commit === 'function') tx.commit();
        });
      },

      /**
       * Arbeitet Änderungen in die gespeicherte Liste aller Entwürfe ein (Schlüssel → Entwurf, null = entfernen),
       * ohne die Entwürfe anderer Fenster zu überschreiben: gelesen wird der gespeicherte Stand, ersetzt werden
       * nur die genannten Schlüssel.
       */
      async mergeDrafts(changes) {
        if (!Object.keys(changes).length) return;
        const apply = (stored) => {
          const map = stored && typeof stored === 'object' && !Array.isArray(stored) ? stored : {};
          for (const [k, v] of Object.entries(changes)) {
            if (v === null) delete map[k]; else map[k] = v;
          }
          return map;
        };
        if (this.mode !== 'idb') { this._lsSet('ironlog_meta_draftsMap', apply(this._lsGet('ironlog_meta_draftsMap'))); return; }
        await this._tx('meta', 'readwrite', (tx) => {
          const store = tx.objectStore('meta');
          const req = store.get('draftsMap');
          req.onsuccess = () => { store.put({ key: 'draftsMap', value: apply(req.result ? req.result.value : null) }); };
        });
      },

      /**
       * Sichert die Entwürfe in zwei Schritten fester Reihenfolge: zuerst der offene Entwurf (direkt, siehe
       * saveActiveDraft), dann die Liste aller Entwürfe (mergeDrafts). Geht beim Schließen der Seite nur der
       * zweite Schritt verloren, gleicht die App das beim nächsten Start aus dem offenen Entwurf wieder ab
       * (adoptNewerActiveDraft).
       */
      async saveDrafts(changes, activeDraft) {
        // Beide Schritte sofort anstoßen und beide abwarten, damit kein Fehler unbehandelt bleibt; gemeldet wird der erste.
        const done = await Promise.allSettled([this.saveActiveDraft(activeDraft), this.mergeDrafts(changes)]);
        const failed = done.find((r) => r.status === 'rejected');
        if (failed) throw failed.reason;
      },

      async getMeta(key) {
        if (this.mode !== 'idb') return this._lsGet(`ironlog_meta_${key}`);
        const rec = await this._tx('meta', 'readonly', (tx) => tx.objectStore('meta').get(key));
        return rec ? rec.value : null;
      },

      async setMeta(key, value) {
        if (this.mode !== 'idb') { this._lsSet(`ironlog_meta_${key}`, value); return; }
        await this._tx('meta', 'readwrite', (tx) => { tx.objectStore('meta').put({ key, value }); });
      },

      /** Schreibt im Hintergrund und meldet Fehler zentral (statt sie zu verschlucken). */
      bg(promise) {
        return Promise.resolve(promise).catch((err) => {
          console.error('[IRONLOG] Speichern fehlgeschlagen:', err);
          if (typeof this.onWriteError === 'function') this.onWriteError(err);
        });
      }
    };

    /* ==========================================================================
       03 · ZUSTAND
       Zentraler App-Zustand, schnelle Nachschlage-Indizes und das robuste Laden
       (inkl. Normalisierung alter oder beschädigter Datensätze).
       ========================================================================== */

    const S = {
      exercises: [],
      machines: [],
      splits: [],
      sessions: [],
      drafts: {},                 // nur Entwürfe mit echten Eingaben: { "<datum>_<splitId>": draft }
      volumeTargets: { ...DEFAULT_VOLUME_TARGETS },
      draft: null,                // aktuell im Training-Tab geöffneter Entwurf
      lastBackupAt: null,
      preUpdate: null,            // { takenAt, counts } – Sicherung des Standes vor dem Update auf Version 2
      lsOrphans: null,            // Einträge, die nur im alten Ersatzspeicher (localStorage) liegen
      ui: {
        tab: 'workout',
        statsTab: 'overview',     // overview | progress
        planTab: 'plan',          // plan | library
        calYear: new Date().getFullYear(),
        calMonth: new Date().getMonth(),
        prog: { exerciseId: null, filter: 'AUTO', metric: 'e1rm', range: '1M', listLimit: 40 },
        historyLimit: 40,
        historyOpen: new Set(),
        planOpen: new Set(),
        libOpen: new Set()
      }
    };

    /* ---------- Indizes --------------------------------------------------------
       Vorher wurde bei jedem Rendern für jede Übung der komplette Verlauf linear
       durchsucht. Die Indizes werden nur neu aufgebaut, wenn sich Daten ändern. */
    const Idx = {
      dirty: true,
      exById: new Map(),
      machById: new Map(),
      machByEx: new Map(),
      sessByDate: new Map(),
      perf: new Map(),      // "exId|machId" → [{date, sessionId, sets}] (neueste zuerst)
      usedByEx: new Map(),  // exId → [{date, machineId}] (neueste zuerst)
      firstLogDate: null,

      touch() { this.dirty = true; },

      ensure() {
        if (!this.dirty) return;
        this.exById = new Map(S.exercises.map((e) => [e.id, e]));
        this.machById = new Map(S.machines.map((m) => [m.id, m]));
        this.machByEx = new Map();
        for (const m of S.machines) {
          if (!this.machByEx.has(m.exerciseId)) this.machByEx.set(m.exerciseId, []);
          this.machByEx.get(m.exerciseId).push(m);
        }
        for (const list of this.machByEx.values()) list.sort((a, b) => a.name.localeCompare(b.name, 'de'));

        this.sessByDate = new Map();
        this.perf = new Map();
        this.usedByEx = new Map();
        this.firstLogDate = null;
        for (const sess of S.sessions) { // S.sessions ist absteigend sortiert
          if (!this.sessByDate.has(sess.date)) this.sessByDate.set(sess.date, []);
          this.sessByDate.get(sess.date).push(sess);
          if (!this.firstLogDate || sess.date < this.firstLogDate) this.firstLogDate = sess.date;
          const mergedInSess = new Map();
          for (const entry of sess.entries) {
            const real = realSets(entry);
            if (!real.length) continue; // Einträge ohne Werte liefern keine Vorwerte
            const key = `${entry.exerciseId}|${entry.machineId}`;
            if (!mergedInSess.has(key)) {
              const rec = { date: sess.date, sessionId: sess.id, splitName: sess.splitName, sets: [] };
              mergedInSess.set(key, rec);
              if (!this.perf.has(key)) this.perf.set(key, []);
              this.perf.get(key).push(rec);
              if (!this.usedByEx.has(entry.exerciseId)) this.usedByEx.set(entry.exerciseId, []);
              this.usedByEx.get(entry.exerciseId).push({ date: sess.date, machineId: entry.machineId });
            }
            mergedInSess.get(key).sets.push(...real);
          }
        }
        this.dirty = false;
      },

      ex(id) { this.ensure(); return this.exById.get(id) || null; },
      mach(id) { this.ensure(); return this.machById.get(id) || null; },
      machinesOf(exId) { this.ensure(); return this.machByEx.get(exId) || []; },
      sessionsOn(date) { this.ensure(); return this.sessByDate.get(date) || []; },
      perfList(exId, machId) { this.ensure(); return this.perf.get(`${exId}|${machId}`) || []; },
      usedList(exId) { this.ensure(); return this.usedByEx.get(exId) || []; },
      firstLog() { this.ensure(); return this.firstLogDate; }
    };

    function sortSessions() {
      S.sessions.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return (b.timestamp || 0) - (a.timestamp || 0);
      });
    }

    function normalizeSplitOrder() {
      S.splits.forEach((s, i) => { s.order = i + 1; });
    }

    /** Sortierung der alten Version (Wochentag aus ID/Name, dann order) – nur für die einmalige Übernahme. */
    function legacyWeekdayRank(split) {
      const id = String(split.id || '').toLowerCase();
      const name = String(split.name || '').toLowerCase();
      if (id === 'day_mon_push' || name.startsWith('montag')) return 1;
      if (id === 'day_tue_pull' || name.startsWith('dienstag')) return 2;
      if (id === 'day_wed_rest' || name.startsWith('mittwoch')) return 3;
      if (id === 'day_thu_legs' || name.startsWith('donnerstag')) return 4;
      if (id === 'day_fri_shoulders_arms' || name.startsWith('freitag')) return 5;
      if (id === 'day_weekend_rest' || name.startsWith('samstag')) return 6;
      if (name.startsWith('sonntag')) return 7;
      return typeof split.order === 'number' ? split.order : 50;
    }
    function legacySortSplits(list) {
      const pos = new Map(list.map((s, i) => [s, i]));
      list.sort((a, b) => (legacyWeekdayRank(a) - legacyWeekdayRank(b)) || ((a.order || 99) - (b.order || 99)) || (pos.get(a) - pos.get(b)));
    }

    /* ---------- Normalisierung --------------------------------------------------
       Macht aus beliebigen (alten, importierten, beschädigten) Datensätzen saubere
       Objekte – oder null, wenn ein Datensatz nicht zu retten ist. */
    const str = (v, fallback = '') => (typeof v === 'string' ? v : (v === null || v === undefined ? fallback : String(v)));

    function inferCategory(name) {
      const n = String(name || '').toLowerCase();
      if (n.includes('schulter') || n.includes('seitheben') || n.includes('facepull') || n.includes('overhead press') || n.includes('military')) return 'Schultern';
      if (n.includes('brust') || n.includes('chest') || n.includes('bankdrück') || n.includes('fly') || n.includes('pec')) return 'Brust';
      if (n.includes('lat') || n.includes('ruder') || n.includes('row') || n.includes('pull') || n.includes('klimm') || n.includes('rücken')) return 'Rücken';
      if (n.includes('trizeps') || n.includes('triceps') || n.includes('pushdown') || n.includes('dip') || n.includes('french')) return 'Trizeps';
      if (n.includes('bizeps') || n.includes('biceps') || n.includes('curl')) return 'Bizeps';
      if (n.includes('glute') || n.includes('hip thrust') || n.includes('abdukt') || /\bpo\b/.test(n)) return 'Po';
      if (n.includes('bauch') || n.includes('crunch') || n.includes('core') || /\babs\b/.test(n)) return 'Bauch';
      if (n.includes('squat') || n.includes('bein') || n.includes('leg') || n.includes('quad') || n.includes('hamstring') || n.includes('wade') || n.includes('calf') || n.includes('addukt') || n.includes('hack')) return 'Beine';
      return 'Sonstiges';
    }

    function normExercise(x) {
      if (!x || typeof x !== 'object' || !x.id) return null;
      const name = str(x.name).trim() || 'Übung';
      const category = CATEGORY_IDS.includes(x.category) ? x.category : inferCategory(name);
      return { ...x, id: str(x.id), name, category };
    }

    function normMachine(m) {
      if (!m || typeof m !== 'object' || !m.id || !m.exerciseId) return null;
      const name = str(m.name).trim() || 'Standard-Gerät';
      let unit = m.unit;
      if (unit !== 'kg' && unit !== 'pin') {
        const low = name.toLowerCase();
        unit = (low.includes('pin') || low.includes('kabel')) ? 'pin' : 'kg';
      }
      return { ...m, id: str(m.id), exerciseId: str(m.exerciseId), name, setupNote: str(m.setupNote), unit };
    }

    function normSplitItem(it) {
      if (!it || typeof it !== 'object' || !it.exerciseId) return null;
      const targetSets = clamp(parseInt(it.targetSets, 10) || 2, 1, 20);
      return {
        ...it,
        exerciseId: str(it.exerciseId),
        labelOverride: str(it.labelOverride),
        targetSets,
        targetRepRange: str(it.targetRepRange) || `${targetSets} WS`,
        defaultMachineId: str(it.defaultMachineId)
      };
    }

    function normSplit(s, idx = 0) {
      if (!s || typeof s !== 'object' || !s.id) return null;
      return {
        ...s,
        id: str(s.id),
        order: Number.isFinite(Number(s.order)) ? Number(s.order) : idx + 1,
        name: str(s.name).trim() || 'Trainingstag',
        isRest: Boolean(s.isRest),
        items: (Array.isArray(s.items) ? s.items : []).map(normSplitItem).filter(Boolean)
      };
    }

    const SET_TYPES = ['normal', 'warmup', 'dropset'];

    /**
     * Sätze ohne Wiederholungen („0 × 0“) stammen aus dem alten „mit Vorwerten abhaken“, wenn es
     * keine Vorwerte gab. Sie bleiben gespeichert (nichts wird verworfen), zählen aber nirgends
     * mit und werden nicht als Wert angezeigt – siehe isRealSet().
     */
    function normSet(s) {
      if (!s || typeof s !== 'object') return null;
      const weight = parseNum(s.weight);
      const reps = parseNum(s.reps);
      const type = SET_TYPES.includes(s.type) ? s.type : 'normal';
      const drops = (type === 'dropset' && Array.isArray(s.drops) ? s.drops : [])
        .map((d) => ({ weight: parseNum(d && d.weight), reps: parseNum(d && d.reps) }))
        .filter((d) => d.weight !== null && d.reps !== null && d.reps > 0);
      return {
        weight: weight === null ? 0 : weight,
        reps: reps === null || reps < 0 ? 0 : reps,
        type,
        partials: Math.max(0, parseInt(s.partials, 10) || 0),
        drops
      };
    }
    /** Ein „echter“ Satz hat mindestens eine Wiederholung. */
    const isRealSet = (s) => Number(s.reps) > 0;
    const realSets = (entry) => entry.sets.filter(isRealSet);
    /** Trainingseinheit (auch ohne eingetragene Werte) – im Gegensatz zum abgehakten Pausentag. */
    const isWorkoutSession = (sess) => !sess.isRestDay && sess.entries.length > 0;

    function normEntry(e) {
      if (!e || typeof e !== 'object' || !e.exerciseId) return null;
      const sets = (Array.isArray(e.sets) ? e.sets : []).map(normSet).filter(Boolean);
      if (!sets.length) return null;
      const out = { exerciseId: str(e.exerciseId), machineId: str(e.machineId), sets };
      if (typeof e.exerciseName === 'string' && e.exerciseName) out.exerciseName = e.exerciseName;
      if (typeof e.machineName === 'string' && e.machineName) out.machineName = e.machineName;
      if (e.unit === 'kg' || e.unit === 'pin') out.unit = e.unit;
      return out;
    }

    function normSession(s) {
      if (!s || typeof s !== 'object' || !s.id || !isValidIso(s.date)) return null;
      const entries = (Array.isArray(s.entries) ? s.entries : []).map(normEntry).filter(Boolean);
      const out = {
        id: str(s.id),
        date: s.date,
        timestamp: Number.isFinite(Number(s.timestamp)) ? Number(s.timestamp) : isoTs(s.date),
        splitId: str(s.splitId),
        splitName: str(s.splitName).trim() || (s.isRestDay ? 'Pausentag' : 'Training'),
        isRestDay: Boolean(s.isRestDay),
        entries
      };
      if (Number.isFinite(Number(s.duration)) && Number(s.duration) > 0) out.duration = Math.round(Number(s.duration));
      if (s.demo === true) out.demo = true;
      return out;
    }

    function dedupeById(list) {
      const seen = new Set();
      return list.filter((x) => (seen.has(x.id) ? false : (seen.add(x.id), true)));
    }

    /* ---- Entwürfe ---- */
    function normDraftSet(s) {
      const src = s && typeof s === 'object' ? s : {};
      const type = SET_TYPES.includes(src.type) ? src.type : 'normal';
      const toField = (v) => (v === null || v === undefined || v === '' ? '' : (typeof v === 'number' ? numToInput(v) : String(v)));
      return {
        sid: str(src.sid) || uid('s'),
        weight: toField(src.weight),
        reps: toField(src.reps),
        type,
        partials: (src.partials === null || src.partials === undefined || src.partials === '') ? null : clamp(parseInt(src.partials, 10) || 0, 0, 5),
        drops: (Array.isArray(src.drops) ? src.drops : []).map((d) => ({ weight: toField(d && d.weight), reps: toField(d && d.reps) })),
        completed: Boolean(src.completed)
      };
    }

    function normDraft(d) {
      if (!d || typeof d !== 'object' || !isValidIso(d.date)) return null;
      const out = {
        splitId: str(d.splitId),
        splitName: str(d.splitName) || 'Training',
        isRest: Boolean(d.isRest),
        date: d.date,
        entries: (Array.isArray(d.entries) ? d.entries : []).filter((e) => e && e.exerciseId).map((e) => ({
          entryId: str(e.entryId) || uid('ent'),
          exerciseId: str(e.exerciseId),
          labelOverride: str(e.labelOverride),
          targetRepRange: str(e.targetRepRange),
          targetSets: clamp(parseInt(e.targetSets, 10) || 2, 1, 20),
          machineId: str(e.machineId),
          collapsed: Boolean(e.collapsed),
          // Momentaufnahme für gelöschte Geräte (sonst würden z. B. Pin-Werte nach einem Neustart als kg gespeichert)
          ...(typeof e.machineName === 'string' && e.machineName ? { machineName: e.machineName } : {}),
          ...(e.unit === 'kg' || e.unit === 'pin' ? { unit: e.unit } : {}),
          sets: (Array.isArray(e.sets) ? e.sets : []).map(normDraftSet)
        }))
      };
      if (d.editingSessionId) out.editingSessionId = str(d.editingSessionId);
      if (d.editDirty) out.editDirty = true;
      if (Number.isFinite(d.duration) && d.duration > 0) out.duration = Math.round(d.duration);
      if (Number.isFinite(d.timerStartedAt) && d.timerStartedAt > 0) out.timerStartedAt = d.timerStartedAt;
      if (Number.isFinite(d.timerElapsed) && d.timerElapsed > 0) out.timerElapsed = Math.round(d.timerElapsed);
      if (d.timerManual) out.timerManual = true;
      if (Number.isFinite(d.viewTs)) out.viewTs = d.viewTs;
      // Entwürfe der alten Version kennen „touched“ nicht: dort zählt, ob etwas eingetragen wurde
      out.legacy = typeof d.touched !== 'boolean';
      out.touched = out.legacy ? draftHasInput(out) : d.touched;
      return out;
    }

    const setHasInput = (s) =>
      s.weight !== '' || s.reps !== '' || s.completed || (s.partials !== null && s.partials > 0) ||
      (s.drops || []).some((d) => d.weight !== '' || d.reps !== '');
    const entryHasInput = (e) => (e.sets || []).some(setHasInput);
    const draftHasInput = (d) => (d.entries || []).some(entryHasInput);

    /* ---------- Laden ---------------------------------------------------------- */
    async function loadState() {
      await Storage.init();
      Storage.syncRev();      // ab hier gilt: was andere Fenster später schreiben, fällt als „geändert“ auf

      const [exercises, machines, splits, sessions, initialized, draftsMap, savedTargets, lastBackupAt, savedDraft, appVersion, preUpdate] = await Promise.all([
        Storage.getAll('exercises'),
        Storage.getAll('machines'),
        Storage.getAll('splits'),
        Storage.getAll('sessions'),
        Storage.getMeta('initialized'),
        Storage.getMeta('draftsMap'),
        Storage.getMeta('volumeTargets'),
        Storage.getMeta('lastBackupAt'),
        Storage.getMeta('activeDraft'),
        Storage.getMeta('appVersion'),
        Storage.getMeta('preUpdateSnapshot')
      ]);

      const hasAnyData = exercises.length > 0 || machines.length > 0 || splits.length > 0 || sessions.length > 0;

      // Allererster Start der Version 2 auf einem Gerät mit vorhandenen Daten:
      // den unveränderten Stand der alten Version als Sicherung ablegen, BEVOR irgendetwas
      // normalisiert oder geschrieben wird. Sie lässt sich unter „Daten“ exportieren oder
      // zurückspielen. (Die alte Version ignoriert diesen zusätzlichen Eintrag.)
      let snapshot = preUpdate && typeof preUpdate === 'object' ? preUpdate : null;
      if (!appVersion && hasAnyData && !snapshot) {
        snapshot = {
          takenAt: Date.now(),
          payload: {
            app: BACKUP_APP_ID, version: 8, exportedAt: new Date().toISOString(),
            data: { exercises, machines, splits, sessions, drafts: draftsMap || {}, volumeTargets: savedTargets || {} },
            activeDraft: savedDraft || null
          }
        };
        await Storage.setMeta('preUpdateSnapshot', snapshot).catch((e) => console.warn('[IRONLOG] Sicherung vor Update nicht möglich:', e));
      }
      if (snapshot && snapshot.payload && snapshot.payload.data) {
        const d = snapshot.payload.data;
        S.preUpdate = { takenAt: snapshot.takenAt, sessions: (d.sessions || []).length, exercises: (d.exercises || []).length };
      }
      if (appVersion !== APP_VERSION) Storage.bg(Storage.setMeta('appVersion', APP_VERSION));

      if (!initialized && !hasAnyData) {
        // Allererster Start: Start-Plan anlegen.
        S.exercises = clone(INITIAL_EXERCISES);
        S.machines = clone(INITIAL_MACHINES);
        S.splits = clone(INITIAL_SPLITS);
        S.sessions = [];
        S.drafts = {};
        S.volumeTargets = { ...DEFAULT_VOLUME_TARGETS };
        normalizeSplitOrder();
        await Storage.replaceStores({ exercises: S.exercises, machines: S.machines, splits: S.splits, sessions: [] });
        await Storage.setMeta('volumeTargets', S.volumeTargets);
        await Storage.setMeta('initialized', true);
      } else {
        const repairs = { exercises: [], machines: [] };

        S.exercises = dedupeById(exercises.map((x) => {
          const n = normExercise(x);
          if (n && n.category !== x.category) repairs.exercises.push(n);
          return n;
        }).filter(Boolean));

        S.machines = dedupeById(machines.map((m) => {
          const n = normMachine(m);
          if (n && n.unit !== m.unit) repairs.machines.push(n);
          return n;
        }).filter(Boolean));

        // Jede Übung besitzt mindestens ein Gerät (Invariante der App).
        const withMachine = new Set(S.machines.map((m) => m.exerciseId));
        for (const ex of S.exercises) {
          if (!withMachine.has(ex.id)) {
            const fallback = { id: uid('m'), exerciseId: ex.id, name: 'Standard-Gerät', setupNote: '', unit: 'kg' };
            S.machines.push(fallback);
            repairs.machines.push(fallback);
          }
        }

        const storedOrder = new Map(splits.filter((s) => s && typeof s === 'object').map((s) => [str(s.id), s.order]));
        S.splits = dedupeById(splits.map(normSplit).filter(Boolean)).sort((a, b) => a.order - b.order);
        if (!appVersion) {
          // Die alte Version sortierte den Plan bei jeder Anzeige nach Wochentag – gespeichert war teils
          // eine andere Reihenfolge. Einmalig übernehmen, was die Nutzer tatsächlich gesehen haben.
          legacySortSplits(S.splits);
        }
        normalizeSplitOrder();
        // Die gespeicherten Positionen müssen lückenlos 1…n sein: spätere Änderungen schreiben nur noch einzelne Tage.
        // Lücken oder Doppelte (z. B. nach einem in der alten Version gelöschten Tag) würden sonst nach einem Neustart
        // die Reihenfolge verändern – deshalb einmal alle Tage mit bereinigter Position zurückschreiben.
        if (S.splits.some((s) => storedOrder.get(s.id) !== s.order)) Storage.bg(Storage.putMany('splits', S.splits));
        if (!S.splits.length) {
          const fallbackSplit = { id: uid('day'), order: 1, name: 'Training', isRest: false, items: [] };
          S.splits = [fallbackSplit];
          Storage.bg(Storage.putOne('splits', fallbackSplit));
        }
        normalizeSplitOrder();

        S.sessions = dedupeById(sessions.map(normSession).filter(Boolean));
        S.volumeTargets = { ...DEFAULT_VOLUME_TARGETS, ...(savedTargets && typeof savedTargets === 'object' ? savedTargets : {}) };

        // Nur Entwürfe mit echten Eingaben behalten (alte Version legte beim
        // bloßen Durchblättern der Tage leere Entwürfe ab, die nie aufgeräumt wurden).
        S.drafts = {};
        Persist.aliases = {};
        if (draftsMap && typeof draftsMap === 'object') {
          for (const [storedKey, value] of Object.entries(draftsMap)) {
            const d = normDraft(value);
            if (!d || d.editingSessionId || !d.touched) continue;
            const key = draftKey(d.date, d.splitId);
            S.drafts[key] = d;
            if (storedKey !== key) Persist.aliases[storedKey] = key;
          }
        }

        if (repairs.exercises.length) Storage.bg(Storage.putMany('exercises', repairs.exercises));
        if (repairs.machines.length) Storage.bg(Storage.putMany('machines', repairs.machines));
        if (!initialized) Storage.bg(Storage.setMeta('initialized', true));
      }

      S.lastBackupAt = Number.isFinite(lastBackupAt) ? lastBackupAt : null;
      sortSessions();
      Idx.touch();
      Persist.markSynced();   // bis hierher entspricht S.drafts dem gespeicherten Stand; alles Weitere sind eigene Änderungen
      const saved = normDraft(savedDraft);
      const adopted = adoptNewerActiveDraft(saved);
      restoreView(saved);
      if (adopted) Persist.listNow([adopted]);   // den Abgleich gleich festschreiben (nur die Liste, nicht den offenen Entwurf)
      findLocalStorageOrphans();
    }

    /* ---------- Ersatzspeicher-Fund ----------------------------------------------
       Die alte Version wich bei einem Datenbank-Fehler still auf localStorage aus.
       Einträge aus so einer Sitzung waren beim nächsten normalen Start „weg“.
       Sie werden hier erkannt und unter „Daten“ zur Übernahme angeboten. */
    function readLegacyLocalStorage(store) {
      try {
        const rawVal = localStorage.getItem(`ironlog_${store}`);
        const list = rawVal ? JSON.parse(rawVal) : [];
        return Array.isArray(list) ? list : [];
      } catch (_) { return []; }
    }

    function findLocalStorageOrphans() {
      S.lsOrphans = null;
      if (Storage.mode !== 'idb') return;
      let dismissed = false;
      try { dismissed = localStorage.getItem('ironlog_ls_rescue_done') === '1'; } catch (_) { return; }
      if (dismissed) return;
      const known = new Set(S.sessions.map((s) => s.id));
      const sessions = dedupeById(readLegacyLocalStorage('sessions').map(normSession).filter(Boolean)).filter((s) => !known.has(s.id));
      if (!sessions.length) return;
      const exIds = new Set(S.exercises.map((e) => e.id));
      const mIds = new Set(S.machines.map((m) => m.id));
      S.lsOrphans = {
        sessions,
        exercises: dedupeById(readLegacyLocalStorage('exercises').map(normExercise).filter(Boolean)).filter((e) => !exIds.has(e.id)),
        machines: dedupeById(readLegacyLocalStorage('machines').map(normMachine).filter(Boolean)).filter((m) => !mIds.has(m.id))
      };
    }

    /** Übernimmt die gefundenen Einträge zusätzlich in die Datenbank (es wird nichts ersetzt). */
    function adoptLocalStorageOrphans() {
      const o = S.lsOrphans;
      if (!o) return 0;
      const usedEx = new Set(o.sessions.flatMap((s) => s.entries.map((e) => e.exerciseId)));
      const usedM = new Set(o.sessions.flatMap((s) => s.entries.map((e) => e.machineId)));
      const exercises = o.exercises.filter((e) => usedEx.has(e.id));
      const machines = o.machines.filter((m) => usedM.has(m.id) && (exercises.some((e) => e.id === m.exerciseId) || S.exercises.some((e) => e.id === m.exerciseId)));
      S.exercises.push(...exercises);
      S.machines.push(...machines);
      S.sessions.push(...o.sessions);
      sortSessions();
      Idx.touch();
      Storage.bg(Promise.all([
        Storage.putMany('exercises', exercises),
        Storage.putMany('machines', machines),
        Storage.putMany('sessions', o.sessions)
      ]));
      try { localStorage.setItem('ironlog_ls_rescue_done', '1'); } catch (_) { /* egal */ }
      S.lsOrphans = null;
      return o.sessions.length;
    }

    function dismissLocalStorageOrphans() {
      try { localStorage.setItem('ironlog_ls_rescue_done', '1'); } catch (_) { /* egal */ }
      S.lsOrphans = null;
    }

    /* ---------- Speichern des Entwurfs ----------------------------------------- */
    const Persist = {
      pending: false,
      frozen: false,   // true, sobald eine Sicherung zurückgespielt wurde: bis zum Neuladen darf nichts mehr darüberschreiben
      _timer: null,
      _synced: {},     // Entwürfe, wie sie zuletzt an die Datenbank übergeben wurden (Schlüssel → JSON)
      _retry: new Set(), // Schlüssel aus fehlgeschlagenen Schreibvorgängen – werden beim nächsten Mal erneut gesendet
      aliases: {},     // abweichend gespeicherter Schlüssel → eigener Schlüssel (nur bei ungewöhnlichen Altdaten)

      /** Den aktuellen Stand der Entwürfe als „entspricht der Datenbank“ merken. */
      markSynced() {
        this._synced = Object.fromEntries(Object.entries(S.drafts).map(([k, d]) => [k, JSON.stringify(d)]));
      },

      /** Was hat DIESES Fenster seit dem letzten Abgleich an den Entwürfen geändert? */
      _changes() {
        const now = Object.fromEntries(Object.entries(S.drafts).map(([k, d]) => [k, JSON.stringify(d)]));
        const changes = {};
        for (const k of Object.keys(now)) if (now[k] !== this._synced[k]) changes[k] = S.drafts[k];
        for (const k of Object.keys(this._synced)) if (!(k in now)) changes[k] = null;
        for (const k of this._retry) if (!(k in changes)) changes[k] = k in S.drafts ? S.drafts[k] : null;
        for (const [storedKey, key] of Object.entries(this.aliases)) {
          if (key in changes) { changes[storedKey] = null; delete this.aliases[storedKey]; }
        }
        return { changes, now };
      },

      /* „beforeunload“ ist der letzte Moment, in dem eine Seite beim Neuladen oder Schließen noch sicher schreiben
         kann. Der Listener hängt nur, solange wirklich etwas Ungespeichertes anliegt – ein dauerhafter Listener
         würde die Seite in manchen Browsern vom schnellen Zurück-Cache ausschließen. */
      _unloadWatched: false,
      _onUnload() { if (Persist.pending) Persist.draftNow(); },
      _watchUnload(on) {
        if (on === this._unloadWatched) return;
        this._unloadWatched = on;
        if (on) window.addEventListener('beforeunload', this._onUnload);
        else window.removeEventListener('beforeunload', this._onUnload);
      },

      /**
       * Entwurf demnächst sichern (bündelt schnelles Tippen).
       * Der offene Entwurf selbst geht sofort auf die Platte – ein einzelner, direkter Schreibvorgang je Eingabe.
       * So ist auch das zuletzt Getippte gesichert, wenn die Seite gleich darauf geschlossen, neu geladen oder
       * vom System angehalten wird. Gebündelt wird nur der aufwendigere Abgleich der Liste aller Entwürfe.
       */
      draftSoon() {
        if (this.frozen) return;
        this.pending = true;
        this._watchUnload(true);
        if (S.draft) {
          S.draft.viewTs = Date.now();
          if (!Storage.changedElsewhere()) {
            Storage.bg(Storage.saveActiveDraft(S.draft));
          }
        }
        clearTimeout(this._timer);
        this._timer = setTimeout(() => { this.draftNow(); }, 300);
      },

      /**
       * Einzelne Entwürfe sofort in die gespeicherte Liste schreiben, ohne den gespeicherten offenen Entwurf
       * anzufassen (Abgleich direkt nach dem Start, siehe adoptNewerActiveDraft).
       */
      listNow(keys) {
        if (this.frozen) return Promise.resolve();
        const changes = {};
        for (const k of keys) {
          if (!(k in S.drafts)) continue;
          changes[k] = S.drafts[k];
          this._synced[k] = JSON.stringify(S.drafts[k]);
        }
        const sent = Object.keys(changes);
        if (!sent.length) return Promise.resolve();
        return Storage.bg(Storage.mergeDrafts(changes).then(
          () => { for (const k of sent) this._retry.delete(k); },
          (err) => { for (const k of sent) this._retry.add(k); throw err; }
        ));
      },

      /**
       * Entwurf sofort sichern (Satz abgehakt, Tag gewechselt, App geht in den Hintergrund …).
       * Geschrieben werden nur die eigenen Änderungen – Entwürfe, die ein anderes Fenster inzwischen
       * gespeichert hat, bleiben unberührt.
       */
      draftNow() {
        clearTimeout(this._timer);
        this._timer = null;
        this.pending = false;
        this._watchUnload(false);
        if (this.frozen || !S.draft) return Promise.resolve();
        S.draft.viewTs = Date.now();
        const { changes, now } = this._changes();
        this._synced = now;
        const keys = Object.keys(changes);
        // Wenn ein anderes Fenster inzwischen geschrieben hat, nur die eigenen geänderten Entwürfe in draftsMap
        // einarbeiten und activeDraft nur aktualisieren, wenn dieser Entwurf tatsächlich bearbeitet wurde.
        if (Storage.changedElsewhere()) {
          const writeJob = S.draft.touched || hasUnsavedEdits()
            ? Storage.saveDrafts(changes, S.draft)
            : Storage.mergeDrafts(changes);
          return Storage.bg(writeJob.then(
            () => { for (const k of keys) this._retry.delete(k); Storage.syncRev(); },
            (err) => { for (const k of keys) this._retry.add(k); throw err; }
          ));
        }
        return Storage.bg(Storage.saveDrafts(changes, S.draft).then(
          () => { for (const k of keys) this._retry.delete(k); },
          (err) => { for (const k of keys) this._retry.add(k); throw err; }
        ));
      }
    };

    /* ==========================================================================
       04 · FACHLOGIK
       Alles, was mit Training, Plan, Verlauf und Auswertung zu tun hat – ohne
       jede Zeile DOM. Die Oberfläche (ab Modul 05) ruft nur diese Funktionen auf.
       ========================================================================== */

    /* ---------- Wochentage & Trainingstage -------------------------------------
       Vorher war die Zuordnung Wochentag → Trainingstag fest an die sechs
       Start-IDs gebunden; selbst angelegte Tage wurden nie automatisch gewählt.
       Jetzt wird der Wochentag aus dem Namen gelesen („Montag – Push“,
       „Sa & So – Pause“, „Push (Mo/Do)“); die alten IDs bleiben als Rückfall. */
    const WEEKDAY_WORDS = [
      [1, ['montag', 'montags', 'monday'], ['mo', 'mon']],
      [2, ['dienstag', 'dienstags', 'tuesday'], ['di', 'tue']],
      [3, ['mittwoch', 'mittwochs', 'wednesday'], ['mi', 'wed']],
      [4, ['donnerstag', 'donnerstags', 'thursday'], ['do', 'thu']],
      [5, ['freitag', 'freitags', 'friday'], ['fr', 'fri']],
      [6, ['samstag', 'samstags', 'sonnabend', 'saturday'], ['sa', 'sat']],
      [7, ['sonntag', 'sonntags', 'sunday'], ['so', 'sun']]
    ];
    const WEEKDAY_CONNECTORS = new Set(['und', 'and', 'bis']);
    const LEGACY_SPLIT_WEEKDAYS = {
      day_mon_push: [1], day_tue_pull: [2], day_wed_rest: [3],
      day_thu_legs: [4], day_fri_shoulders_arms: [5], day_weekend_rest: [6, 7]
    };

    function weekdaysInName(name) {
      const found = new Set();
      const segments = String(name || '').toLowerCase().split(/\s[–—-]\s|[:|()\[\]]/);
      for (const seg of segments) {
        const tokens = seg.split(/[^a-zäöüß]+/).filter(Boolean);
        if (!tokens.length) continue;
        const abbrevDays = [];
        let onlyWeekdayTokens = true;
        for (const t of tokens) {
          const full = WEEKDAY_WORDS.find(([, names]) => names.includes(t));
          if (full) { found.add(full[0]); continue; }
          const abbr = WEEKDAY_WORDS.find(([, , abbrs]) => abbrs.includes(t));
          if (abbr) { abbrevDays.push(abbr[0]); continue; }
          if (!WEEKDAY_CONNECTORS.has(t)) onlyWeekdayTokens = false;
        }
        // Kürzel („Mo“, „Do“ …) zählen nur, wenn der Abschnitt ausschließlich aus
        // Wochentagen besteht – sonst würde „so“ in normalem Text falsch treffen.
        if (onlyWeekdayTokens) abbrevDays.forEach((d) => found.add(d));
      }
      return found;
    }

    function splitWeekdays(split) {
      const fromName = weekdaysInName(split.name);
      if (fromName.size) return fromName;
      return new Set(LEGACY_SPLIT_WEEKDAYS[split.id] || []);
    }

    function splitById(id) {
      return S.splits.find((s) => s.id === id) || null;
    }

    /** Der laut Plan vorgesehene Trainingstag für ein Datum. */
    function splitForDate(iso) {
      const wd = weekdayOf(iso);
      return S.splits.find((s) => splitWeekdays(s).has(wd)) || S.splits[0] || null;
    }

    const SPLIT_SEPARATOR = /\s[–—-]\s/;
    const WEEKDAY_ABBREV = [
      [/montags?/gi, 'Mo'], [/dienstags?/gi, 'Di'], [/mittwochs?/gi, 'Mi'], [/donnerstags?/gi, 'Do'],
      [/freitags?/gi, 'Fr'], [/samstags?|sonnabend/gi, 'Sa'], [/sonntags?/gi, 'So']
    ];

    /** Kurzbezeichnungen für die Auswahl-Chips – garantiert eindeutig. */
    function splitChipLabels() {
      const base = S.splits.map((s) => {
        const parts = s.name.split(SPLIT_SEPARATOR);
        return parts.length > 1 ? parts.slice(1).join(' – ').trim() || s.name : s.name;
      });
      const counts = new Map();
      base.forEach((b) => counts.set(b, (counts.get(b) || 0) + 1));
      const labels = new Map();
      S.splits.forEach((s, i) => {
        let label = base[i];
        if (counts.get(label) > 1) {
          let head = s.name.split(SPLIT_SEPARATOR)[0].trim();
          for (const [re, ab] of WEEKDAY_ABBREV) head = head.replace(re, ab);
          label = head && head !== label ? `${label} · ${head}` : s.name;
        }
        labels.set(s.id, label);
      });
      return labels;
    }

    /** Position für einen neuen Tag: nach dem letzten Tag mit früherem/gleichem Wochentag. */
    function insertIndexForNewSplit(name) {
      const days = Array.from(weekdaysInName(name));
      if (!days.length) return S.splits.length;
      const rank = Math.min(...days);
      let idx = S.splits.length;
      for (let i = 0; i < S.splits.length; i++) {
        const wd = Array.from(splitWeekdays(S.splits[i]));
        if (wd.length && Math.min(...wd) > rank) { idx = i; break; }
      }
      return idx;
    }

    /* ---------- Namen & Einheiten (mit Rückfall auf gespeicherte Momentaufnahme) */
    function exerciseName(exerciseId, entry = null) {
      const ex = Idx.ex(exerciseId);
      if (ex) return ex.name;
      return (entry && entry.exerciseName) || (entry && entry.labelOverride) || 'Gelöschte Übung';
    }
    function machineName(machineId, entry = null) {
      const m = Idx.mach(machineId);
      if (m) return m.name;
      return (entry && entry.machineName) || 'Gelöschtes Gerät';
    }
    function unitOf(machineId, entry = null) {
      const m = Idx.mach(machineId);
      if (m) return m.unit === 'pin' ? 'pin' : 'kg';
      return entry && entry.unit === 'pin' ? 'pin' : 'kg';
    }
    function categoryOf(exerciseId) {
      const ex = Idx.ex(exerciseId);
      return ex ? (ex.category || inferCategory(ex.name)) : 'Sonstiges';
    }
    const unitLabel = (unit) => (unit === 'pin' ? 'Pin' : 'kg');
    /** „82,5 kg“ bzw. „Pin 7“ */
    const fmtLoad = (weight, unit) => (unit === 'pin' ? `Pin ${fmtNum(weight)}` : `${fmtNum(weight)} kg`);
    /** Kompakte Satz-Notation: „82,5 × 8 +1“ */
    function fmtSetShort(s) {
      const p = Number(s.partials) > 0 ? ` +${s.partials}` : '';
      return `${fmtNum(s.weight)} × ${fmtNum(s.reps)}${p}`;
    }

    /* ---------- Leistungsformeln (unverändert) ---------------------------------- */
    function effectiveReps(reps, partials = 0) {
      const r = Number(reps) || 0;
      const p = Number(partials) || 0;
      if (r <= 0) return 0;
      return r + p * 0.5; // Partials zählen als halbe Wiederholung
    }

    /** Geschätztes 1RM: bis 10 Wdh. Brzycki, darüber Epley (bei 10 identisch). */
    function calcE1RM(weight, reps, partials = 0) {
      const w = Number(weight) || 0;
      const effR = effectiveReps(reps, partials);
      if (w <= 0 || effR <= 0) return 0;
      if (effR === 1) return w;
      if (effR <= 10) return w * (36 / (37 - effR));
      return w * (1 + effR / 30);
    }

    function calcSetVolume(set) {
      const w = Number(set.weight) || 0;
      let vol = w * effectiveReps(set.reps, set.partials);
      if (set.type === 'dropset' && Array.isArray(set.drops)) {
        for (const d of set.drops) {
          const dw = Number(d.weight) || 0;
          const dr = Number(d.reps) || 0;
          if (dw > 0 && dr > 0) vol += dw * dr;
        }
      }
      return vol;
    }

    const isWorkingSet = (s) => s.type !== 'warmup' && Number(s.reps) > 0;

    function sessionSummary(sess) {
      let sets = 0;
      let volumeKg = 0;
      for (const e of sess.entries) {
        const unit = unitOf(e.machineId, e);
        for (const s of e.sets) {
          if (!isWorkingSet(s)) continue;
          sets++;
          if (unit === 'kg') volumeKg += calcSetVolume(s);
        }
      }
      return { exercises: sess.entries.length, sets, volumeKg: Math.round(volumeKg) };
    }

    /* ---------- Vorwerte --------------------------------------------------------
       „Zuletzt“ heißt: die jüngste Einheit an diesem Gerät, die NICHT nach dem
       betrachteten Datum liegt (beim Nachtragen älterer Tage also nicht die Werte von
       später). Gibt es bis zu diesem Tag noch gar keine Werte – der Tag liegt vor der
       ersten eingetragenen Einheit –, dient die zeitlich nächste spätere Einheit als
       Vorlage: so lässt sich wie in der bisherigen Version jeder Tag nachtragen. */
    function lastPerformance(exerciseId, machineId, onOrBefore = null, excludeSessionId = null) {
      let nearestLater = null;
      let nearestLaterWarmupOnly = null;
      let warmupOnlyFallback = null;
      for (const p of Idx.perfList(exerciseId, machineId)) {     // neueste zuerst
        if (excludeSessionId && p.sessionId === excludeSessionId) continue;
        const hasWork = p.sets.some(isWorkingSet);
        if (onOrBefore && p.date > onOrBefore) {
          if (hasWork) nearestLater = p;
          else if (!nearestLaterWarmupOnly) nearestLaterWarmupOnly = p;
          continue;
        }
        if (hasWork) return p;
        if (!warmupOnlyFallback) warmupOnlyFallback = p;
      }
      return warmupOnlyFallback || nearestLater || nearestLaterWarmupOnly;
    }

    function lastUsedMachineId(exerciseId, onOrBefore = null) {
      const list = Idx.usedList(exerciseId);
      if (!list.length) return null;
      if (onOrBefore) {
        const hit = list.find((u) => u.date <= onOrBefore);
        // Noch nichts bis zu diesem Tag: das zeitlich nächste spätere Gerät (passend zu lastPerformance)
        return hit ? hit.machineId : list[list.length - 1].machineId;
      }
      return list[0].machineId;
    }

    function pickMachineId(exerciseId, preferredId = null, onOrBefore = null) {
      const machines = Idx.machinesOf(exerciseId);
      if (!machines.length) return '';
      for (const cand of [lastUsedMachineId(exerciseId, onOrBefore), preferredId]) {
        if (cand && machines.some((m) => m.id === cand)) return cand;
      }
      return machines[0].id;
    }

    /** Stellt sicher, dass eine Übung ein Gerät hat (legt notfalls „Standard-Gerät“ an). */
    function ensureMachine(exerciseId) {
      const machines = Idx.machinesOf(exerciseId);
      if (machines.length) return machines[0];
      const fallback = { id: uid('m'), exerciseId, name: 'Standard-Gerät', setupNote: '', unit: 'kg' };
      S.machines.push(fallback);
      Idx.touch();
      Storage.bg(Storage.putOne('machines', fallback));
      return fallback;
    }

    /* ---------- Entwürfe -------------------------------------------------------- */
    const draftKey = (date, splitId) => `${date || todayIso()}_${splitId || 'default'}`;

    function newDraftSet(type = 'normal', dropCount = 0) {
      return {
        sid: uid('s'),
        weight: '',
        reps: '',
        type,
        partials: null, // null = noch nicht angefasst → Vorwert wird als Vorschau gezeigt
        drops: Array.from({ length: dropCount }, () => ({ weight: '', reps: '' })),
        completed: false
      };
    }

    function buildSetRows(exerciseId, machineId, targetSets, date, excludeSessionId = null) {
      const last = lastPerformance(exerciseId, machineId, date, excludeSessionId);
      const count = Math.max(targetSets || 2, last ? last.sets.length : 0);
      const rows = [];
      for (let i = 0; i < count; i++) {
        const prev = last && last.sets[i] ? last.sets[i] : null;
        rows.push(newDraftSet(prev ? prev.type : 'normal', prev && prev.type === 'dropset' ? (prev.drops || []).length : 0));
      }
      return rows;
    }

    function newDraftEntry(exerciseId, { targetSets = 2, targetRepRange = '', preferredMachineId = null, date, excludeSessionId = null } = {}) {
      ensureMachine(exerciseId);
      const machineId = pickMachineId(exerciseId, preferredMachineId, date);
      const ex = Idx.ex(exerciseId);
      return {
        entryId: uid('ent'),
        exerciseId,
        labelOverride: ex ? ex.name : '',
        targetRepRange: targetRepRange || `${targetSets} WS`,
        targetSets,
        machineId,
        collapsed: false,
        sets: buildSetRows(exerciseId, machineId, targetSets, date, excludeSessionId)
      };
    }

    function buildDraftForSplit(splitId, date) {
      const split = splitById(splitId) || S.splits[0] || null;
      const day = date || todayIso();
      if (!split || split.isRest) {
        return { splitId: split ? split.id : '', splitName: split ? split.name : 'Pausentag', isRest: true, date: day, entries: [], touched: false };
      }
      const entries = split.items
        .filter((item) => Idx.ex(item.exerciseId))
        .map((item) => newDraftEntry(item.exerciseId, {
          targetSets: item.targetSets || 2,
          targetRepRange: item.targetRepRange,
          preferredMachineId: item.defaultMachineId,
          date: day
        }));
      return { splitId: split.id, splitName: split.name, isRest: false, date: day, entries, touched: false };
    }

    function draftFromSession(sess) {
      const validSplit = sess.splitId && splitById(sess.splitId);
      const fallback = splitForDate(sess.date);
      return {
        editingSessionId: sess.id,
        editDirty: false,
        duration: sess.duration || 0,
        splitId: validSplit ? sess.splitId : (fallback ? fallback.id : ''),
        splitName: sess.splitName || 'Training',
        isRest: Boolean(sess.isRestDay),
        date: sess.date,
        touched: false,
        entries: sess.entries.map((e) => ({
          entryId: uid('ent'),
          exerciseId: e.exerciseId,
          labelOverride: exerciseName(e.exerciseId, e),
          machineName: machineName(e.machineId, e),   // Momentaufnahme für gelöschte Geräte
          unit: unitOf(e.machineId, e),
          targetRepRange: `${e.sets.length} WS`,
          targetSets: e.sets.length || 2,
          machineId: e.machineId,
          collapsed: false,
          sets: e.sets.map((s) => (isRealSet(s) ? {
            sid: uid('s'),
            weight: numToInput(s.weight),
            reps: numToInput(s.reps),
            type: s.type || 'normal',
            partials: Number(s.partials) || 0,
            drops: (s.drops || []).map((d) => ({ weight: numToInput(d.weight), reps: numToInput(d.reps) })),
            completed: true
          } : newDraftSet(s.type || 'normal'))) // ohne Werte abgehakt → leere Zeile zum Nachtragen
        }))
      };
    }

    /** Ein bereits angefangener, noch nicht gespeicherter Entwurf für diesen Tag (bevorzugt für den genannten Trainingstag). */
    function startedDraftFor(date, splitId = '') {
      const own = S.drafts[draftKey(date, splitId)];
      if (own) return own;
      const key = Object.keys(S.drafts).find((k) => k.startsWith(`${date}_`));
      return key ? S.drafts[key] : null;
    }

    function preferredSessionForDate(date, preferredSplitId = null) {
      const logs = Idx.sessionsOn(date);
      if (!logs.length) return null;
      if (preferredSplitId) {
        const match = logs.find((s) => s.splitId === preferredSplitId);
        if (match) return match;
      }
      return logs.find(isWorkoutSession) || logs[0];
    }

    /**
     * Öffnet einen Tag im Training-Tab.
     * Reihenfolge: gespeicherte Einheit → angefangener Entwurf → frischer Entwurf
     * aus dem Plan (wird erst gespeichert, wenn wirklich etwas eingetragen wurde).
     */
    function openDay(date, splitId = null) {
      const day = isValidIso(date) ? date : todayIso();

      if (splitId) {
        // Ein angefangener Entwurf hat Vorrang (z. B. zweite Einheit am selben Tag)
        const started = S.drafts[draftKey(day, splitId)];
        if (started) { S.draft = started; return; }
        const logged = Idx.sessionsOn(day).find((s) => s.splitId === splitId);
        S.draft = logged ? draftFromSession(logged) : buildDraftForSplit(splitId, day);
        return;
      }

      const logged = preferredSessionForDate(day);
      if (logged) { S.draft = draftFromSession(logged); return; }

      const natural = splitForDate(day);
      const naturalId = natural ? natural.id : '';
      let draft = S.drafts[draftKey(day, naturalId)] || null;
      if (!draft) {
        const anyKey = Object.keys(S.drafts).find((k) => k.startsWith(`${day}_`));
        if (anyKey) draft = S.drafts[anyKey];
      }
      S.draft = draft || buildDraftForSplit(naturalId, day);
    }

    /**
     * Welche Ansicht beim App-Start?
     * Vorher wurde immer der zuletzt angesehene Tag wiederhergestellt – wer gestern
     * trainiert hatte, landete heute wieder auf gestern. Jetzt: heute, außer die
     * App wurde erst vor Kurzem verlassen (z. B. vom System im Hintergrund beendet).
     */
    const RESUME_WINDOW_MS = 3 * 60 * 60 * 1000;

    /** Struktur eines Entwurfs ohne Eingaben (Übungen, Geräte, Satztypen) – zum Vergleichen. */
    function draftShape(d) {
      return JSON.stringify(d.entries.map((e) => [e.exerciseId, e.machineId, e.sets.map((s) => [s.type, (s.drops || []).length])]));
    }

    /**
     * Entwurf der bisherigen Version, der eine gespeicherte Einheit bearbeitet: Wurde dort wirklich etwas
     * geändert und nicht gespeichert? Dann wird die Änderung übernommen – auf Basis der gespeicherten
     * Einheit, damit nichts verloren geht, was der alte Entwurf nicht mehr enthielt (die alte Version nahm
     * z. B. die Sätze einer gelöschten Übung aus dem Entwurf, ließ sie aber in der Einheit stehen).
     * Verglichen wird, was die alte Version beim Speichern geschrieben hätte. Rückgabe: Entwurf oder null.
     */
    function mergeLegacyEdit(saved, sess) {
      const draftSets = (entry) => entry.sets.map((s) => {
        const w = parseNum(s.weight);
        const r = parseNum(s.reps);
        if (w === null || r === null || !(r > 0)) return null;
        const drops = s.type === 'dropset'
          ? (s.drops || []).map((d) => [parseNum(d.weight), parseNum(d.reps)]).filter((d) => d[0] !== null && d[1] !== null && d[1] > 0)
          : [];
        return [w, r, s.type || 'normal', Number(s.partials) || 0, drops];
      }).filter(Boolean);
      const savedSets = (e) => e.sets.filter(isRealSet).map((s) => [
        Number(s.weight) || 0, Number(s.reps), s.type || 'normal', Number(s.partials) || 0,
        s.type === 'dropset' ? (s.drops || []).filter((d) => Number(d.reps) > 0).map((d) => [Number(d.weight) || 0, Number(d.reps)]) : []
      ]);
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

      const base = draftFromSession(sess);
      const used = new Set();
      let changed = false;
      for (const le of saved.entries) {
        const i = sess.entries.findIndex((e, idx) => !used.has(idx) && e.exerciseId === le.exerciseId);
        if (i < 0) {
          // in der alten Version zur Einheit hinzugefügte Übung
          if (Idx.ex(le.exerciseId) && draftSets(le).length) { base.entries.push(le); changed = true; }
          continue;
        }
        used.add(i);
        const se = sess.entries[i];
        // Das gespeicherte Gerät gibt es nicht mehr: die alte Version hat diese Übung im offenen Entwurf dann selbst
        // umgehängt und ihre Zeilen neu aufgebaut – das ist keine Eingabe des Nutzers, die Einheit bleibt, wie sie ist.
        if (!Idx.mach(se.machineId)) continue;
        const setsChanged = !same(draftSets(le), savedSets(se));
        // Ein anderes Gerät zählt nur als Änderung, wenn das gespeicherte Gerät noch existiert (sonst war es der automatische Ersatz)
        const machineChanged = le.machineId !== se.machineId && Boolean(Idx.mach(se.machineId)) && Boolean(Idx.mach(le.machineId));
        if (!setsChanged && !machineChanged) continue;
        const target = base.entries[i];
        if (setsChanged) target.sets = le.sets;
        if (machineChanged) {
          target.machineId = le.machineId;
          target.machineName = machineName(le.machineId);
          target.unit = unitOf(le.machineId);
        }
        changed = true;
      }
      // In der alten Version aus der Einheit entfernte Übungen – nur wenn es die Übung selbst noch gibt
      const removed = new Set(sess.entries.map((e, idx) => idx)
        .filter((idx) => !used.has(idx) && Idx.ex(sess.entries[idx].exerciseId) && savedSets(sess.entries[idx]).length));
      if (removed.size) {
        base.entries = base.entries.filter((_, idx) => !removed.has(idx));
        changed = true;
      }
      if (!changed) return null;
      base.editDirty = true;
      return base;
    }

    /**
     * Beim Sichern geht der offene Entwurf zuerst und für sich auf die Platte, die Liste aller Entwürfe folgt in
     * einem zweiten Schritt (Storage.saveDrafts). Wurde die Seite genau dazwischen geschlossen, ist der einzeln
     * gesicherte Stand der neuere – dann gilt er auch für die Liste. Sonst ginge die letzte Eingabe verloren,
     * sobald die App später mit einem anderen Tag startet. Rückgabe: Schlüssel des übernommenen Entwurfs oder null.
     * (Entwürfe der bisherigen Version tragen keinen Zeitstempel und bleiben hiervon unberührt.)
     */
    function adoptNewerActiveDraft(saved) {
      if (!saved || saved.legacy || saved.editingSessionId || !saved.touched || !Number.isFinite(saved.viewTs)) return null;
      const key = draftKey(saved.date, saved.splitId);
      const listed = S.drafts[key];
      if (listed && Number(listed.viewTs) >= saved.viewTs) return null;
      S.drafts[key] = saved;
      return key;
    }

    function restoreView(saved) {
      const today = todayIso();
      // Bearbeitung einer gespeicherten Einheit aus der bisherigen Version: echte, ungespeicherte Änderungen
      // weder still speichern noch still verwerfen – als „Ungespeichert“ anbieten (einmalig, unabhängig vom Datum).
      if (saved && saved.legacy && saved.editingSessionId) {
        const sess = S.sessions.find((x) => x.id === saved.editingSessionId);
        const merged = sess ? mergeLegacyEdit(saved, sess) : null;
        if (merged) { S.draft = merged; return; }
      }
      const recent = saved && Number.isFinite(saved.viewTs) && Date.now() - saved.viewTs < RESUME_WINDOW_MS;
      const resume = saved && (saved.date === today || recent);
      if (!resume) { openDay(today); return; }

      if (saved.editingSessionId) {
        const sess = S.sessions.find((s) => s.id === saved.editingSessionId);
        if (sess && saved.editDirty) { S.draft = saved; return; }     // ungespeicherte Änderungen zurückholen
        if (sess) { S.draft = draftFromSession(sess); return; }
        openDay(saved.date);
        return;
      }
      // Heutiger Entwurf der alten Version ohne Werte, aber mit umgebauter Übungsfolge: behalten
      if (saved.legacy && !saved.touched && splitById(saved.splitId)) {
