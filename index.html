    /* ==========================================================================
       IRONLOG · Design-System
       --------------------------------------------------------------------------
       Leitlinien
       · Schwarz als Grundfläche (OLED). Tiefe entsteht durch hellere, leicht
         kühl getönte Flächen – nicht durch Schatten oder Leuchteffekte. Der einzige
         Verlauf liegt (im selben Farbton) auf vollflächigem Akzent.
       · EINE Akzentfarbe mit klarer Bedeutung:
           vollflächig  = Hauptaktion / erledigt
           getönt       = ausgewählt / aktiv
         Rot nur für Löschen & Fehler, Gelb nur für Aufwärmsätze & Warnungen,
         Violett nur für Dropsätze.
       · Drei Textstufen, keine Schrift unter 11 px, Eingabefelder immer 16 px+
         (sonst zoomt iOS beim Antippen).
       · Tippflächen mindestens 44 × 44 px, die Hauptaktion einer Zeile ist die größte.
       · 4-px-Raster für alle Abstände; Radien 10 / 14 / 20 / rund.
       ========================================================================== */

    :root {
      color-scheme: dark;

      /* Flächen */
      --bg: #000000;
      --surface: #10141b;               /* Karten: kühles Nachtblau statt neutralem Grau – das Grün wirkt darauf klarer */
      --surface-2: #181d27;
      --surface-3: #252832;
      --surface-4: #343845;
      --sheet: #141922;
      --raised: #262d3b;                /* schwebende Hinweise (Toast, Diagramm-Tooltip) */
      --line: rgba(200, 220, 255, 0.09);
      --line-2: rgba(200, 220, 255, 0.16);
      --field-line: #5b6781;            /* Rand von Eingabefeldern: mind. 3:1 zur Fläche */

      /* Text */
      --ink: #f1f4fa;
      --ink-2: #a6b0c2;
      --ink-3: #7c879c;
      --ink-ghost: #8994a8;

      /* Akzent & Bedeutungsfarben */
      --accent: #34d399;
      --accent-press: #2bbf8a;
      --on-accent: #04150e;
      --accent-tint: rgba(52, 211, 153, 0.13);
      --accent-tint-2: rgba(52, 211, 153, 0.22);
      --accent-line: rgba(52, 211, 153, 0.5);
      --accent-fill: linear-gradient(180deg, #4de1a7 0%, #2fca90 100%);   /* vollflächiger Akzent: gleicher Farbton, oben eine Spur heller */
      --accent-sheen: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      --accent-bar: linear-gradient(90deg, #34d399, #6ee7b7);             /* Fortschrittsbalken */
      --danger: #ff6b6b;
      --danger-press: #f05555;
      --on-danger: #2b0505;
      --danger-tint: rgba(255, 107, 107, 0.14);
      --warn: #f6b93b;
      --warn-tint: rgba(246, 185, 59, 0.15);
      --drop: #b49cff;
      --drop-tint: rgba(180, 156, 255, 0.2);

      /* Schrift */
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;

      /* Form */
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-full: 999px;

      /* Bewegung */
      --ease-out: cubic-bezier(0.22, 0.8, 0.24, 1);
      --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-pop: cubic-bezier(0.34, 1.4, 0.5, 1);
      --t-fast: 120ms;
      --t-med: 220ms;
      --t-slow: 340ms;

      /* Layout */
      --gutter: 16px;
      --page-max: 640px;
      --tabbar-h: 64px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --kb: 0px;
    }

    @media (max-width: 350px) {
      :root { --gutter: 12px; }
    }

    /* ---------- Reset ---------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 100%;
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      touch-action: manipulation;
      scroll-padding-top: calc(var(--sat) + 76px);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      font-size: 1rem;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, p, figure, fieldset, legend { margin: 0; padding: 0; }
    fieldset { border: 0; min-width: 0; }
    button, input, select, textarea { font: inherit; color: inherit; margin: 0; letter-spacing: inherit; }
    button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; touch-action: manipulation; }
    button:disabled { cursor: default; }
    input, textarea, select { border-radius: 0; }
    input::placeholder, textarea::placeholder { color: var(--ink-ghost); opacity: 1; }
    svg { display: block; }
    [hidden] { display: none !important; }

    /* App-Chrome ist nicht markierbar (wie in nativen Apps) – Eingaben schon */
    .app, .layer { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }

    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    html.is-locked, html.is-locked body { overflow: hidden; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
    }

    .icon {
      width: 1.25em; height: 1.25em; flex: none;
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

    /* ---------- Startbild & Fehlerseite ----------------------------------------- */
    .splash {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: var(--bg); color: var(--accent);
      transition: opacity var(--t-med) ease, visibility 0s linear var(--t-med);
    }
    .splash-mark { width: 56px; height: 56px; }
    .splash-word { color: var(--ink); font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.32em; padding-left: 0.32em; }
    html.is-ready .splash { opacity: 0; visibility: hidden; pointer-events: none; }
    html:not(.is-ready) .app { visibility: hidden; }

    .fatal {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 110; display: grid; place-items: center;
      padding: calc(var(--sat) + 24px) 24px calc(var(--sab) + 24px); background: var(--bg);
    }
    .fatal-box { max-width: 420px; text-align: center; }
    .fatal-box h1 { font-size: 1.375rem; font-weight: 700; margin-bottom: 8px; }
    .fatal-box p { color: var(--ink-2); margin-bottom: 20px; }
    .fatal-box .btn + .btn { margin-top: 10px; }
    .fatal-box code { display: block; margin: 0 0 20px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface); color: var(--ink-2); font-size: 0.75rem; word-break: break-word; text-align: left; }

    /* ---------- App-Rahmen ------------------------------------------------------ */
    .appbar {
      position: sticky; top: 0; z-index: 30;
      padding-top: var(--sat);
      background: rgba(0, 0, 0, 0.9);
      border-bottom: 1px solid transparent;
      transition: border-color var(--t-med) ease;
    }
    @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      .appbar, .tabbar {
        background: rgba(3, 5, 9, 0.72);
        -webkit-backdrop-filter: saturate(170%) blur(18px);
        backdrop-filter: saturate(170%) blur(18px);
      }
    }
    .appbar.is-scrolled { border-bottom-color: var(--line); }

    .appbar-row {
      display: flex; align-items: center; gap: 12px;
      min-height: 56px; max-width: var(--page-max); margin: 0 auto;
      padding: 6px max(var(--gutter), env(safe-area-inset-right)) 6px max(var(--gutter), env(safe-area-inset-left));
    }
    .appbar-titles { flex: 1; min-width: 0; }
    .appbar-title {
      font-size: 1.5rem; font-weight: 750; line-height: 1.15; letter-spacing: -0.022em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .appbar-sub {
      margin-top: 1px; color: var(--ink-2); font-size: 0.8125rem; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .appbar-actions { display: flex; align-items: center; gap: 6px; flex: none; }
    .appbar-extra { max-width: var(--page-max); margin: 0 auto; padding: 2px var(--gutter) 10px; }

    .appbar-progress { height: 3px; background: var(--line); overflow: hidden; }
    .appbar-progress i {
      display: block; height: 100%; background: var(--accent-bar);
      transform-origin: 0 50%; transform: scaleX(0);
      transition: transform var(--t-slow) var(--ease-out);
    }

    .main {
      max-width: var(--page-max); margin: 0 auto;
      padding: 12px max(var(--gutter), env(safe-area-inset-right)) calc(var(--tabbar-h) + var(--sab) + 32px) max(var(--gutter), env(safe-area-inset-left));
    }
    .view { display: flex; flex-direction: column; gap: 16px; }
    .view.is-entering { animation: view-in var(--t-med) var(--ease-out) both; }
    @keyframes view-in { from { opacity: 0; transform: translate3d(0, 6px, 0); } to { opacity: 1; transform: none; } }

    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: grid; grid-template-columns: repeat(5, minmax(0, 116px)); justify-content: center;
      padding: 6px max(6px, env(safe-area-inset-right)) calc(6px + var(--sab)) max(6px, env(safe-area-inset-left));
      background: rgba(6, 8, 12, 0.94);
      border-top: 1px solid var(--line);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      min-height: 52px; color: var(--ink-2);
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.005em; text-align: center; line-height: 1.2;
      transition: color var(--t-fast) ease;
    }
    .tab-ico {
      display: grid; place-items: center; width: 56px; height: 32px; border-radius: var(--r-full);
      transition: background-color var(--t-med) ease, transform var(--t-fast) ease;
    }
    .tab .icon { width: 24px; height: 24px; }
    .tab:active .tab-ico { transform: scale(0.92); }
    .tab.is-active { color: var(--ink); }
    .tab.is-active .tab-ico { background: var(--accent-tint-2); color: var(--accent); }
    .tab:focus-visible { outline-offset: -2px; border-radius: var(--r-md); }

    /* Bildschirmtastatur offen → Tab-Leiste ausblenden (wäre sonst mitten im Bild) */
    html.kb-open .tabbar { visibility: hidden; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important; scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       Bausteine
       ========================================================================== */

    /* ---------- Buttons --------------------------------------------------------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 16px; border-radius: 12px;
      font-size: 0.9375rem; font-weight: 650; line-height: 1.2; text-align: center; white-space: nowrap;
      background: var(--surface-3); color: var(--ink);
      transition: transform var(--t-fast) ease, background-color var(--t-fast) ease, opacity var(--t-fast) ease;
    }
    .btn:active:not(:disabled) { transform: scale(0.975); }
    .btn:disabled { opacity: 0.45; }
    .btn .icon { width: 20px; height: 20px; }

    .btn--primary { background: var(--accent) var(--accent-fill); box-shadow: var(--accent-sheen); color: var(--on-accent); }
    .btn--primary:active:not(:disabled) { background: var(--accent-press); }
    .btn--tonal { background: var(--accent-tint); color: var(--accent); }
    .btn--tonal:active:not(:disabled) { background: var(--accent-tint-2); }
    .btn--soft { background: var(--surface-2); color: var(--ink); }
    .btn--soft:active:not(:disabled) { background: var(--surface-3); }
    .btn--ghost { background: transparent; color: var(--ink-2); }
    .btn--ghost:active:not(:disabled) { background: var(--surface-2); }
    .btn--danger { background: var(--danger); color: var(--on-danger); }
    .btn--danger:active:not(:disabled) { background: var(--danger-press); }
    .btn--danger-soft { background: var(--danger-tint); color: var(--danger); }

    .btn--lg { min-height: 52px; padding: 0 20px; border-radius: 16px; font-size: 1rem; }
    .btn--xl { min-height: 58px; padding: 0 24px; border-radius: 18px; font-size: 1.0625rem; font-weight: 700; }
    .btn--sm { min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 0.8125rem; position: relative; }
    .btn--sm::after { content: ""; position: absolute; top: -4px; right: 0; bottom: -4px; left: 0; } /* Tippfläche bleibt 44 px hoch */
    .btn--block { display: flex; width: 100%; }
    .btn--wrap { white-space: normal; padding-top: 10px; padding-bottom: 10px; }

    .btn-stack { display: flex; flex-direction: column; gap: 8px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row > * { flex: 1; min-width: 0; }

    .icon-btn {
      display: inline-grid; place-items: center; flex: none;
      width: 44px; height: 44px; border-radius: 12px; color: var(--ink-2);
      transition: background-color var(--t-fast) ease, transform var(--t-fast) ease, color var(--t-fast) ease;
    }
    .icon-btn .icon { width: 22px; height: 22px; }
    .icon-btn:active:not(:disabled) { background: var(--surface-3); transform: scale(0.94); }
    .icon-btn:disabled { opacity: 0.3; }
    .icon-btn--soft { background: var(--surface-2); color: var(--ink); }
    .icon-btn--round { border-radius: var(--r-full); }

    .pill-btn {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px; padding: 0 14px; border-radius: var(--r-full);
      background: var(--surface-2); color: var(--ink); font-size: 0.8125rem; font-weight: 650;
      position: relative;
    }
    .pill-btn::after { content: ""; position: absolute; top: -4px; right: -4px; bottom: -4px; left: -4px; }
    .pill-btn:active { background: var(--surface-3); }
    .pill-btn .icon { width: 16px; height: 16px; }
    .pill-btn--accent { background: var(--accent-tint); color: var(--accent); }

    .text-btn {
      display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px;
      color: var(--accent); font-size: 0.875rem; font-weight: 650;
    }
    .text-btn:active { opacity: 0.7; }
    .text-btn--muted { color: var(--ink-2); }
    .text-btn--danger { color: var(--danger); }

    /* ---------- Karten & Überschriften ------------------------------------------ */
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    }
    .card-pad { padding: 16px; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 16px 0; }
    .card-head + .card-body { padding-top: 12px; }
    .card-body { padding: 16px; }
    .card-title { font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
    .card-sub { margin-top: 2px; color: var(--ink-2); font-size: 0.8125rem; }

    /* Kleine Zwischenüberschrift – bewusst ohne Großbuchstaben (besser lesbar) */
    .overline { color: var(--ink-2); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.01em; line-height: 1.35; }
    .section-title { padding: 0 4px; font-size: 0.8125rem; font-weight: 650; color: var(--ink-2); letter-spacing: 0.02em; }
    .muted { color: var(--ink-2); }
    .hint { color: var(--ink-2); font-size: 0.8125rem; line-height: 1.45; }

    /* ---------- Chips & Segmente ------------------------------------------------ */
    .chips {
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
      margin: 0 calc(-1 * var(--gutter)); padding: 6px var(--gutter);
      scroll-padding: 0 var(--gutter); -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      min-height: 38px; padding: 0 14px; border-radius: var(--r-full);
      background: var(--surface-2); color: var(--ink-2); border: 1px solid transparent;
      font-size: 0.875rem; font-weight: 600; white-space: nowrap; position: relative;
      transition: background-color var(--t-fast) ease, color var(--t-fast) ease, border-color var(--t-fast) ease;
    }
    .chip::after { content: ""; position: absolute; top: -4px; right: -2px; bottom: -4px; left: -2px; }
    .chip:active { background: var(--surface-3); }
    .chip .icon { width: 15px; height: 15px; }
    .chip > span:not(.chip-dot) { max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }
    .chip.is-active { background: var(--accent-tint); color: var(--accent); border-color: var(--accent-line); }
    .chip-check { color: var(--accent); }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

    .seg {
      position: relative; display: grid; grid-template-columns: repeat(var(--seg-n, 2), minmax(0, 1fr));
      padding: 3px; border-radius: 12px; background: var(--surface-2);
    }
    .seg::before {
      content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px;
      width: calc((100% - 6px) / var(--seg-n, 2)); border-radius: 9px; background: var(--surface-4);
      transform: translate3d(calc(var(--seg-i, 0) * 100%), 0, 0);
      transition: transform var(--t-med) var(--ease-out);
    }
    .seg-btn {
      position: relative; min-height: 44px; padding: 0 8px; border-radius: 9px;
      color: var(--ink-2); font-size: 0.875rem; font-weight: 600; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color var(--t-fast) ease;
    }
    .seg-btn.is-active { color: var(--ink); }
    .seg--sm .seg-btn { min-height: 36px; font-size: 0.8125rem; overflow: visible; } /* sichtbar, damit die vergrößerte Tippfläche (::after) nicht abgeschnitten wird */
    .seg--sm .seg-btn::after { content: ""; position: absolute; top: -6px; right: 0; bottom: -6px; left: 0; } /* Tippfläche 48 px */
    .seg--sm { border-radius: 10px; }
    .seg--sm::before { border-radius: 7px; }

    /* ---------- Formularfelder --------------------------------------------------- */
    .form { display: flex; flex-direction: column; gap: 16px; }
    .form-intro { color: var(--ink-2); font-size: 0.9375rem; line-height: 1.45; }
    .form-error { color: var(--danger); font-size: 0.875rem; font-weight: 600; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { color: var(--ink-2); font-size: 0.8125rem; font-weight: 600; }
    .field-hint { color: var(--ink-3); font-size: 0.8125rem; line-height: 1.4; }

    .input {
      width: 100%; min-height: 50px; padding: 0 14px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--field-line); color: var(--ink);
      font-size: 1rem; line-height: 1.3;
      -webkit-appearance: none; appearance: none;
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, background-color var(--t-fast) ease;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint-2); }
    .input--area { padding: 12px 14px; min-height: 140px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8125rem; line-height: 1.5; }
    textarea.input--area { font-size: 1rem; } /* iOS-Zoom vermeiden; Monospace wirkt dennoch kompakt */

    .select-wrap { position: relative; display: flex; align-items: center; }
    .select-wrap select { padding-right: 40px; text-overflow: ellipsis; cursor: pointer; }
    .select-chevron { position: absolute; right: 12px; width: 18px; height: 18px; color: var(--ink-2); pointer-events: none; }
    select option { background: var(--surface-2); color: var(--ink); }

    .stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
    .stepper-btn {
      display: grid; place-items: center; height: 50px; border-radius: 12px; background: var(--surface-3); color: var(--ink);
      transition: background-color var(--t-fast) ease, transform var(--t-fast) ease;
    }
    .stepper-btn:active { background: var(--surface-4); transform: scale(0.95); }
    .stepper-input {
      width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--field-line); background: var(--surface-2);
      text-align: center; font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums;
      -webkit-appearance: none; appearance: none;
    }
    .stepper-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint-2); }

    .choice { display: grid; gap: 8px; }
    .choice-opt { position: relative; display: block; cursor: pointer; }
    .choice-opt input { position: absolute; opacity: 0; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .choice-opt span {
      display: flex; flex-direction: column; gap: 2px; min-height: 52px; justify-content: center;
      padding: 10px 44px 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2);
      transition: border-color var(--t-fast) ease, background-color var(--t-fast) ease;
    }
    .choice-opt b { font-size: 0.9375rem; font-weight: 650; }
    .choice-opt small { color: var(--ink-2); font-size: 0.8125rem; line-height: 1.35; }
    .choice-opt span::after {
      content: ""; position: absolute; right: 14px; top: 50%; width: 22px; height: 22px; margin-top: -11px;
      border-radius: 50%; border: 2px solid var(--ink-3); transition: border-color var(--t-fast) ease, border-width var(--t-fast) ease;
    }
    .choice-opt input:checked + span { border-color: var(--accent-line); background: var(--accent-tint); }
    .choice-opt input:checked + span::after { border-color: var(--accent); border-width: 7px; }
    .choice-opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    .switch-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px;
      padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2); cursor: pointer;
    }
    .switch-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .switch-text b { font-size: 0.9375rem; font-weight: 650; }
    .switch-text small { color: var(--ink-2); font-size: 0.8125rem; line-height: 1.35; }
    .switch {
      -webkit-appearance: none; appearance: none; flex: none; position: relative;
      width: 52px; height: 32px; border-radius: 16px; background: var(--surface-4); cursor: pointer;
      transition: background-color var(--t-med) ease;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff;
      transition: transform var(--t-med) var(--ease-out);
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(20px); }

    /* ---------- Hinweise, leere Zustände, Kennzahlen ----------------------------- */
    .notice {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md);
      background: var(--surface); border: 1px solid var(--line); font-size: 0.875rem; line-height: 1.4;
    }
    .notice > .icon { width: 22px; height: 22px; color: var(--ink-2); }
    .notice-text { flex: 1; min-width: 0; }
    .notice-text b { display: block; font-weight: 650; color: var(--ink); }
    .notice-text span { color: var(--ink-2); }
    .notice--success { background: var(--accent-tint); border-color: transparent; }
    .notice--success > .icon { color: var(--accent); }
    .notice--warn { background: var(--warn-tint); border-color: transparent; }
    .notice--warn > .icon { color: var(--warn); }
    .notice--danger { background: var(--danger-tint); border-color: transparent; }
    .notice--danger > .icon { color: var(--danger); }

    .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 36px 20px; }
    .empty-icon { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: var(--surface-2); color: var(--ink-2); margin-bottom: 6px; }
    .empty-icon .icon { width: 26px; height: 26px; }
    .empty-title { font-size: 1.0625rem; font-weight: 700; }
    .empty-text { max-width: 34ch; color: var(--ink-2); font-size: 0.9375rem; line-height: 1.45; }
    .empty .btn { margin-top: 10px; }

    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tiles--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 520px) { .tiles--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .tile { padding: 12px; border-radius: var(--r-md); background: var(--surface-2); min-width: 0; }
    .tile-label { color: var(--ink-2); font-size: 0.75rem; font-weight: 600; line-height: 1.3; }
    .tile-value { margin-top: 4px; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-value small { margin-left: 2px; color: var(--ink-2); font-size: 0.75rem; font-weight: 600; letter-spacing: 0; }
    .tile-note { margin-top: 2px; color: var(--ink-2); font-size: 0.75rem; }
    .tile-value.is-up { color: var(--accent); }
    .tile-value.is-down { color: var(--danger); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 8px; border-radius: var(--r-full);
      background: var(--surface-3); color: var(--ink-2); font-size: 0.75rem; font-weight: 650; letter-spacing: 0.01em; white-space: nowrap;
    }
    .badge--accent { background: var(--accent-tint); color: var(--accent); }
    .badge--warn { background: var(--warn-tint); color: var(--warn); }
    .badge--drop { background: var(--drop-tint); color: var(--drop); }

    /* ---------- Listenzeilen (Einstellungs-Stil) --------------------------------- */
    .group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
    .row {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 16px; text-align: left;
      transition: background-color var(--t-fast) ease;
    }
    button.row:active, label.row:active { background: var(--surface-2); }
    button.row:disabled { opacity: 0.4; }
    .row + .row { border-top: 1px solid var(--line); }
    .row-icon { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); color: var(--ink); }
    .row-icon .icon { width: 20px; height: 20px; }
    .row-icon--accent { background: var(--accent-tint); color: var(--accent); }
    .row-icon--danger { background: var(--danger-tint); color: var(--danger); }
    .row-icon--warn { background: var(--warn-tint); color: var(--warn); }
    .row-text { flex: 1; min-width: 0; }
    .row-title { display: block; font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .row-sub { display: block; margin-top: 1px; color: var(--ink-2); font-size: 0.8125rem; line-height: 1.35; }
    .row-end { flex: none; color: var(--ink-3); display: flex; align-items: center; gap: 6px; font-size: 0.875rem; }
    .row-end .icon { width: 18px; height: 18px; }
    .row.is-danger .row-title { color: var(--danger); }

    /* ---------- Sheets & Dialoge -------------------------------------------------- */
    .layer { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
    .layer-backdrop {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.62); opacity: 0;
      transition: opacity var(--t-med) ease;
    }
    .layer.is-open .layer-backdrop { opacity: 1; }
    .panel {
      position: relative; display: flex; flex-direction: column; width: 100%; max-width: 560px;
      max-height: calc(100vh - var(--sat) - 20px - var(--kb));
      max-height: calc(var(--vvh, 100dvh) - var(--sat) - 20px);
      margin-bottom: var(--kb);
      padding-bottom: var(--sab);
      background: var(--sheet); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 28px 28px 0 0;
      box-shadow: 0 -18px 48px rgba(0, 0, 0, 0.55);
      transform: translate3d(0, 104%, 0);
      transition: transform var(--t-slow) var(--ease-sheet);
      will-change: transform;
    }
    html.kb-open .panel { padding-bottom: 0; }
    .layer.is-open .panel { transform: none; }
    .layer.is-closing .panel { transition-duration: var(--t-med); transition-timing-function: cubic-bezier(0.4, 0, 1, 1); }
    .panel.is-dragging { transition: none; }
    .panel-grab { display: grid; place-items: center; height: 22px; padding-top: 6px; touch-action: none; cursor: grab; flex: none; }
    .panel-grab i { display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--surface-4); }
    .panel-head { display: flex; align-items: center; gap: 12px; padding: 6px 12px 10px 20px; touch-action: none; flex: none; }
    .panel-titles { flex: 1; min-width: 0; }
    .panel-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; }
    .panel-sub { margin-top: 2px; color: var(--ink-2); font-size: 0.875rem; line-height: 1.35; }
    .panel-body {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      padding: 6px 20px 20px;
    }
    .panel-foot { flex: none; padding: 12px 20px 16px; border-top: 1px solid var(--line); }

    @media (min-width: 640px) {
      .layer { align-items: center; padding: 24px; }
      .panel {
        border-radius: 28px; border-bottom: 1px solid var(--line-2); margin-bottom: 0; padding-bottom: 0;
        max-height: min(760px, calc(100dvh - 48px));
        transform: translate3d(0, 16px, 0) scale(0.98); opacity: 0;
        transition: transform var(--t-med) var(--ease-out), opacity var(--t-med) ease;
      }
      .layer.is-open .panel { opacity: 1; }
      .panel-grab { display: none; }
      .panel-head { padding-top: 18px; }
    }

    .confirm-icon { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 14px; border-radius: 16px; background: var(--surface-3); color: var(--ink); }
    .confirm-icon .icon { width: 26px; height: 26px; }
    .confirm-icon.is-danger { background: var(--danger-tint); color: var(--danger); }
    .confirm-msg { margin-bottom: 20px; color: var(--ink-2); font-size: 0.9375rem; line-height: 1.5; }
    .confirm-msg b, .confirm-msg strong { color: var(--ink); font-weight: 650; }
    .confirm-list { display: grid; gap: 6px; margin: -8px 0 20px; padding: 0; list-style: none; color: var(--ink-2); font-size: 0.9375rem; }
    .confirm-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
    .confirm-list b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }

    .menu-list { display: grid; gap: 2px; margin: 0 -8px; }
    .menu-item {
      display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 8px 12px; border-radius: 12px;
      font-size: 1rem; font-weight: 550; color: var(--ink); text-align: left;
      transition: background-color var(--t-fast) ease;
    }
    .menu-item:active:not(:disabled) { background: var(--surface-3); }
    .menu-item:disabled { opacity: 0.35; }
    .menu-icon { width: 22px; height: 22px; color: var(--ink-2); }
    .menu-label { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .menu-check { flex: none; width: 20px; height: 20px; color: var(--accent); stroke-width: 2.6; }
    .menu-label small { color: var(--ink-2); font-size: 0.8125rem; font-weight: 400; }
    .menu-item.is-danger, .menu-item.is-danger .menu-icon { color: var(--danger); }
    .menu-item.is-selected { background: var(--accent-tint); }
    .menu-item.is-selected .menu-icon { color: var(--accent); }
    .menu-sep { height: 1px; margin: 6px 12px; background: var(--line-2); }
    .menu-caption { padding: 10px 12px 4px; }

    /* Auswahl-Listen in Sheets (Übung wählen …) */
    .pick-group + .pick-group { margin-top: 16px; }
    .pick-group > .overline { padding: 0 4px 6px; }
    .pick-list { display: grid; gap: 6px; }
    .pick-item {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 14px; border-radius: 12px;
      background: var(--surface-2); text-align: left; transition: background-color var(--t-fast) ease;
    }
    .pick-item:active { background: var(--surface-3); }
    .pick-main { flex: 1; min-width: 0; font-size: 0.9375rem; font-weight: 600; line-height: 1.3; }
    .pick-main small { display: block; color: var(--ink-2); font-size: 0.8125rem; font-weight: 400; }
    .pick-end { flex: none; color: var(--ink-3); font-size: 0.8125rem; display: flex; align-items: center; gap: 6px; }
    .pick-item.is-current { background: var(--accent-tint); }
    .pick-item.is-current .pick-end { color: var(--accent); }

    /* ---------- Toast ------------------------------------------------------------ */
    .toast-root {
      position: fixed; left: 0; right: 0; z-index: 90; display: flex; justify-content: center; pointer-events: none;
      bottom: calc(var(--tabbar-h) + var(--sab) + 12px); padding: 0 16px;
    }
    html.kb-open .toast-root { bottom: calc(var(--kb) + 12px); }
    /* Ist ein Sheet offen, erscheint der Toast oben – unten lägen die Buttons des Sheets */
    html.is-locked .toast-root { bottom: auto; top: calc(var(--sat) + 12px); }
    .toast {
      pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 520px; min-height: 50px;
      padding: 8px 14px; border-radius: 16px; background: var(--raised); border: 1px solid var(--line-2);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      font-size: 0.9375rem; font-weight: 550; line-height: 1.35;
      animation: toast-in var(--t-med) var(--ease-out) both;
    }
    .toast.is-leaving { opacity: 0; transform: translate3d(0, 6px, 0); transition: opacity 180ms ease, transform 180ms ease; }
    .toast-icon { width: 20px; height: 20px; color: var(--ink-2); }
    .toast--success .toast-icon { color: var(--accent); }
    .toast--error .toast-icon { color: var(--danger); }
    .toast--warn .toast-icon { color: var(--warn); }
    /* höchstens drei Zeilen – ein Hinweis darf die Bedienung nie großflächig verdecken (z. B. bei sehr langen Namen) */
    .toast-msg { flex: 1; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
    .toast-action { flex: none; min-height: 44px; margin: 0 -6px 0 2px; padding: 0 10px; border-radius: 10px; color: var(--accent); font-weight: 700; }
    /* Längere Hinweise mit Aktion: auf dem Handy bekommt der Text die volle Breite, die Aktion steht darunter –
       sonst bliebe neben „Rückgängig“ nur eine schmale Spalte und das Ende des Hinweises fiele weg. */
    @media (max-width: 480px) {
      .toast--stack { flex-wrap: wrap; row-gap: 0; }
      .toast--stack .toast-msg { flex: 1 1 calc(100% - 30px); }
      .toast--stack .toast-action { margin-left: auto; }
    }
    .toast-action:active { background: var(--surface-4); }
    @keyframes toast-in { from { opacity: 0; transform: translate3d(0, 10px, 0) scale(0.97); } to { opacity: 1; transform: none; } }
    html.is-locked .toast { animation-name: toast-in-top; }
    @keyframes toast-in-top { from { opacity: 0; transform: translate3d(0, -10px, 0) scale(0.97); } to { opacity: 1; transform: none; } }

    /* Lange Namen ohne Leerzeichen (z. B. eingefügte Texte) umbrechen statt über den Rand zu laufen.
       Einzeilige Elemente mit Auslassungspunkten (white-space: nowrap) sind davon nicht betroffen. */
    .row-title, .row-sub, .log-title, .log-sub, .log-entry-name, .log-entry-mach, .panel-title, .panel-sub, .confirm-msg, .toast-msg,
    .menu-label, .pick-main, .notice-text, .card-sub, .rest-title, .empty-title, .empty-text,
    .plan-item-sub, .mach-note, .legend-name, .hint, .field-label, .confirm-list { overflow-wrap: break-word; overflow-wrap: anywhere; }
    /* Hier nur im Notfall brechen (ein einzelnes Wort ist länger als die Zeile) – nicht mitten in normalen Wörtern */
    .card-title, .day-log-main { overflow-wrap: break-word; }

    /* ==========================================================================
       Ansichten
       ========================================================================== */

    /* ---------- Training: Wochenleiste -------------------------------------------- */
    .weeknav { display: flex; flex-direction: column; gap: 8px; }
    .weekbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
    .weekbar-label { display: flex; align-items: center; gap: 8px; padding-left: 4px; min-width: 0; flex-wrap: wrap; }
    .weekbar-label b { font-size: 1rem; font-weight: 700; white-space: nowrap; }
    .weekbar-label span { color: var(--ink-2); font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .workout-timer {
      display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 0 10px;
      border-radius: var(--r-full); background: var(--surface-2); border: 1px solid var(--line-2);
      color: var(--ink-2); font-size: 0.8125rem; font-weight: 700; line-height: 1;
      transition: background-color var(--t-fast) ease, color var(--t-fast) ease, border-color var(--t-fast) ease, transform var(--t-fast) ease;
    }
    .workout-timer:active { transform: scale(0.95); }
    .workout-timer.is-running { background: var(--accent-tint); border-color: var(--accent-line); color: var(--accent); }
    .workout-timer.is-paused { background: var(--warn-tint); border-color: transparent; color: var(--warn); }
    .workout-timer.is-saved { background: var(--surface-2); border-color: var(--line-2); color: var(--ink); }
    .workout-timer .icon { width: 13px; height: 13px; color: var(--ink-2); }
    .workout-timer-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .workout-timer.is-running .workout-timer-dot { animation: timer-pulse 1.4s ease-in-out infinite; }
    @keyframes timer-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .weekbar-nav { display: flex; align-items: center; flex: none; margin-right: -8px; }

    .datepick { position: relative; overflow: hidden; }
    .datepick-input {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
      font-size: 1rem; /* kein iOS-Zoom */
      -webkit-appearance: none; appearance: none; border: 0; padding: 0; background: transparent;
    }
    .datepick-input::-webkit-calendar-picker-indicator { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .datepick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

    .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
    .day {
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px; border-radius: var(--r-md);
      min-height: 72px; color: var(--ink);
      transition: background-color var(--t-fast) ease;
    }
    .day:active { background: var(--surface-2); }
    .day-wd { color: var(--ink-2); font-size: 0.75rem; font-weight: 600; line-height: 1.2; }
    .day-num {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
      font-size: 1.0625rem; font-weight: 650; line-height: 1;
      transition: background-color var(--t-med) ease, color var(--t-med) ease, transform var(--t-fast) ease;
    }
    .day:active .day-num { transform: scale(0.94); }
    .day.is-today .day-wd { color: var(--accent); }
    .day.is-today .day-num { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent-line); }
    .day.is-selected .day-num { background: var(--accent) var(--accent-fill); color: var(--on-accent); box-shadow: var(--accent-sheen); font-weight: 750; }
    .day-mark { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
    .day-mark.is-workout { background: var(--accent); }
    .day-mark.is-rest { background: var(--ink-3); }
    .day-mark.is-draft { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-2); }

    /* ---------- Training: Kopf der Einheit ----------------------------------------- */
    .session-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 4px 4px 0; }
    .session-titles { min-width: 0; }
    .session-title {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px;
      font-size: 1.75rem; font-weight: 750; letter-spacing: -0.025em; line-height: 1.12;
    }
    .session-title > span:first-child { overflow-wrap: break-word; overflow-wrap: anywhere; }
    .session-title .badge { letter-spacing: 0.01em; }
    .session-title .badge .icon { width: 12px; height: 12px; stroke-width: 3; }
    .session-figure { flex: none; display: flex; align-items: baseline; gap: 4px; text-align: right; white-space: nowrap; }
    .session-figure b { font-size: 1.75rem; font-weight: 750; letter-spacing: -0.025em; line-height: 1.12; color: var(--accent); }
    .session-figure span { color: var(--ink-2); font-size: 1rem; font-weight: 600; }
    .session-figure small { margin-left: 2px; color: var(--ink-2); font-size: 0.75rem; font-weight: 600; }

    /* ---------- Training: Übungskarte ---------------------------------------------- */
    .ex-list { display: flex; flex-direction: column; gap: 12px; }
    .ex-card { scroll-margin-top: calc(var(--sat) + 76px); transition: border-color var(--t-med) ease, background-color var(--t-med) ease; }
    .ex-card[data-enter] { animation: card-in var(--t-slow) var(--ease-out) both; }
    @keyframes card-in { from { opacity: 0; transform: translate3d(0, 10px, 0); } to { opacity: 1; transform: none; } }
    .ex-card.is-done { border-color: var(--accent-line); }

    .ex-head { display: flex; align-items: center; gap: 2px; padding: 4px 6px 4px 0; }
    .ex-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 4px 10px 16px; border-radius: var(--r-md); }
    .ex-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .ex-meta { display: flex; align-items: center; gap: 8px; }
    .ex-name { font-size: 1.0625rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; overflow-wrap: break-word; overflow-wrap: anywhere; }
    .ex-sub { display: none; color: var(--ink-2); font-size: 0.8125rem; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ex-card.is-collapsed .ex-sub { display: block; }
    .ex-count {
      flex: none; display: inline-flex; align-items: center; gap: 3px; min-height: 20px; padding: 0 7px; border-radius: var(--r-full);
      background: var(--surface-3); color: var(--ink-2); font-size: 0.75rem; font-weight: 700;
    }
    .ex-count .icon { width: 11px; height: 11px; stroke-width: 3.2; }
    .ex-count.is-done { background: var(--accent-tint-2); color: var(--accent); }
    .ex-chevron { width: 18px; height: 18px; color: var(--ink-3); transition: transform var(--t-med) var(--ease-out); }
    .ex-card.is-collapsed .ex-chevron { transform: rotate(-90deg); }

    /* Auf-/Zuklappen ohne feste Höhen: Grid-Zeile 1fr ↔ 0fr */
    .ex-body-wrap, .log-body-wrap, .plan-body-wrap, .lib-body-wrap {
      display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--t-slow) var(--ease-out);
    }
    .ex-body-wrap > *, .log-body-wrap > *, .plan-body-wrap > *, .lib-body-wrap > * { min-height: 0; overflow: hidden; }
    .ex-card.is-collapsed .ex-body-wrap { grid-template-rows: 0fr; }
    .ex-body { display: flex; flex-direction: column; gap: 12px; }
    .ex-body > :first-child { margin-top: 5px; } /* 5 px: der Fokusring (2 px Abstand + 2 px Linie) wird sonst oben abgeschnitten */
    .ex-body > :last-child { margin-bottom: 12px; }
    .ex-body > * { margin-left: 12px; margin-right: 12px; }

    .machine { display: flex; flex-direction: column; gap: 6px; }
    .machine-row { display: flex; align-items: stretch; gap: 8px; }
    .machine-select { flex: 1; min-width: 0; }
    .machine-select .input { min-height: 48px; padding-left: 42px; padding-right: 38px; font-size: 1rem; font-weight: 600; background: var(--surface-2); border-color: transparent; }
    /* Einheit des Geräts: ein Tipp wechselt kg ↔ Pin */
    .unit-toggle {
      flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-width: 68px; min-height: 48px; padding: 0 12px; border-radius: 12px;
      background: var(--surface-2); color: var(--ink); font-size: 0.9375rem; font-weight: 700; line-height: 1;
      transition: background-color var(--t-fast) ease, transform var(--t-fast) ease;
    }
    .unit-toggle .icon { width: 16px; height: 16px; color: var(--ink-3); }
    button.unit-toggle:active { background: var(--surface-3); transform: scale(0.96); }
    .unit-toggle.is-static { color: var(--ink-2); }
    .machine-icon { position: absolute; left: 13px; width: 18px; height: 18px; color: var(--ink-2); pointer-events: none; }
    .machine-note {
      display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 6px; border-radius: 10px;
      color: var(--ink-2); font-size: 0.875rem; line-height: 1.35; text-align: left; position: relative;
    }
    .machine-note::after { content: ""; position: absolute; top: -4px; right: 0; bottom: -4px; left: 0; }
    .machine-note:active { background: var(--surface-2); }
    .machine-note .icon { width: 16px; height: 16px; color: var(--warn); }
    .machine-note span { flex: 1; min-width: 0; overflow-wrap: break-word; overflow-wrap: anywhere; color: var(--ink); }
    .machine-note.is-empty span { color: var(--ink-3); }
    .machine-note.is-empty .icon { color: var(--ink-3); }

    /* Satz-Tabelle: Marke · Last · Wdh. · Partials · Haken (der Haken ist das größte Ziel) */
    .set-table { --chip-w: 44px; --set-cols: var(--chip-w) minmax(0, 1.25fr) minmax(0, 1fr) 48px 54px; --set-gap: 8px; }
    @media (max-width: 350px) { .set-table { --chip-w: 38px; --set-cols: var(--chip-w) minmax(0, 1.25fr) minmax(0, 1fr) 44px 50px; --set-gap: 6px; } }
    .set-head {
      display: grid; grid-template-columns: var(--set-cols); gap: var(--set-gap); padding: 0 4px 4px;
      color: var(--ink-2); font-size: 0.75rem; font-weight: 600; text-align: center;
    }
    .set-head .icon { width: 14px; height: 14px; margin: 0 auto; stroke-width: 2.5; }
    .set-rows { display: flex; flex-direction: column; gap: 4px; }
    .set { padding: 4px; border-radius: 14px; transition: background-color var(--t-med) ease; }
    .set[data-enter] { animation: set-in var(--t-med) var(--ease-out) both; }
    @keyframes set-in { from { opacity: 0; transform: translate3d(0, -6px, 0); } to { opacity: 1; transform: none; } }
    .set.is-done { background: var(--accent-tint); }
    .set.is-shaking { animation: shake 320ms ease; }
    @keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } 100% { transform: none; } }
    .set-row, .drop-row { display: grid; grid-template-columns: var(--set-cols); gap: var(--set-gap); align-items: center; }

    .set-chip {
      display: grid; place-items: center; height: 48px; border-radius: 12px; background: var(--surface-3); color: var(--ink);
      font-size: 0.9375rem; font-weight: 700; font-variant-numeric: tabular-nums;
      transition: transform var(--t-fast) ease, background-color var(--t-fast) ease;
    }
    .set-chip:active { transform: scale(0.94); background: var(--surface-4); }
    .set--warmup .set-chip { background: var(--warn-tint); color: var(--warn); }
    .set--dropset .set-chip { background: var(--drop-tint); color: var(--drop); }

    .set-input {
      width: 100%; height: 48px; padding: 0 4px; border-radius: 12px; border: 1px solid var(--field-line); background: var(--surface-2);
      color: var(--ink); text-align: center; font-size: 1.125rem; font-weight: 650; line-height: 1;
      -webkit-appearance: none; appearance: none;
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, background-color var(--t-med) ease;
    }
    .set-input::placeholder { color: var(--ink-ghost); font-weight: 500; }
    .set-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint-2); background: var(--surface-2); }
    .set.is-done .set-input:not(:focus) { background: transparent; border-color: transparent; }

    .set-partial {
      height: 48px; border-radius: 12px; border: 1px solid transparent; background: var(--surface-2); color: var(--ink-3);
      font-size: 0.9375rem; font-weight: 650; text-align: center;
      transition: transform var(--t-fast) ease, background-color var(--t-fast) ease, color var(--t-fast) ease;
    }
    .set-partial:active { transform: scale(0.94); }
    .set-partial.is-on { background: var(--surface-4); color: var(--ink); }
    .set-partial.is-ghost { background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-ghost); }
    .set.is-done .set-partial.is-zero { background: transparent; }

    .set-check {
      display: grid; place-items: center; height: 48px; border-radius: 14px; background: var(--surface-3); color: var(--ink-3);
      transition: background-color var(--t-med) ease, color var(--t-med) ease, transform var(--t-fast) ease;
    }
    .set-check .icon { width: 24px; height: 24px; stroke-width: 2.6; }
    .set-check:active { transform: scale(0.92); }
    .set.is-done .set-check { background: var(--accent) var(--accent-fill); box-shadow: var(--accent-sheen); color: var(--on-accent); animation: check-pop 300ms var(--ease-pop); }
    @keyframes check-pop { 0% { transform: scale(0.82); } 100% { transform: scale(1); } }

    .drops { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .drop-label { display: grid; place-items: center; color: var(--drop); }
    .drop-label .icon { width: 18px; height: 18px; }
    .drop-row .set-input { height: 44px; font-size: 1rem; }
    .drop-remove { width: 100%; height: 44px; }
    .drop-add, .add-set {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 12px;
      font-size: 0.875rem; font-weight: 650; transition: background-color var(--t-fast) ease;
    }
    .drop-add { align-self: flex-start; margin-left: calc(var(--chip-w) + var(--set-gap)); padding: 0 12px; color: var(--drop); }
    .drop-add:active { background: var(--drop-tint); }
    .add-set { width: calc(100% - 24px); color: var(--ink-2); background: transparent; border: 1px dashed var(--line-2); }
    .add-set:active { background: var(--surface-2); }
    .drop-add .icon, .add-set .icon { width: 16px; height: 16px; }

    /* Pausentag */
    .rest-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 36px 24px; }
    .rest-icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 22px; background: var(--surface-2); color: var(--ink-2); margin-bottom: 4px; }
    .rest-icon .icon { width: 30px; height: 30px; }
    .rest-card.is-done { border-color: var(--accent-line); }
    .rest-card.is-done .rest-icon { background: var(--accent-tint-2); color: var(--accent); }
    .rest-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.015em; }
    .rest-text { max-width: 34ch; color: var(--ink-2); font-size: 0.9375rem; line-height: 1.5; margin-bottom: 8px; }

    .workout-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .workout-more { align-self: center; }

    /* ---------- Statistik: Wochenvolumen ------------------------------------------- */
    .week-total { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
    .week-total b { color: var(--accent); font-size: 2rem; font-weight: 750; letter-spacing: -0.03em; line-height: 1; }
    .week-total span { color: var(--ink-2); font-size: 0.9375rem; }
    .meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 350px) { .meters { grid-template-columns: minmax(0, 1fr); } }
    .meter {
      display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); text-align: left;
      transition: background-color var(--t-fast) ease, transform var(--t-fast) ease;
    }
    .meter:active { background: var(--surface-3); transform: scale(0.985); }
    .meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .meter-name { font-size: 0.9375rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meter-val { flex: none; display: inline-flex; align-items: center; font-size: 0.9375rem; font-weight: 700; }
    .meter-val i { font-style: normal; color: var(--ink-2); font-weight: 600; }
    .meter-val .icon { width: 14px; height: 14px; margin-right: 4px; color: var(--accent); stroke-width: 3; }
    .meter-track { display: block; height: 6px; border-radius: 3px; background: var(--accent-tint-2); overflow: hidden; }
    .meter-track i { display: block; height: 100%; border-radius: 3px; background: var(--accent-bar); transform-origin: 0 50%; transition: transform var(--t-slow) var(--ease-out); }
    .meter.is-empty .meter-track { background: var(--surface-4); }

    /* ---------- Statistik: Kalender ------------------------------------------------- */
    .cal-head { align-items: center; padding: 8px 8px 0; }
    .cal-title { flex: 1; text-align: center; }
    .cal-wd { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 16px; color: var(--ink-2); font-size: 0.75rem; font-weight: 600; text-align: center; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
    .cal-day {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      aspect-ratio: 1 / 1.08; min-height: 44px; border-radius: 12px; color: var(--ink);
      font-size: 0.9375rem; font-weight: 600;
      transition: transform var(--t-fast) ease, background-color var(--t-fast) ease;
    }
    .cal-day:active { transform: scale(0.94); }
    .cal-mark { display: grid; place-items: center; height: 12px; }
    .cal-mark .icon { width: 12px; height: 12px; stroke-width: 2.4; }
    .cal-mark i { display: block; width: 5px; height: 5px; border-radius: 50%; }
    /* Kürzel des Trainingstags unter der Zahl („Push“, „Beine“ …) – zu lange Kürzel werden am Zellenrand abgeschnitten */
    .cal-label {
      display: block; min-width: 0; max-width: 100%; padding: 0 1px; overflow: hidden; white-space: nowrap;
      font-size: 0.625rem; font-weight: 700; line-height: 12px; letter-spacing: -0.01em; text-align: center;
    }
    .cal-day.is-workout { background: var(--accent-tint-2); color: var(--accent); font-weight: 750; }
    .cal-day.is-rest { background: var(--surface-2); color: var(--ink-2); }
    .cal-day.is-missed { color: var(--ink-2); }
    .cal-day.is-missed .cal-mark i { background: var(--danger); }
    .cal-day.is-future, .cal-day.is-none { color: var(--ink-3); }
    .cal-day.is-today { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
    .cal-day.is-today.is-workout { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
    .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; color: var(--ink-2); font-size: 0.8125rem; }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .lg { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 5px; }
    .lg--workout { background: var(--accent-tint-2); box-shadow: inset 0 0 0 1.5px var(--accent-line); }
    .lg--rest { background: var(--surface-3); color: var(--ink-2); }
    .lg--rest .icon { width: 10px; height: 10px; stroke-width: 2.6; }
    .lg--missed::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }

    .day-sheet-logs { display: grid; gap: 8px; margin-bottom: 20px; }
    .day-log { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); }
    .day-log-main { flex: 1; min-width: 0; }
    .day-log-main b { display: block; font-size: 0.9375rem; font-weight: 650; }
    .day-log-main span { color: var(--ink-2); font-size: 0.8125rem; }
    .sheet-section + .sheet-section { margin-top: 20px; }
    .sheet-section > .overline { margin-bottom: 8px; padding: 0 4px; }

    /* ---------- Statistik: Fortschritt ---------------------------------------------- */
    .chart-card .card-head { align-items: center; }
    .chart-card .seg { min-width: 156px; }
    @media (max-width: 350px) {
      .chart-card .card-head { flex-wrap: wrap; }
      .chart-card .seg { flex: 1 1 100%; }
      .day-log { flex-wrap: wrap; }
      .day-log-main { flex: 1 1 calc(100% - 60px); }
      .day-log > .btn:first-of-type, .day-log > .icon-btn:first-of-type { margin-left: auto; }
    }
    .chart { position: relative; width: 100%; touch-action: pan-y; -webkit-user-select: none; user-select: none; outline: none; }
    .chart svg { display: block; width: 100%; overflow: visible; }
    .chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
    .chart-grid { stroke: var(--viz-grid); stroke-width: 1; shape-rendering: crispEdges; }
    .chart-axis { stroke: var(--viz-axis); stroke-width: 1; shape-rendering: crispEdges; }
    .chart-tick { fill: var(--viz-muted); font-size: 11px; font-variant-numeric: tabular-nums; font-family: var(--font); }
    .chart-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chart-dot { stroke: var(--surface); stroke-width: 2; }
    .chart-cross { stroke: var(--viz-axis); stroke-width: 1; }
    .chart-endlabel { fill: var(--ink); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font); }
    .chart-tip {
      position: absolute; top: 0; left: 0; z-index: 2; min-width: 132px; max-width: 220px; padding: 8px 10px; border-radius: 12px;
      background: var(--raised); border: 1px solid var(--line-2); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      font-size: 0.8125rem; line-height: 1.35; pointer-events: none; opacity: 0; transition: opacity var(--t-fast) ease;
    }
    .chart-tip.is-on { opacity: 1; }
    .chart-tip-date { color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
    .chart-tip-row { display: flex; align-items: center; gap: 8px; }
    .chart-tip-key { flex: none; width: 12px; height: 3px; border-radius: 2px; }
    .chart-tip-val { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chart-tip-name { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chart-tip-extra { margin-top: 4px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .chart-empty { display: grid; place-items: center; min-height: 200px; padding: 20px; text-align: center; color: var(--ink-2); font-size: 0.9375rem; }

    .legend { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; margin-top: 12px; }
    .legend-row { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 0; font-size: 0.875rem; }
    .legend-row + .legend-row { border-top: 1px solid var(--line); }
    .legend-key { flex: none; width: 14px; height: 3px; border-radius: 2px; }
    .legend-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .legend-val { flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .legend-val b { color: var(--ink); font-weight: 700; }
    .delta-up { color: var(--accent); font-weight: 700; }
    .delta-down { color: var(--danger); font-weight: 700; }

    .hist-rows { display: grid; }
    .hist-rows-more { margin-top: 12px; }
    .hist-row { padding: 12px 0; }
    .hist-row + .hist-row { border-top: 1px solid var(--line); }
    .hist-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .hist-row-date { font-size: 0.9375rem; font-weight: 650; }
    .hist-row-meta { color: var(--ink-2); font-size: 0.8125rem; font-variant-numeric: tabular-nums; text-align: right; }

    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 9px;
      background: var(--surface-2); color: var(--ink); font-size: 0.8125rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .card .pill { background: var(--surface-3); }
    .pill i { font-style: normal; font-weight: 700; font-size: 0.75rem; color: var(--ink-2); }
    .pill--warmup i { color: var(--warn); }
    .pill--dropset i { color: var(--drop); }
    .pill small { color: var(--ink-2); font-size: inherit; font-weight: 500; }

    /* ---------- Verlauf --------------------------------------------------------------- */
    .month-head {
      position: sticky; top: calc(var(--sat) + 56px); z-index: 5; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin: 0 calc(-1 * var(--gutter)); padding: 10px calc(var(--gutter) + 4px) 8px; background: rgba(0, 0, 0, 0.92);
      font-size: 0.9375rem; font-weight: 700;
    }
    .month-head span:last-child { color: var(--ink-2); font-size: 0.8125rem; font-weight: 500; }
    .hist-month { display: flex; flex-direction: column; }
    .log + .log { border-top: 1px solid var(--line); }
    .log-head { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 14px 10px 12px; text-align: left; transition: background-color var(--t-fast) ease; }
    .log-head:active { background: var(--surface-2); }
    .log-date { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); }
    .log-date b { font-size: 1.0625rem; font-weight: 750; line-height: 1.1; }
    .log-date i { font-style: normal; color: var(--ink-2); font-size: 0.75rem; font-weight: 600; line-height: 1.2; }
    .log.is-workout .log-date { background: var(--accent-tint); }
    .log.is-workout .log-date b { color: var(--accent); }
    .log-main { flex: 1; min-width: 0; }
    .log-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 650; line-height: 1.3; }
    .log-title > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-title .icon { width: 15px; height: 15px; color: var(--ink-2); flex: none; }
    .log-sub { display: block; margin-top: 2px; color: var(--ink-2); font-size: 0.8125rem; line-height: 1.35; }
    .log-chevron { flex: none; width: 18px; height: 18px; color: var(--ink-3); transition: transform var(--t-med) var(--ease-out); }
    .log.is-open .log-chevron { transform: rotate(180deg); }
    .log-body-wrap { grid-template-rows: 0fr; }
    .log.is-open .log-body-wrap { grid-template-rows: 1fr; }
    .log-body { display: flex; flex-direction: column; gap: 14px; }
    .log-body > :first-child { margin-top: 4px; }
    .log-body > :last-child { margin-bottom: 14px; }
    .log-body > * { margin-left: 14px; margin-right: 14px; }
    .log-entry-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin-bottom: 6px; }
    .log-entry-name { font-size: 0.9375rem; font-weight: 650; }
    .log-entry-mach { color: var(--ink-2); font-size: 0.8125rem; }

    /* ---------- Plan ------------------------------------------------------------------ */
    .plan-days, .lib { display: flex; flex-direction: column; gap: 12px; }
    .plan-day-head { display: flex; align-items: center; gap: 2px; padding-right: 6px; }
    .plan-day-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px 4px 12px 14px; border-radius: var(--r-lg); text-align: left; }
    .plan-body-wrap, .lib-body-wrap { grid-template-rows: 0fr; }
    .plan-day.is-open .plan-body-wrap, .lib-ex.is-open .lib-body-wrap { grid-template-rows: 1fr; }
    .plan-day.is-open .log-chevron, .lib-ex.is-open .log-chevron { transform: rotate(180deg); }
    .plan-body { display: flex; flex-direction: column; gap: 8px; }
    .plan-body > :last-child { margin-bottom: 14px; }
    .plan-body > .add-set { margin: 0 12px 14px; }
    .plan-body > .hint { margin: 0 16px; }
    .plan-items { list-style: none; margin: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 4px; position: relative; }
    .plan-item {
      display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 4px 0 4px 0; border-radius: 12px; background: var(--surface-2);
      position: relative; touch-action: pan-y;
    }
    .plan-item.is-shifting { transition: transform var(--t-med) var(--ease-out); }
    .plan-item.is-dragging { z-index: 3; background: var(--surface-3); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55); transition: box-shadow var(--t-fast) ease; }
    .drag-handle { display: grid; place-items: center; flex: none; width: 44px; height: 48px; color: var(--ink-3); touch-action: none; cursor: grab; border-radius: 10px; }
    .drag-handle .icon { width: 18px; height: 18px; }
    .plan-item-main { flex: 1; min-width: 0; }
    .plan-item-name { display: block; font-size: 0.9375rem; font-weight: 650; line-height: 1.3; overflow-wrap: break-word; overflow-wrap: anywhere; }
    .plan-item-sub { display: block; color: var(--ink-2); font-size: 0.8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .lib-cat { display: flex; flex-direction: column; gap: 8px; }
    .lib-ex + .lib-ex { border-top: 1px solid var(--line); }
    .lib-body { display: flex; flex-direction: column; gap: 6px; }
    .lib-body > * { margin-left: 12px; margin-right: 12px; }
    .lib-body > :last-child { margin-bottom: 14px; }
    .mach-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); text-align: left; transition: background-color var(--t-fast) ease; }
    .mach-row:active { background: var(--surface-3); }
    .mach-row > .icon { width: 18px; height: 18px; color: var(--ink-2); }
    .mach-main { flex: 1; min-width: 0; }
    .mach-name { display: block; font-size: 0.9375rem; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; overflow-wrap: anywhere; }
    .mach-note { display: block; color: var(--ink-2); font-size: 0.8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

    /* ---------- Daten ------------------------------------------------------------------ */
    .data-section { display: flex; flex-direction: column; gap: 8px; }
    .data-section > .hint { padding: 0 4px; }
    .file-row { position: relative; cursor: pointer; }
    .file-row input[type="file"] { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 1rem; }
    .app-foot { padding: 8px 4px 0; color: var(--ink-3); font-size: 0.8125rem; text-align: center; line-height: 1.6; }
    .app-foot b { color: var(--ink-2); font-weight: 700; letter-spacing: 0.18em; }
    .backup-area {
      width: 100%; min-height: 150px; padding: 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1rem; line-height: 1.4; resize: none; /* 16 px: kein iOS-Zoom beim Antippen */
    }
    .steps { margin: 0; padding: 0 0 0 20px; color: var(--ink-2); font-size: 0.9375rem; line-height: 1.6; }
    .steps b { color: var(--ink); font-weight: 650; }

    /* Diagramm-Farben (validierte kategoriale Palette, siehe Modul 09) */
    :root {
      --viz-grid: #222733;
      --viz-axis: #363c4a;
      --viz-muted: #8b93a5;
    }

    /* Wochenziele-Sheet */
    .target-list { display: grid; }
    .target-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 6px 8px; margin: 0 -8px; border-radius: 12px; }
    .target-row + .target-row { border-top: 1px solid var(--line); }
    .target-row.is-focus { background: var(--accent-tint); border-top-color: transparent; }
    .target-row.is-focus + .target-row { border-top-color: transparent; }
    .target-name { font-size: 1rem; font-weight: 600; }
    .stepper--compact { grid-template-columns: 48px 60px 48px; gap: 6px; flex: none; }
    .stepper--compact .stepper-btn, .stepper--compact .stepper-input { height: 48px; }
    .stepper--compact .stepper-input { font-size: 1.125rem; }
  </style>
</head>
<body>
  <!-- Icon-Set: ein einheitlicher Strichstil (24er-Raster, 2 px, runde Enden) statt plattformabhängiger Emojis -->

    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></symbol>

    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></symbol>

  <!-- Startbild: sichtbar, bis die Daten geladen sind (meist < 100 ms) -->
  <div class="splash" id="splash" aria-hidden="true">
    <svg class="splash-mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <path d="M20 32h24M20 18v28M10 24v16M44 18v28M54 24v16"/>
    </svg>
    <span class="splash-word">IRONLOG</span>
  </div>

  <div class="app" id="app">
    <header class="appbar" id="appbar">
      <div class="appbar-row">
        <div class="appbar-titles">
          <h1 class="appbar-title" id="bar-title">Training</h1>
          <p class="appbar-sub" id="bar-sub" hidden></p>
        </div>
        <div class="appbar-actions" id="bar-actions"></div>
      </div>
      <div class="appbar-extra" id="bar-extra" hidden></div>
      <div class="appbar-progress" id="bar-progress" role="progressbar" aria-label="Fortschritt der Einheit" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div>
    </header>

    <main class="main" id="main">
      <section class="view" id="view-workout" aria-label="Training"></section>
      <section class="view" id="view-stats" aria-label="Statistik" hidden></section>
      <section class="view" id="view-history" aria-label="Verlauf" hidden></section>
      <section class="view" id="view-plan" aria-label="Plan" hidden></section>
      <section class="view" id="view-data" aria-label="Daten" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Hauptnavigation">
      <button type="button" class="tab is-active" data-act="tab" data-tab="workout" aria-current="page">
        <span class="tab-ico"><svg class="icon" aria-hidden="true"><use href="#i-dumbbell"/></svg></span>
        <span class="tab-label">Training</span>
      </button>

  <script>
  (() => {
    'use strict';
