        kg.length > 1 && html`<button type="button" class="${cls('chip', filter === 'ALL_KG' && 'is-active')}" data-act="prog-filter" data-v="ALL_KG" aria-pressed="${filter === 'ALL_KG' ? 'true' : 'false'}">Alle kg-Geräte (${kg.length})</button>`,
        pin.length > 1 && html`<button type="button" class="${cls('chip', filter === 'ALL_PIN' && 'is-active')}" data-act="prog-filter" data-v="ALL_PIN" aria-pressed="${filter === 'ALL_PIN' ? 'true' : 'false'}">Alle Pin-Geräte (${pin.length})</button>`,
        ...groups.map((g) => html`
          <button type="button" class="${cls('chip', filter === g.machineId && 'is-active')}" data-act="prog-filter" data-v="${g.machineId}" aria-pressed="${filter === g.machineId ? 'true' : 'false'}">
            <span class="chip-dot" style="background:${vizColor(g.slot)}"></span>${g.name}<small class="muted">· ${unitLabel(g.unit)}</small>
          </button>`)
      ];

      // Kennzahlen nur für EIN Gerät – Werte verschiedener Geräte sind nicht vergleichbar
      let tiles = '';
      let bests = '';
      let note = '';
      if (single) {
        const s = series[0];
        const pts = s.points;
        const all = s.all;
        if (pts.length) {
          const first = pts[0].y;
          const last = pts[pts.length - 1].y;
          const dl = pts.length > 1 ? deltaParts(first, last, metric) : null;
          tiles = html`
            <div class="tiles">
              <div class="tile"><p class="tile-label">Start</p><p class="tile-value">${fmtMetric(metric, first, unit)}</p><p class="tile-note num">${fmtDate(pts[0].date, 'short')}</p></div>
              <div class="tile"><p class="tile-label">Aktuell</p><p class="tile-value">${fmtMetric(metric, last, unit)}</p><p class="tile-note num">${fmtDate(pts[pts.length - 1].date, 'short')}</p></div>
              <div class="tile"><p class="tile-label">Veränderung</p><p class="${cls('tile-value', dl && dl.klass)}">${dl ? dl.abs : '–'}</p><p class="tile-note num">${dl ? dl.pct : ''}</p></div>
            </div>`;
        }
        bests = html`
          <section class="card" aria-labelledby="best-title">
            <div class="card-head"><div><h2 class="card-title" id="best-title">Bestwerte</h2><p class="card-sub">Gesamter Zeitraum · ${s.name}</p></div></div>
            <div class="card-body">
              <div class="tiles tiles--4">
                <div class="tile"><p class="tile-label">Bestes 1RM (geschätzt)</p><p class="tile-value">${fmtMetric('e1rm', Math.max(...all.map((p) => p.e1rm)), unit)}</p></div>
                <div class="tile"><p class="tile-label">Maximale Last</p><p class="tile-value">${fmtMetric('maxWeight', Math.max(...all.map((p) => p.maxWeight)), unit)}</p></div>
                <div class="tile"><p class="tile-label">Größtes Volumen</p><p class="tile-value">${fmtMetric('volume', Math.max(...all.map((p) => p.volume)), unit)}</p></div>
                <div class="tile"><p class="tile-label">Einheiten</p><p class="tile-value">${all.length}</p></div>
              </div>
            </div>
          </section>`;
        const mach = Idx.mach(s.id);
        if (mach && mach.setupNote) note = html`<div class="notice">${icon('sliders')}<div class="notice-text"><b>Einstellung</b><span>${mach.setupNote}</span></div></div>`;
      }

      const legend = !single ? html`
        <div class="legend">
          ${series.map((s) => {
            const pts = s.points;
            return html`
              <div class="legend-row">
                <span class="legend-key" style="background:${s.color}"></span>
                <span class="legend-name">${s.name}</span>
                <span class="legend-val">${pts.length
                  ? html`<b>${fmtMetric(metric, pts[pts.length - 1].y, unit)}</b> ${pts.length > 1 ? deltaMarkup(pts[0].y, pts[pts.length - 1].y, metric) : ''}`
                  : 'keine Daten im Zeitraum'}</span>
              </div>`;
          })}
        </div>` : '';

      // Liste = Tabellen-Ansicht des Diagramms (alle Einheiten, unabhängig vom Zeitraum; seitenweise nachladbar)
      const totalRows = series.reduce((n, s) => n + s.all.length, 0);
      const listLimit = Math.max(PROGRESS_PAGE, Number(ui.listLimit) || 0);
      const rows = series
        .flatMap((s) => s.all.map((p) => ({ s, p })))
        .sort((a, b) => b.p.t - a.p.t)
        .slice(0, listLimit);
      const moreRows = totalRows - rows.length;

      return html`
        <div class="field">
          <label class="field-label" for="prog-ex">Übung</label>
          <div class="select-wrap">
            <select class="input" id="prog-ex" data-change="prog-exercise">
              ${st.tracked.map((e) => html`<option value="${e.id}" ${e.id === ui.exerciseId ? raw('selected') : ''}>${e.name} (${e.sessionCount}×)</option>`)}
            </select>
            ${icon('chevron-down', 'select-chevron')}
          </div>
        </div>

        <div class="chips" role="group" aria-label="Gerät auswählen">${chips}</div>

        ${segmented({ act: 'prog-metric', value: metric, label: 'Kennzahl', options: Object.entries(METRICS).map(([value, x]) => ({ value, label: x.short })) })}

        <section class="card chart-card" aria-labelledby="chart-title">
          <div class="card-head">
            <div>
              <h2 class="card-title" id="chart-title">${m.label}</h2>
              <p class="card-sub">${unitText}</p>
            </div>
            ${segmented({ act: 'prog-range', value: ui.range, label: 'Zeitraum', small: true, options: [{ value: '1M', label: '1 M' }, { value: '1Y', label: '1 J' }, { value: 'ALL', label: 'Alle' }] })}
          </div>
          <div class="card-body">
            <div class="chart" id="prog-chart" data-morph-skip></div>
            ${legend}
            ${metric === 'e1rm' ? html`<p class="hint" style="margin-top:12px">Das geschätzte 1RM wird aus Last und Wiederholungen berechnet (Partials zählen halb). Es ist ein Vergleichswert, kein getestetes Maximum.</p>` : ''}
            ${metric === 'volume' ? html`<p class="hint" style="margin-top:12px">Volumen = Last × Wiederholungen aller Arbeitssätze einer Einheit, inklusive Drop-Stufen.</p>` : ''}
          </div>
        </section>

        ${tiles}
        ${note}
        ${bests}

        <section class="card" aria-labelledby="hist-title">
          <div class="card-head"><div>
            <h2 class="card-title" id="hist-title">${single ? 'Verlauf an diesem Gerät' : 'Verlauf'}</h2>
            <p class="card-sub">${plural(totalRows, 'Einheit', 'Einheiten')}${moreRows > 0 ? ` · die letzten ${rows.length} werden angezeigt` : ''}</p>
          </div></div>
          <div class="card-body" style="padding-top:4px">
            <div class="hist-rows">
              ${rows.map(({ s, p }) => html`
                <div class="hist-row">
                  <div class="hist-row-top">
                    <span class="hist-row-date">${fmtDate(p.date, 'medium')}${!single ? html`<small class="muted" style="font-weight:500"> · ${s.name}</small>` : ''}</span>
                    <span class="hist-row-meta">1RM ${fmtMetric('e1rm', p.e1rm, s.unit)} · Vol. ${fmtMetric('volume', p.volume, s.unit)}</span>
                  </div>
                  <div class="pills">${p.sets.map((x) => setPill(x, s.unit))}</div>
                </div>`)}
            </div>
            ${moreRows > 0 ? html`
              <button type="button" class="btn btn--soft btn--block hist-rows-more" data-act="prog-more">
                Ältere Einheiten laden (${fmtNum(moreRows, 0)} weitere)
              </button>` : ''}
          </div>
        </section>`;
    }

    /** Ein Satz als kompakte Marke: „WS 82,5 kg × 8 +1“ */
    function setPill(s, unit) {
      const tag = s.type === 'warmup' ? 'W' : s.type === 'dropset' ? 'D' : '';
      const load = unit === 'pin' ? `Pin ${fmtNum(s.weight)}` : `${fmtNum(s.weight)} kg`;
      const drops = s.type === 'dropset' && s.drops && s.drops.length
        ? html`<small>↓ ${s.drops.map((d) => `${fmtNum(d.weight)} × ${fmtNum(d.reps)}`).join(' ↓ ')}</small>` : '';
      return html`<span class="${cls('pill', `pill--${s.type}`)}">${tag ? html`<i>${tag}</i>` : ''}${load} × ${fmtNum(s.reps)}${Number(s.partials) > 0 ? html`<small>+${s.partials} P</small>` : ''}${drops}</span>`;
    }

    function drawProgressChart(st) {
      const host = $('#prog-chart');
      if (!host || !st.tracked.length) return;
      const { metric, unit } = st;
      renderLineChart(host, {
        series: st.series.map((s) => ({ id: s.id, name: s.name, color: s.color, points: s.points })),
        xMin: st.xMin,
        xMax: st.xMax,
        label: `${METRICS[metric].label} – ${exerciseName(S.ui.prog.exerciseId)}`,
        formatValue: (v) => fmtMetric(metric, v, unit),
        formatTick: (v) => fmtNum(v, v % 1 === 0 ? 0 : 1),
        emptyText: 'Keine Einheiten im gewählten Zeitraum. Wähle einen längeren Zeitraum.'
      });
    }

    Changes['prog-exercise'] = (el) => {
      S.ui.prog.exerciseId = el.value;
      S.ui.prog.filter = 'AUTO';
      S.ui.prog.listLimit = PROGRESS_PAGE;
      renderView('stats');
    };
    Actions['prog-filter'] = (el) => { S.ui.prog.filter = el.dataset.v; S.ui.prog.listLimit = PROGRESS_PAGE; haptic(); renderView('stats'); };
    Actions['prog-more'] = () => { S.ui.prog.listLimit = Math.max(PROGRESS_PAGE, Number(S.ui.prog.listLimit) || 0) + PROGRESS_PAGE; renderView('stats'); };
    Actions['prog-metric'] = (el) => { S.ui.prog.metric = el.dataset.v; haptic(); renderView('stats'); };
    Actions['prog-range'] = (el) => { S.ui.prog.range = el.dataset.v; haptic(); renderView('stats'); };

    /* ==========================================================================
       09 · DIAGRAMM
       Eigenes, abhängigkeitsfreies SVG-Liniendiagramm (ersetzt Chart.js vom CDN,
       das offline nicht verfügbar war).

       · Echte Zeitachse, „runde“ Achsenwerte, dünne Linien, zurückhaltendes Raster
       · Fadenkreuz + Tooltip per Finger/Maus/Tastatur; alle Werte stehen zusätzlich
         in der Liste unter dem Diagramm (nichts ist nur im Tooltip erreichbar)
       · Farben: feste, auf Rot-Grün-Schwäche und Kontrast geprüfte Reihenfolge.
         Eine Farbe gehört zu einem Gerät – nicht zu einem Rang.
       ========================================================================== */

    const VIZ_COLORS = ['#199e70', '#d95926', '#3987e5', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
    const DAY_MS = 86400000;
    const vizColor = (slot) => VIZ_COLORS[slot % VIZ_COLORS.length];

    function niceStep(span, target) {
      const rawStep = span / Math.max(1, target);
      const mag = 10 ** Math.floor(Math.log10(rawStep));
      const n = rawStep / mag;
      const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
      return step * mag;
    }

    function niceScale(min, max, target = 4) {
      if (!Number.isFinite(min) || !Number.isFinite(max)) return { lo: 0, hi: 1, ticks: [0, 1] };
      let lo = min;
      let hi = max;
      if (lo === hi) { const pad = Math.max(1, Math.abs(lo) * 0.1); lo -= pad; hi += pad; }
      const pad = (hi - lo) * 0.08;
      const step = niceStep(hi - lo + 2 * pad, target);
      let a = Math.floor((lo - pad) / step) * step;
      const b = Math.ceil((hi + pad) / step) * step;
      if (min >= 0 && a < 0) a = 0;
      const ticks = [];
      for (let v = a; v <= b + step / 1000; v += step) ticks.push(Math.round(v * 1000) / 1000);
      return { lo: a, hi: b, ticks };
    }

    /** Kalender-ausgerichtete Zeitmarken: Tage → Wochen (montags) → Monate → Quartale → Jahre */
    function timeTicks(xMin, xMax, maxTicks) {
      const start = new Date(xMin);
      const end = new Date(xMax);
      const out = (list, fmt) => list.filter((t) => t >= xMin && t <= xMax).map((t) => ({ t, label: fmt(new Date(t)) }));
      const dayFmt = (d) => `${d.getDate()}.${d.getMonth() + 1}.`;
      const monFmt = (d) => (d.getMonth() === 0 ? `${MONTHS_SHORT[0]} ${String(d.getFullYear()).slice(-2)}` : MONTHS_SHORT[d.getMonth()]);
      const candidates = [];

      for (const stepDays of [1, 2, 7, 14]) {
        const list = [];
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate(), 12);
        if (stepDays >= 7) while (d.getDay() !== 1) d.setDate(d.getDate() + 1); // auf Montag ausrichten
        for (; d.getTime() <= xMax; d.setDate(d.getDate() + stepDays)) list.push(d.getTime());
        candidates.push(out(list, dayFmt));
      }
      for (const stepMonths of [1, 3, 6]) {
        const list = [];
        const d = new Date(start.getFullYear(), start.getMonth(), 1, 12);
        while (d.getMonth() % stepMonths !== 0) d.setMonth(d.getMonth() + 1);
        for (; d.getTime() <= xMax; d.setMonth(d.getMonth() + stepMonths)) list.push(d.getTime());
        candidates.push(out(list, monFmt));
      }
      const years = [];
      for (let y = start.getFullYear(); y <= end.getFullYear() + 1; y++) years.push(new Date(y, 0, 1, 12).getTime());
      candidates.push(out(years, (d) => String(d.getFullYear())));

      return candidates.find((c) => c.length >= 2 && c.length <= maxTicks) || candidates.find((c) => c.length <= maxTicks && c.length >= 1) || [];
    }

    /**
     * cfg: { series: [{ id, name, color, points: [{ t, y, date, tip? }] }],
     *        xMin, xMax, formatValue(v) → "82,5 kg", formatTick(v) → "80", label, height }
     */
    function renderLineChart(host, cfg) {
      if (!host) return;
      host._cfg = cfg;
      if (!host._ro && 'ResizeObserver' in window) {
        host._ro = new ResizeObserver(() => {
          if (host._cfg && host.isConnected && host.clientWidth && host.clientWidth !== host._w) drawLineChart(host);
        });
        host._ro.observe(host);
      }
      if (!host._bound) bindChartEvents(host);
      drawLineChart(host);
    }

    function drawLineChart(host) {
      const cfg = host._cfg;
      const series = cfg.series.filter((s) => s.points.length > 0);
      host._w = host.clientWidth;
      host._active = -1;

      if (!series.length) {
        host.removeAttribute('tabindex');
        host.removeAttribute('role');
        host.textContent = '';
        const empty = document.createElement('div');
        empty.className = 'chart-empty';
        empty.textContent = cfg.emptyText || 'Keine Daten im gewählten Zeitraum.';
        host.appendChild(empty);
        host._geo = null;
        return;
      }

      const W = Math.max(240, host.clientWidth || 320);
      const H = cfg.height || 220;
      const all = series.flatMap((s) => s.points);
      const y = niceScale(Math.min(...all.map((p) => p.y)), Math.max(...all.map((p) => p.y)));
      const yLabels = y.ticks.map(cfg.formatTick);
      const mL = Math.ceil(Math.max(...yLabels.map((l) => l.length)) * 6.6) + 12;
      const mR = 16;
      const mT = 24;
      const mB = 28;
      const pw = W - mL - mR;
      const ph = H - mT - mB;
      const xMin = cfg.xMin;
      const xMax = Math.max(cfg.xMax, xMin + DAY_MS);
      const sx = (t) => mL + ((t - xMin) / (xMax - xMin)) * pw;
      const sy = (v) => mT + (1 - (v - y.lo) / (y.hi - y.lo || 1)) * ph;
      const r1 = (n) => Math.round(n * 10) / 10;
      const single = series.length === 1;

      let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" aria-hidden="true">`;
      // Raster & Achsenbeschriftung (zurückhaltend, durchgezogene Haarlinien)
      y.ticks.forEach((v, i) => {
        const yy = r1(sy(v));
        svg += `<line class="${i === 0 ? 'chart-axis' : 'chart-grid'}" x1="${mL}" x2="${W - mR}" y1="${yy}" y2="${yy}"/>`;
        svg += `<text class="chart-tick" x="${mL - 8}" y="${yy + 4}" text-anchor="end">${esc(yLabels[i])}</text>`;
      });
      const ticks = timeTicks(xMin, xMax, Math.max(2, Math.floor(pw / 58)));
      ticks.forEach((tk) => {
        const xx = r1(sx(tk.t));
        const anchor = xx < mL + 18 ? 'start' : xx > W - mR - 18 ? 'end' : 'middle';
        svg += `<text class="chart-tick" x="${xx}" y="${H - 8}" text-anchor="${anchor}">${esc(tk.label)}</text>`;
      });

      // Reihen
      series.forEach((s) => {
        const pts = s.points.map((p) => [r1(sx(p.t)), r1(sy(p.y))]);
        const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join('');
        if (single && pts.length > 1) {
          const base = r1(sy(y.lo));
          svg += `<path d="${d}L${pts[pts.length - 1][0]} ${base}L${pts[0][0]} ${base}Z" fill="${s.color}" fill-opacity="0.10"/>`;
        }
        if (pts.length > 1) svg += `<path class="chart-line" d="${d}" stroke="${s.color}"/>`;
        const dense = pts.length > 26;
        pts.forEach((p, i) => {
          if (dense && i !== pts.length - 1) return;
          svg += `<circle class="chart-dot" cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${s.color}"/>`;
        });
      });

      // Direkte Beschriftung: nur der letzte Wert einer einzelnen Reihe
      if (single) {
        const s = series[0];
        const last = s.points[s.points.length - 1];
        const lx = sx(last.t);
        const ly = sy(last.y);
        const anchor = lx > W - mR - 34 ? 'end' : 'middle';
        svg += `<text class="chart-endlabel" x="${r1(anchor === 'end' ? Math.min(W - 2, lx + 6) : lx)}" y="${r1(Math.max(12, ly - 11))}" text-anchor="${anchor}">${esc(cfg.formatValue(last.y))}</text>`;
      }

      // Auswahl-Ebene (Fadenkreuz + hervorgehobene Punkte)
      svg += `<g class="chart-active" visibility="hidden"><line class="chart-cross" y1="${mT - 6}" y2="${H - mB}"/>`;
      series.forEach((s) => { svg += `<circle class="chart-dot" r="6" fill="${s.color}" data-series="${esc(s.id)}"/>`; });
      svg += '</g></svg>';

      host.innerHTML = `${svg}<div class="chart-tip" role="status"></div>`;

      const xs = Array.from(new Set(all.map((p) => p.t))).sort((a, b) => a - b);
      host._geo = { W, H, mL, mR, mT, mB, sx, sy, xs, series, y };
      host.setAttribute('tabindex', '0');
      host.setAttribute('role', 'group');
      const first = all.reduce((a, p) => (p.t < a.t ? p : a), all[0]);
      const lastP = all.reduce((a, p) => (p.t >= a.t ? p : a), all[0]);
      host.setAttribute('aria-label',
        `${cfg.label || 'Verlauf'}: ${all.length} Messpunkte von ${fmtDate(first.date, 'numeric')} bis ${fmtDate(lastP.date, 'numeric')}. ` +
        'Mit den Pfeiltasten links und rechts einzelne Werte ansehen. Alle Werte stehen auch in der Liste darunter.');
    }

    function setChartActive(host, idx) {
      const geo = host._geo;
      if (!geo) return;
      const group = host.querySelector('.chart-active');
      const tip = host.querySelector('.chart-tip');
      const endLabel = host.querySelector('.chart-endlabel');
      if (idx < 0 || idx >= geo.xs.length) {
        host._active = -1;
        if (group) group.setAttribute('visibility', 'hidden');
        if (tip) tip.classList.remove('is-on');
        if (endLabel) endLabel.removeAttribute('visibility');
        return;
      }
      if (endLabel) endLabel.setAttribute('visibility', 'hidden'); // der Tooltip zeigt den Wert bereits
      if (idx === host._active) return;
      host._active = idx;
      const t = geo.xs[idx];
      const x = geo.sx(t);
      group.setAttribute('visibility', 'visible');
      const cross = group.querySelector('.chart-cross');
      cross.setAttribute('x1', x);
      cross.setAttribute('x2', x);

      const rows = [];
      geo.series.forEach((s, i) => {
        const dot = group.querySelectorAll('circle')[i];
        const hits = s.points.filter((q) => q.t === t);
        const p = hits.length ? hits[hits.length - 1] : null;
        if (!p) { dot.setAttribute('visibility', 'hidden'); return; }
        dot.setAttribute('visibility', 'visible');
        dot.setAttribute('cx', x);
        dot.setAttribute('cy', geo.sy(p.y));
        rows.push({ s, p });
      });

      // Tooltip mit textContent aufbauen (Gerätenamen sind Nutzerdaten)
      tip.textContent = '';
      const dateEl = document.createElement('div');
      dateEl.className = 'chart-tip-date';
      dateEl.textContent = rows.length ? fmtDate(rows[0].p.date, 'medium') : '';
      tip.appendChild(dateEl);
      rows.forEach(({ s, p }) => {
        const row = document.createElement('div');
        row.className = 'chart-tip-row';
        const key = document.createElement('span');
        key.className = 'chart-tip-key';
        key.style.background = s.color;
        const val = document.createElement('span');
        val.className = 'chart-tip-val';
        val.textContent = host._cfg.formatValue(p.y);
        row.append(key, val);
        if (geo.series.length > 1) {
          const name = document.createElement('span');
          name.className = 'chart-tip-name';
          name.textContent = s.name;
          row.appendChild(name);
        }
        tip.appendChild(row);
        if (geo.series.length === 1 && p.tip) {
          const extra = document.createElement('div');
          extra.className = 'chart-tip-extra';
          extra.textContent = p.tip;
          tip.appendChild(extra);
        }
      });
      tip.classList.add('is-on');
      const tw = tip.offsetWidth;
      const left = x > geo.W / 2 ? x - tw - 12 : x + 12;
      tip.style.transform = `translate3d(${Math.round(clamp(left, 0, Math.max(0, host.clientWidth - tw)))}px, 0, 0)`;
    }

    function bindChartEvents(host) {
      host._bound = true;
      const pick = (e) => {
        const geo = host._geo;
        if (!geo) return;
        const rect = host.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (geo.W / rect.width);
        let best = 0;
        let bestDist = Infinity;
        geo.xs.forEach((t, i) => {
          const dist = Math.abs(geo.sx(t) - x);
          if (dist < bestDist) { bestDist = dist; best = i; }
        });
        setChartActive(host, best);
      };
      host.addEventListener('pointerdown', pick);
      host.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) pick(e); });
      host.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') setChartActive(host, -1); });
      host.addEventListener('keydown', (e) => {
        const geo = host._geo;
        if (!geo) return;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault();
          const cur = host._active < 0 ? (e.key === 'ArrowLeft' ? geo.xs.length : -1) : host._active;
          setChartActive(host, clamp(cur + (e.key === 'ArrowRight' ? 1 : -1), 0, geo.xs.length - 1));
        } else if (e.key === 'Escape') {
          setChartActive(host, -1);
        }
      });
      host.addEventListener('focus', () => { if (host._geo && host._active < 0 && host.matches(':focus-visible')) setChartActive(host, host._geo.xs.length - 1); });
      host.addEventListener('blur', () => setChartActive(host, -1));
    }

    /* ==========================================================================
       10 · VERLAUF
       Nach Monaten gruppiert, kompakt zusammengefasst, Details auf Antippen.
       Es werden zunächst nur die neuesten Einträge aufgebaut (vorher wurde bei
       jedem Öffnen der komplette Verlauf auf einmal gerendert).
       ========================================================================== */

    const HISTORY_PAGE = 40;

    Views.history = {
      header() {
        const workouts = S.sessions.filter(isWorkoutSession).length;
        const rest = S.sessions.length - workouts;
        return {
          title: 'Verlauf',
          subtitle: S.sessions.length ? `${plural(workouts, 'Einheit', 'Einheiten')} · ${plural(rest, 'abgehakter Tag', 'abgehakte Tage')}` : ''
        };
      },
      render() {
        patch($('#view-history'), historyMarkup());
      }
    };

    function restLabel(sess) {
      return /\(abgehakt\)/i.test(sess.splitName) ? shortSplitName(sess.splitName) : 'Pausentag';
    }

    function historyMarkup() {
      if (!S.sessions.length) {
        return html`<div class="card">${emptyState({
          iconName: 'history',
          title: 'Noch keine Einträge',
          text: 'Abgeschlossene Einheiten und abgehakte Pausentage erscheinen hier.',
          action: html`<button type="button" class="btn btn--primary" data-act="tab" data-tab="workout">Zum Training</button>`
        })}</div>`;
      }

      const monthTotals = new Map();
      for (const s of S.sessions) {
        const key = s.date.slice(0, 7);
        if (!monthTotals.has(key)) monthTotals.set(key, { workouts: 0, rest: 0 });
        monthTotals.get(key)[isWorkoutSession(s) ? 'workouts' : 'rest']++;
      }

      const visible = S.sessions.slice(0, S.ui.historyLimit);
      const groups = [];
      for (const s of visible) {
        const key = s.date.slice(0, 7);
        let g = groups[groups.length - 1];
        if (!g || g.key !== key) { g = { key, items: [] }; groups.push(g); }
        g.items.push(s);
      }
      const remaining = S.sessions.length - visible.length;

      return html`
        ${groups.map((g) => {
          const [y, m] = g.key.split('-').map(Number);
          const t = monthTotals.get(g.key);
          return html`
            <section class="hist-month" data-key="${g.key}">
              <h2 class="month-head">
                <span>${MONTHS[m - 1]} ${y}</span>
                <span class="num">${plural(t.workouts, 'Einheit', 'Einheiten')}${t.rest ? ` · ${t.rest} abgehakt` : ''}</span>
              </h2>
              <div class="group">${g.items.map(logRow)}</div>
            </section>`;
        })}
        ${remaining > 0 ? html`
          <button type="button" class="btn btn--soft btn--lg btn--block" data-act="hist-more">
            Ältere Einträge laden (${fmtNum(remaining, 0)} weitere)
          </button>` : ''}`;
    }

    function logRow(sess) {
      const open = S.ui.historyOpen.has(sess.id);
      const isWorkout = isWorkoutSession(sess);
      const sum = sessionSummary(sess);
      const title = isWorkout ? shortSplitName(sess.splitName) : restLabel(sess);
      const sub = isWorkout
        ? [plural(sum.exercises, 'Übung', 'Übungen'), sum.sets ? plural(sum.sets, 'Arbeitssatz', 'Arbeitssätze') : 'ohne Werte abgehakt', sess.duration ? fmtDurationShort(sess.duration) : '', sum.volumeKg ? `${fmtNum(sum.volumeKg, 0)} kg` : ''].filter(Boolean).join(' · ')
        : (/\(abgehakt\)/i.test(sess.splitName) ? 'Ohne Sätze abgehakt' : 'Abgehakt');

      return html`
        <div class="${cls('log', isWorkout && 'is-workout', open && 'is-open')}" data-key="${sess.id}">
          <button type="button" class="log-head" data-act="log-toggle" data-id="${sess.id}" aria-expanded="${open ? 'true' : 'false'}">
            <span class="log-date" aria-hidden="true"><b class="num">${parseIso(sess.date).getDate()}</b><i>${WEEKDAYS_SHORT[weekdayOf(sess.date) - 1]}</i></span>
            <span class="log-main">
              <span class="log-title"><span>${title}</span>${isWorkout ? '' : icon('moon')}${sess.demo ? html`<span class="badge">Demo</span>` : ''}</span>
              <span class="log-sub num"><span class="sr-only">${fmtDate(sess.date, 'long')}, </span>${sub}</span>
            </span>
            ${icon('chevron-down', 'log-chevron')}
          </button>
          <div class="log-body-wrap" ${open ? '' : raw('inert')}>
            <div class="log-body" data-log-body>${open ? logBody(sess) : ''}</div>
          </div>
        </div>`;
    }

    /** Details eines Eintrags – werden erst beim Aufklappen aufgebaut (hält den Verlauf auch bei Jahren an Daten schnell). */
    function logBody(sess) {
      const isWorkout = isWorkoutSession(sess);
      return html`
        ${isWorkout && sess.duration > 0 ? html`<p class="hint num">Trainingsdauer: ${fmtDurationText(sess.duration)}</p>` : ''}
        ${sess.entries.map((e) => {
          const unit = unitOf(e.machineId, e);
          const real = realSets(e);
          return html`
            <div class="log-entry">
              <div class="log-entry-head">
                <span class="log-entry-name">${exerciseName(e.exerciseId, e)}</span>
                <span class="log-entry-mach">${machineName(e.machineId, e)} · ${unitLabel(unit)}</span>
              </div>
              ${real.length
                ? html`<div class="pills">${real.map((s) => setPill(s, unit))}</div>`
                : html`<p class="hint">Ohne Werte abgehakt</p>`}
            </div>`;
        })}
        <div class="btn-row">
          <button type="button" class="btn btn--tonal" data-act="log-open" data-id="${sess.id}">${icon('pencil')}${isWorkout ? 'Bearbeiten' : 'Öffnen'}</button>
          <button type="button" class="btn btn--ghost" style="flex:0 0 auto;color:var(--danger)" data-act="log-delete" data-id="${sess.id}">${icon('trash')}Löschen</button>
        </div>`;
    }

    /** Auf-/Zuklappen direkt am Element (kein komplettes Neu-Rendern nötig). */
    function toggleFold(el, set, id, openClass = 'is-open') {
      const box = el.closest('[data-key]');
      if (!box) return;
      const open = !set.has(id);
      if (open) set.add(id); else set.delete(id);
      box.classList.toggle(openClass, open);
      el.setAttribute('aria-expanded', open ? 'true' : 'false');
      const wrap = box.querySelector('.log-body-wrap, .plan-body-wrap, .lib-body-wrap');
      if (wrap) { if (open) wrap.removeAttribute('inert'); else wrap.setAttribute('inert', ''); }
    }

    Actions['log-toggle'] = (el) => {
      const id = el.dataset.id;
      const box = el.closest('.log');
      const body = box && box.querySelector('[data-log-body]');
      if (!S.ui.historyOpen.has(id) && body && !body.hasChildNodes()) {
        const sess = S.sessions.find((s) => s.id === id);
        if (sess) patch(body, logBody(sess));
        // erst im nächsten Frame aufklappen, damit die Höhe sauber animiert
        requestAnimationFrame(() => { if (!S.ui.historyOpen.has(id)) toggleFold(el, S.ui.historyOpen, id); });
        return;
      }
      toggleFold(el, S.ui.historyOpen, id);
    };

    Actions['hist-more'] = () => {
      S.ui.historyLimit += HISTORY_PAGE;
      renderView('history');
    };

    Actions['log-open'] = async (el) => {
      const sess = S.sessions.find((s) => s.id === el.dataset.id);
      if (!sess) return;
      if (!(await guardUnsaved())) return;
      openSessionInWorkout(sess);
    };

    Actions['log-delete'] = (el) => {
      S.ui.historyOpen.delete(el.dataset.id);
      deleteSessionWithUndo(el.dataset.id);
    };

    /* ==========================================================================
       11 · PLAN
       Trainingsplan (Tage + Übungen) und Übungsliste mit Geräten – als zwei klar
       getrennte Bereiche. Vorher lag der Plan unterhalb der kompletten
       Übungsliste und war nur durch langes Scrollen erreichbar.
       ========================================================================== */

    Views.plan = {
      header() {
        return {
          title: 'Plan',
          extra: segmented({
            act: 'plan-tab', value: S.ui.planTab, label: 'Bereich im Plan',
            options: [{ value: 'plan', label: 'Trainingsplan' }, { value: 'library', label: 'Übungen & Geräte' }]
          })
        };
      },
      render() {
        patch($('#view-plan'), S.ui.planTab === 'library' ? libraryMarkup() : planMarkup());
      }
    };

    Actions['plan-tab'] = (el) => {
      if (S.ui.planTab === el.dataset.v) return;
      S.ui.planTab = el.dataset.v;
      haptic();
      renderView('plan');
      window.scrollTo(0, 0);
    };

    /* ---------- Trainingsplan --------------------------------------------------------- */
    function planMarkup() {
      const todaySplit = splitForDate(todayIso());
      return html`
        <p class="hint" style="padding:0 4px">Steht ein Wochentag im Namen (z. B. „Montag – Push“ oder „Sa &amp; So – Pause“), wird der Tag an diesem Wochentag automatisch vorgeschlagen.</p>
        <div class="plan-days">${S.splits.map((sp) => planDay(sp, todaySplit))}</div>
        <button type="button" class="btn btn--tonal btn--lg btn--block" data-act="plan-add-day">${icon('plus')}Trainingstag hinzufügen</button>`;
    }

    function planDay(sp, todaySplit) {
      const open = S.ui.planOpen.has(sp.id);
      const sets = sp.items.reduce((n, it) => n + (it.targetSets || 0), 0);
      const sub = sp.isRest
        ? 'Pausentag'
        : (sp.items.length ? `${plural(sp.items.length, 'Übung', 'Übungen')} · ${plural(sets, 'Satz', 'Sätze')}` : 'Noch keine Übungen');
      return html`
        <section class="${cls('card plan-day', open && 'is-open')}" data-key="${sp.id}">
          <header class="plan-day-head">
            <button type="button" class="plan-day-toggle" data-act="plan-toggle" data-id="${sp.id}" aria-expanded="${open ? 'true' : 'false'}">
              <span class="${cls('row-icon', !sp.isRest && 'row-icon--accent')}">${icon(sp.isRest ? 'moon' : 'dumbbell')}</span>
              <span class="row-text">
                <span class="row-title">${sp.name}${todaySplit && todaySplit.id === sp.id ? html` <span class="badge badge--accent" style="vertical-align:2px">Heute</span>` : ''}</span>
                <span class="row-sub num">${sub}</span>
              </span>
              ${icon('chevron-down', 'log-chevron')}
            </button>
            <button type="button" class="icon-btn" data-act="plan-day-menu" data-id="${sp.id}" aria-label="Aktionen für ${sp.name}">${icon('more')}</button>
          </header>
          <div class="plan-body-wrap" ${open ? '' : raw('inert')}>
            <div class="plan-body">
              ${sp.isRest && sp.items.length ? html`<p class="hint">Dieser Tag ist als Pausentag markiert – die Übungen werden im Training nicht geladen.</p>` : ''}
              ${sp.isRest && !sp.items.length ? html`<p class="hint">An Pausentagen sind keine Übungen geplant. Wenn du eine Übung hinzufügst, wird daraus ein Trainingstag.</p>` : ''}
              ${sp.items.length ? html`
                <ol class="plan-items" data-sortable="${sp.id}">
                  ${sp.items.map((it, k) => {
                    const name = exerciseName(it.exerciseId, it);
                    const mach = Idx.mach(it.defaultMachineId);
                    return html`
                      <li class="plan-item" data-index="${k}">
                        <button type="button" class="drag-handle" data-drag aria-label="${name} verschieben. Zum Sortieren ziehen; alternativ über das Aktionsmenü.">${icon('grip')}</button>
                        <span class="plan-item-main">
                          <span class="plan-item-name">${name}</span>

    Actions['plan-item-menu'] = async (el) => {
      const split = splitById(el.dataset.id);
      const k = Number(el.dataset.index);
      const item = split && split.items[k];
      if (!item) return;
      const name = exerciseName(item.exerciseId, item);
      const choice = await actionSheet({
        title: name,
        subtitle: split.name,
        actions: [
          { value: 'sets', label: 'Anzahl Sätze ändern', icon: 'target', hint: `Aktuell ${plural(item.targetSets, 'Satz', 'Sätze')}` },
          { value: 'swap', label: 'Übung austauschen', icon: 'swap', hint: 'Dauerhaft in diesem Trainingstag' },
          { value: 'up', label: 'Nach oben', icon: 'arrow-up', disabled: k === 0 },
          { value: 'down', label: 'Nach unten', icon: 'arrow-down', disabled: k === split.items.length - 1 },
          { value: 'remove', label: 'Aus dem Tag entfernen', icon: 'trash', danger: true }
        ]
      });
      if (!choice) return;
      if (choice === 'sets') {
        const sets = await askTargetSets(name, item.targetSets || 2);
        if (sets === null) return;
        item.targetSets = sets;
        item.targetRepRange = `${sets} WS`;
        saveSplit(split);
        afterPlanChange(split);
      } else if (choice === 'swap') {
        const newId = await pickExercise({ title: 'Übung austauschen', intro: `„${name}“ dauerhaft in „${split.name}“ ersetzen.`, currentId: item.exerciseId, allowCreate: true });
        const ex = newId ? Idx.ex(newId) : null;
        if (!ex || newId === item.exerciseId) return;
        item.exerciseId = newId;
        item.labelOverride = ex.name;
        item.defaultMachineId = ensureMachine(newId).id;
        saveSplit(split);
        afterPlanChange(split);
        toast('Trainingsplan aktualisiert', { type: 'success' });
      } else if (choice === 'up' || choice === 'down') {
        reorderSplitItem(split, k, k + (choice === 'up' ? -1 : 1));
      } else if (choice === 'remove') {
        split.items.splice(k, 1);
        saveSplit(split);
        afterPlanChange(split);
        toast('Übung aus dem Plan entfernt', {
          action: { label: 'Rückgängig', run: () => { split.items.splice(Math.min(k, split.items.length), 0, item); saveSplit(split); afterPlanChange(split); } }
        });
      }
    };

    function reorderSplitItem(split, from, to) {
      if (to < 0 || to >= split.items.length || from === to) return;
      const [it] = split.items.splice(from, 1);
      split.items.splice(to, 0, it);
      saveSplit(split);
      afterPlanChange(split);
    }

    /* ---- Sortieren per Ziehen (mit Tastatur-/Menü-Alternative „Nach oben/unten“) ---- */
    function initSortable() {
      document.addEventListener('pointerdown', (e) => {
        const handle = e.target.closest('[data-drag]');
        if (!handle || (e.pointerType === 'mouse' && e.button !== 0)) return;
        const item = handle.closest('.plan-item');
        const list = item && item.parentElement;
        if (!list || list.children.length < 2) return;
        e.preventDefault();

        const items = Array.from(list.children);
        const from = items.indexOf(item);
        const rects = items.map((el) => el.getBoundingClientRect());
        const size = rects[from].height + (rects[1].top - rects[0].bottom);
        const startY = e.clientY;
        const scrollStart = window.scrollY;
        let lastY = e.clientY;
        let to = from;
        let raf = 0;
        let done = false;

        item.classList.add('is-dragging');
        items.forEach((el) => { if (el !== item) el.classList.add('is-shifting'); });
        haptic();
        try { handle.setPointerCapture(e.pointerId); } catch (_) { /* egal */ }

        const update = () => {
          const dy = clamp(
            lastY - startY + (window.scrollY - scrollStart),
            rects[0].top - rects[from].top,
            rects[items.length - 1].bottom - rects[from].bottom
          );
          item.style.transform = `translate3d(0, ${dy}px, 0)`;
          // Platz tauschen, sobald die gezogene Zeile die Mitte der Nachbarzeile überdeckt
          const top = rects[from].top + dy;
          const bottom = rects[from].bottom + dy;
          let idx = from;
          items.forEach((el, i) => {
            const mid = rects[i].top + rects[i].height / 2;
            if (i < from && top < mid) idx--;
            else if (i > from && bottom > mid) idx++;
          });
          if (idx !== to) haptic();
          to = idx;
          items.forEach((el, i) => {
            if (i === from) return;
            const shift = from < to && i > from && i <= to ? -size : from > to && i >= to && i < from ? size : 0;
            el.style.transform = shift ? `translate3d(0, ${shift}px, 0)` : '';
          });
        };
        const autoScroll = () => {
          if (done) return;
          const edge = 96;
          if (lastY < edge + 60) window.scrollBy(0, -10);
          else if (lastY > window.innerHeight - edge) window.scrollBy(0, 10);
          update();
          raf = requestAnimationFrame(autoScroll);
        };
        const onMove = (ev) => { lastY = ev.clientY; };
        const finish = () => {
          if (done) return;
          done = true;
          cancelAnimationFrame(raf);
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', finish);
          handle.removeEventListener('pointercancel', finish);
          items.forEach((el) => { el.classList.remove('is-shifting', 'is-dragging'); el.style.transform = ''; });
          const split = splitById(list.dataset.sortable);
          if (split && to !== from) reorderSplitItem(split, from, to);
        };
        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', finish);
        handle.addEventListener('pointercancel', finish);
        raf = requestAnimationFrame(autoScroll);
      });
    }

    function markBackupDone() {
      S.lastBackupAt = Date.now();
      Storage.bg(Storage.setMeta('lastBackupAt', S.lastBackupAt));
      if (S.ui.tab === 'data') renderView('data');
    }

    function downloadTextFile(filename, text, mime = 'application/json') {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }

    /** Datei über das System-Teilen-Menü sichern (Dateien, AirDrop, Messenger …), sonst Download. */
    function shareBackupFile(json, filename) {
      // Wichtig: synchron im Tipp-Ereignis aufrufen – Safari verwirft die Berechtigung nach einem await
      const candidates = [];
      try {
        candidates.push(new File([json], filename, { type: 'application/json' }));
        candidates.push(new File([json], filename.replace(/\.json$/, '.txt'), { type: 'text/plain' }));
      } catch (_) { /* File-Konstruktor fehlt */ }
      if (navigator.canShare && navigator.share) {
        const file = candidates.find((f) => { try { return navigator.canShare({ files: [f] }); } catch (_) { return false; } });
        if (file) {
          navigator.share({ files: [file], title: 'IRONLOG Backup' })
            .then(() => { markBackupDone(); toast('Backup gesichert', { type: 'success' }); })
            .catch((err) => {
              if (err && err.name === 'AbortError') return; // Nutzer hat abgebrochen
              downloadTextFile(filename, json);
              markBackupDone();
              toast('Backup-Datei heruntergeladen', { type: 'success' });
            });
          return;
        }
      }
      downloadTextFile(filename, json);
      markBackupDone();
      toast('Backup-Datei heruntergeladen', { type: 'success' });
    }

    function copyText(text, fallbackEl = null) {
      const ok = () => toast('Backup-Text kopiert', { type: 'success' });
      const legacy = () => {
        try {
          if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); }
          if (document.execCommand('copy')) { ok(); return; }
        } catch (_) { /* weiter unten */ }
        toast('Kopieren nicht möglich – bitte den Text manuell markieren.', { type: 'warn' });
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, legacy);
      else legacy();
    }

    async function startImport(text) {
      const res = parseBackup(text);
      if (!res.ok) {
        await choiceDialog({
          title: 'Backup konnte nicht gelesen werden',
          iconName: 'alert',
          danger: true,
          message: res.error,
          options: [{ value: 'ok', label: 'Verstanden', kind: 'soft' }]
        });
        return false;
      }
      const c = res.counts;
      const exported = res.exportedAt && !Number.isNaN(Date.parse(res.exportedAt)) ? fmtDate(toIso(new Date(res.exportedAt)), 'numeric') : null;
      const ok = await confirmDialog({
        title: 'Backup wiederherstellen?',
        iconName: 'upload',
        danger: true,
        message: `Alle aktuellen Daten auf diesem Gerät werden durch das Backup${exported ? ` vom ${exported}` : ''} ersetzt.`,
        details: html`
          <ul class="confirm-list">
            <li><span>Einträge im Verlauf</span><b>${S.sessions.length} → ${c.sessions}</b></li>
            <li><span>Übungen</span><b>${S.exercises.length} → ${c.exercises}</b></li>
            <li><span>Geräte</span><b>${S.machines.length} → ${c.machines}</b></li>
            <li><span>Trainingstage</span><b>${S.splits.length} → ${c.splits}</b></li>
          </ul>
          ${res.dropped > 0 ? html`<p class="hint" style="margin:-8px 0 20px">${plural(res.dropped, 'beschädigter Datensatz wird', 'beschädigte Datensätze werden')} übersprungen.</p>` : ''}`,
        confirmLabel: 'Daten ersetzen'
      });
      if (!ok) return false;
      try {
        await applyBackup(res.data);
      } catch (e) {
        reportError(e, 'import');
        return false;
      }
      S.ui.historyOpen.clear();
      S.ui.planOpen.clear();
      S.ui.libOpen.clear();
      S.ui.prog.exerciseId = null;
      Sheets.closeAll();
      switchTab('workout');
      toast(`Backup geladen · ${plural(c.sessions, 'Eintrag', 'Einträge')}`, { type: 'success' });

    }

    function showFatal(err) {
      console.error('[IRONLOG] Start fehlgeschlagen:', err);
      const unavailable = err && err.code === 'IDB_UNAVAILABLE';
      const box = document.createElement('div');
      box.className = 'fatal';
      box.innerHTML = html`
        <div class="fatal-box" role="alert">
          <h1>IRONLOG konnte nicht starten</h1>
          <p>${unavailable
            ? 'Deine Daten liegen weiterhin auf diesem Gerät, die Datenbank antwortet aber gerade nicht. Schließe die App vollständig und öffne sie erneut.'
            : 'Beim Laden ist ein Fehler aufgetreten. Deine gespeicherten Daten wurden nicht verändert.'}</p>
          <code>${String((err && (err.message || err.name)) || err)}</code>
          <button type="button" class="btn btn--primary btn--lg btn--block" data-reload>Neu laden</button>
        </div>`.s;
      document.body.appendChild(box);
      box.querySelector('[data-reload]').addEventListener('click', () => window.location.reload());
      document.documentElement.classList.add('is-ready');
    }

    /* ---------- Lebenszyklus ------------------------------------------------------------ */
    function setupLifecycle() {
      let lastActiveDay = todayIso();
      let hiddenAt = 0;

      // Beim Verlassen sichern – aber nur, wenn in DIESEM Fenster noch etwas Ungespeichertes anliegt (so hielt es
      // auch die alte Version). Ein Fenster, das nur angesehen wurde, schreibt nichts: sonst könnte ein alter, im
      // Hintergrund liegender Tab die Entwürfe überschreiben, die die App inzwischen an anderer Stelle gespeichert hat.
      const flush = () => { if (Persist.pending) Persist.draftNow(); };

      // Hat ein anderes Fenster der App gespeichert, lädt dieses seinen Stand neu (siehe resyncIfStale). Kurz
      // gebündelt, damit eine Folge von Schreibvorgängen nur ein Neuladen auslöst.
      let resyncTimer = 0;
      const resyncSoon = () => { clearTimeout(resyncTimer); resyncTimer = setTimeout(resyncIfStale, 400); };
      window.addEventListener('pagehide', flush);
      window.addEventListener('pageshow', (e) => { if (e.persisted) resyncIfStale(); });
      window.addEventListener('focus', () => { resyncIfStale(); });
      window.addEventListener('storage', (e) => { if (e.key === Storage.REV_KEY) resyncSoon(); });
      resyncSoon();   // falls ein anderes Fenster genau während des eigenen Starts gespeichert hat
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); flush(); return; }
        if (resyncIfStale()) return;
        // Zurück im Vordergrund: Hat inzwischen ein neuer Tag begonnen?
        const today = todayIso();
        if (today === lastActiveDay) return;
        lastActiveDay = today;
        const d = S.draft;
        const longAway = hiddenAt > 0 && Date.now() - hiddenAt > RESUME_WINDOW_MS;
        const nothingOpen = !d || (!d.touched && !hasUnsavedEdits());
        if (d && d.date !== today && (longAway || nothingOpen) && Sheets.stack.length === 0) {
          openDay(today);
          Persist.draftNow();
        }
        renderView();
      });

      // Haarlinie unter der Kopfzeile erst zeigen, wenn Inhalt darunter scrollt
      const bar = $('#appbar');
      let ticking = false;
      window.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => { bar.classList.toggle('is-scrolled', window.scrollY > 4); ticking = false; });
      }, { passive: true });

      let lastErrorToast = 0;
      Storage.onWriteError = () => {
        if (Date.now() - lastErrorToast < 8000) return;
        lastErrorToast = Date.now();
        toast('Speichern fehlgeschlagen. Bitte erstelle ein Backup und starte die App neu.', { type: 'error', duration: 7000 });
      };
      window.addEventListener('unhandledrejection', (e) => { console.error('[IRONLOG] Unbehandelter Fehler:', e.reason); });
    }

    /* ---------- PWA ---------------------------------------------------------------------- */
    function iconPngDataUrl(size, maskable) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#0a0a0c';
      g.fillRect(0, 0, size, size);
      const k = (maskable ? 0.72 : 1) * (size / 512);
      const o = (size - 512 * k) / 2;
      g.strokeStyle = '#34d399';
      g.lineWidth = 40 * k;
      g.lineCap = 'round';
      g.beginPath();
      for (const [x1, y1, x2, y2] of [[176, 256, 336, 256], [176, 172, 176, 340], [112, 212, 112, 300], [336, 172, 336, 340], [400, 212, 400, 300]]) {
        g.moveTo(o + x1 * k, o + y1 * k);
        g.lineTo(o + x2 * k, o + y2 * k);
      }
      g.stroke();
      return c.toDataURL('image/png');
    }

    /* Service Worker (sw.js): Offline-Start und Aktualisierung.
       Ablauf einer Aktualisierung: Der Service Worker liefert die App sofort aus seinem Cache und
       sieht im Hintergrund nach, ob auf dem Server eine neue index.html liegt. Wenn ja, meldet er
       UPDATE_READY – die neue Fassung liegt dann schon bereit und wird mit „Neu starten“ (oder
       beim nächsten Öffnen) aktiv. Damit der Hinweis nie verloren geht, meldet sich die App nach
       dem Start zusätzlich selbst (CLIENT_READY mit ihrer Build-Kennung). */
    const SwLink = { reg: null, lastCheck: 0, RECHECK_MS: 30 * 60 * 1000 };

    function swAvailable() {
      try { return 'serviceWorker' in navigator && Boolean(navigator.serviceWorker) && /^https?:$/.test(location.protocol); } catch (_) { return false; }
    }

    /** Hinweis „Neue Version“ – erst zeigen, wenn die Oberfläche steht (sonst holt boot() ihn nach). */
    function announceUpdate() {
      if (!App.updateReady || App.updateAnnounced || !document.documentElement.classList.contains('is-ready')) return;
      App.updateAnnounced = true;
      if (S.ui.tab === 'data') renderView('data');
      toast('Neue Version von IRONLOG geladen', { type: 'success', duration: 9000, action: { label: 'Neu starten', run: restartApp } });
    }

    /** Offene Eingaben sichern, dann neu laden – die neue Fassung liegt bereits im Cache. */
    function restartApp() {
      const reload = () => window.location.reload();
      Promise.resolve(Persist.draftNow()).then(reload, reload);
    }

    /** So früh wie möglich zuhören: Nachrichten des Service Workers dürfen nicht vor dem Laden der Daten verpuffen. */
    function listenForUpdates() {
      if (!swAvailable()) return;
      try {
        navigator.serviceWorker.addEventListener('message', (e) => {
          if (!e.data || e.data.type !== 'UPDATE_READY') return;
          App.updateReady = true;
          announceUpdate();
        });
        if (typeof navigator.serviceWorker.startMessages === 'function') navigator.serviceWorker.startMessages();
      } catch (_) { /* ohne Service Worker weiter */ }
    }

    function swHello(check = false) {
      try {
        const target = navigator.serviceWorker.controller || (SwLink.reg && SwLink.reg.active);
        if (target) target.postMessage({ type: 'CLIENT_READY', build: APP_BUILD, url: location.href.split('#')[0], check });
      } catch (_) { /* Service Worker gerade nicht erreichbar */ }
    }

    function setupServiceWorker() {
      if (!swAvailable()) return;
      const sw = navigator.serviceWorker;
      sw.addEventListener('controllerchange', () => swHello());        // eine neue sw.js hat übernommen
      sw.register('./sw.js', { updateViaCache: 'none' })
        .then((reg) => { SwLink.reg = reg; return sw.ready; })
        .then((reg) => { SwLink.reg = reg; SwLink.lastCheck = Date.now(); swHello(); })
        .catch(() => { /* keine sw.js neben der Seite (Einzeldatei) → App läuft trotzdem */ });

      // Die App bleibt auf dem Handy oft tagelang im Hintergrund geöffnet: beim Zurückkehren gelegentlich nach Updates sehen
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible' || navigator.onLine === false) return;
        if (!SwLink.reg || Date.now() - SwLink.lastCheck < SwLink.RECHECK_MS) return;
        SwLink.lastCheck = Date.now();
        swHello(true);
        try { SwLink.reg.update().catch(() => {}); } catch (_) { /* nicht unterstützt */ }
      });
    }

    /** Manifest & Icons: liegen sie als Dateien neben der index.html? Sonst Ersatz erzeugen,
        damit die App auch als einzelne Datei installierbar bleibt. Ohne Netz bleibt alles, wie es ist. */
    async function setupManifest() {
      let res;
      try { res = await fetch('manifest.webmanifest', { cache: 'no-cache' }); } catch (_) { return; }
      let valid = false;
      if (res.ok) {
        try { const m = await res.json(); valid = Boolean(m && Array.isArray(m.icons) && m.icons.length); } catch (_) { valid = false; }
      }
      if (valid) {
        try {
          const png = await fetch('icons/apple-touch-icon.png', { cache: 'no-cache' });
          const link = document.querySelector('link[rel="apple-touch-icon"]');
          if (png.ok && /image\//.test(png.headers.get('Content-Type') || '') && link) link.href = 'icons/apple-touch-icon.png';
        } catch (_) { /* eingebettetes Icon bleibt */ }
        return;
      }
      if (res.ok || res.status === 404 || res.status === 410) {
        try {
          const manifest = {
            name: 'IRONLOG', short_name: 'IRONLOG', description: 'Krafttraining protokollieren – offline, lokal, ohne Konto.',
            lang: 'de', start_url: location.href.split('#')[0], scope: new URL('./', location.href).href,
            display: 'standalone', orientation: 'portrait', background_color: '#000000', theme_color: '#000000',
            icons: [
              { src: iconPngDataUrl(192, false), sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: iconPngDataUrl(512, false), sizes: '512x512', type: 'image/png', purpose: 'any' },
              { src: iconPngDataUrl(512, true), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ]
          };
          const link = document.getElementById('manifest-link');
          if (link) link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
        } catch (_e) { /* ohne Manifest weiter */ }
      }
    }

    async function setupPwa() {
      detectStandalone();

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        App.installPrompt = e;
        if (S.ui.tab === 'data') renderView('data');
      });
      window.addEventListener('appinstalled', () => {
        App.installPrompt = null;
        detectStandalone();
        if (S.ui.tab === 'data') renderView('data');
      });

      if (navigator.storage && navigator.storage.persisted) {
        try {
          App.persisted = await navigator.storage.persisted();
          // Still nachfragen, wo es ohne Dialog geht (installierte App / Chrome-Heuristik)
          if (!App.persisted && App.isStandalone && navigator.storage.persist) App.persisted = await navigator.storage.persist();
        } catch (_) { /* nicht unterstützt */ }
      }

      if (!/^https?:$/.test(location.protocol)) return;        // als lokale Datei geöffnet: kein Manifest, kein Service Worker
      setupServiceWorker();
      await setupManifest();
    }

    /** Nach dem ersten gespeicherten Eintrag um dauerhaften Speicher bitten (sinnvoller Moment). */
    function requestPersistence() {
      if (App.persisted || !navigator.storage || !navigator.storage.persist) return;
      navigator.storage.persist().then((ok) => { App.persisted = ok; }).catch(() => {});
    }

    /* ---------- Hochfahren ---------------------------------------------------------------- */
    async function boot() {
      initDelegation();
      Back.init();
      initViewportTracking();
      initSortable();
      listenForUpdates();
      try {
        await loadState();
      } catch (err) {
        showFatal(err);
        return;
      }
      setupLifecycle();
      switchTab('workout');
      document.documentElement.classList.add('is-ready');
      announceUpdate();
      setupPwa().catch((e) => console.warn('[IRONLOG] PWA-Einrichtung:', e));
    }

    // Kleiner Diagnose-Zugang für die Browser-Konsole (nur lesend gedacht)
    window.IRONLOG = { version: APP_VERSION, build: APP_BUILD, get state() { return S; }, get storageMode() { return Storage.mode; } };

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>
